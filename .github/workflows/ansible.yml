name: Ansible

# The kiosk playbook's test, kept apart from Tests so it runs only when something the playbook reads changes: ansible/,
# the two pi/ folders it installs, or this workflow. All checks completes "Global PR Status" once the workflows that did
# run have passed, so a PR that does not touch these paths is not held up.
on:
  pull_request:
    branches: [main]
    paths:
      - 'ansible/**'
      - 'pi/wifi-panel/**'
      - 'pi/kiosk-audio/**'
      - '.github/workflows/ansible.yml'
  push:
    branches: [main]
    paths:
      - 'ansible/**'
      - 'pi/wifi-panel/**'
      - 'pi/kiosk-audio/**'
      - '.github/workflows/ansible.yml'

permissions:
  contents: read

jobs:
  # Runs the kiosk playbook with kiosk_enable_only=true (enable services, start nothing) in a Debian trixie container, checks
  # the key files and that the units are enabled but not started, and runs it again to check it changes nothing.
  ansible-playbook:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - run: docker run --rm --volume "$PWD:/repo:ro" debian:trixie bash /repo/ansible/tests/image-build.sh
