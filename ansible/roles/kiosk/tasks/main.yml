---
# What a pull does. The playbook installs files from three folders of the pulled repository (ansible/,
# pi/kiosk-audio and pi/kiosk-keyboard). Most releases change none of them (they change the web app, which the Pi loads
# from the internet), and running every task on a Pi takes minutes, so the full set (full.yml) runs only when git's tree
# ids for those folders are not the ones last applied. kiosk.service runs either way: it carries the release the settings show, which changes with
# every new commit the pull finds (the playbook only runs then), not only when those folders do.
# Without git, or on a first run (no stamp), everything runs. A hand run follows the same rule; to apply everything
# anyway, delete kiosk_applied_stamp. The stamp holds the ids of the last run that finished, handlers included.
- name: Look up the tree ids of what the playbook installs
  ansible.builtin.command:
    argv:
      - git
      - -C
      - '{{ playbook_dir }}'
      - rev-parse
      - 'HEAD:ansible'
      - 'HEAD:pi/kiosk-audio'
      - 'HEAD:pi/kiosk-keyboard'
  register: kiosk_trees
  changed_when: false
  failed_when: false

- name: Work out whether any of it changed since the last run
  ansible.builtin.set_fact:
    # kiosk_enable_only is in it because a run that only enables services has not applied what a normal run does.
    kiosk_trees_id: >-
      {{ ((kiosk_trees.stdout_lines + [kiosk_enable_only | string]) | join(' ') | hash('sha1'))
      if kiosk_trees.rc == 0 else '' }}
    kiosk_trees_applied: >-
      {{ lookup('ansible.builtin.file', kiosk_applied_stamp, errors='ignore') | default('', true) | string | trim }}

- name: Apply everything
  ansible.builtin.include_tasks: full.yml
  when: kiosk_trees_id == '' or kiosk_trees_id != kiosk_trees_applied

# full.yml has already done this when it ran.
- name: Install the kiosk service
  ansible.builtin.include_tasks: kiosk-service.yml
  when: kiosk_trees_id != '' and kiosk_trees_id == kiosk_trees_applied

# The stamp is written only when everything, handlers included, went through, so a failed run tries again.
- name: Run the pending handlers
  ansible.builtin.meta: flush_handlers

- name: Record what was applied
  ansible.builtin.copy:
    content: '{{ kiosk_trees_id }}'
    dest: '{{ kiosk_applied_stamp }}'
    owner: root
    group: root
    mode: '0644'
  # Bookkeeping, not a change to the Pi: a run that applied nothing new must report changed=0 (the playbook test relies on it).
  changed_when: false
  when: kiosk_trees_id != '' and kiosk_trees_id != kiosk_trees_applied
