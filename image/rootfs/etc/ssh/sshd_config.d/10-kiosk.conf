# SSH for maintenance, by key only and only for the admin account. sshd uses the first value it reads and Debian's
# sshd_config includes sshd_config.d first, so these settings win. KIOSK_SSH=off in /data/the-max-mix/kiosk.env keeps
# sshd from starting at all (ssh.service.d/kiosk-env.conf).
PermitRootLogin no
PasswordAuthentication no
KbdInteractiveAuthentication no
AuthenticationMethods publickey
AllowUsers admin
# The host keys live on /data (image/persist.list binds /etc/ssh/host-keys), so the Pi keeps its SSH identity across
# updates. ssh.service.d/host-keys.conf makes any that are missing.
HostKey /etc/ssh/host-keys/ssh_host_ed25519_key
HostKey /etc/ssh/host-keys/ssh_host_ecdsa_key
HostKey /etc/ssh/host-keys/ssh_host_rsa_key
