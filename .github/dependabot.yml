version: 2

# Daily update PRs. Minor and patch updates are grouped per ecosystem to keep the number of PRs down; major
# updates arrive one at a time. Security updates are opened separately by GitHub and are not affected by the schedule.
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: daily
    commit-message:
      prefix: "chore(deps)"
    groups:
      root-minor-patch:
        update-types: [ minor, patch ]

  - package-ecosystem: npm
    directory: /client
    schedule:
      interval: daily
    commit-message:
      prefix: "chore(deps)"
    groups:
      client-minor-patch:
        update-types: [ minor, patch ]

  - package-ecosystem: npm
    directory: /server
    schedule:
      interval: daily
    commit-message:
      prefix: "chore(deps)"
    groups:
      server-minor-patch:
        update-types: [ minor, patch ]

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: daily
    commit-message:
      prefix: "chore(ci)"
    groups:
      actions-minor-patch:
        update-types: [ minor, patch ]
