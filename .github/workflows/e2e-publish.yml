name: E2E reports and screenshots

# This workflow runs on the default branch after Tests has reported its result.
on:
  workflow_run:
    workflows: [Tests]
    types: [completed]

permissions:
  actions: read
  contents: read

jobs:
  report:
    if: >-
      ${{ (github.event.workflow_run.conclusion == 'success' || github.event.workflow_run.conclusion == 'failure') &&
      github.event.workflow_run.head_repository.full_name == github.repository &&
      github.event.workflow_run.actor.login != 'dependabot[bot]' }}
    uses: ./.github/workflows/e2e-report.yml
    with:
      source_run_id: ${{ format('{0}', github.event.workflow_run.id) }}

  screenshots:
    needs: report
    if: ${{ github.event.workflow_run.event == 'pull_request' }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      actions: read
      contents: write
      pull-requests: write
    # One writer at a time, because each push replaces the branch.
    concurrency:
      group: gh-pages
      cancel-in-progress: false
    env:
      GH_TOKEN: ${{ github.token }}
      REPO: ${{ github.repository }}
      SOURCE_RUN_ID: ${{ github.event.workflow_run.id }}
      SOURCE_ATTEMPT: ${{ github.event.workflow_run.run_attempt }}
      HEAD_SHA: ${{ github.event.workflow_run.head_sha }}
      HEAD_BRANCH: ${{ github.event.workflow_run.head_branch }}
    steps:
      # A workflow_run event can have an empty pull_requests array.
      - name: Find the open PR for this run
        id: latest
        run: |
          current_attempt=$(gh api "repos/$REPO/actions/runs/$SOURCE_RUN_ID" --jq .run_attempt)
          [[ $current_attempt == "$SOURCE_ATTEMPT" ]] || exit 0
          gh api --method GET "repos/$REPO/pulls" -f state=open -f base=main -f head="${REPO%%/*}:$HEAD_BRANCH" |
            jq -r --arg repo "$REPO" --arg sha "$HEAD_SHA" '
              [.[] | select(.head.repo.full_name == $repo and .head.sha == $sha)] |
              if length == 1 then .[0] | "PR=\(.number)\nBASE_SHA=\(.base.sha)" else empty end
            ' > pr.env
          [[ -s pr.env ]] || exit 0
          cat pr.env >> "$GITHUB_ENV"
          source pr.env
          echo "FOLDER=pr-$PR/$SOURCE_RUN_ID-$SOURCE_ATTEMPT" >> "$GITHUB_ENV"
          echo "latest=true" >> "$GITHUB_OUTPUT"
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        if: ${{ steps.latest.outputs.latest }}
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        if: ${{ steps.latest.outputs.latest }}
        with:
          node-version-file: .nvmrc
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        if: ${{ steps.latest.outputs.latest }}
        with:
          name: playwright-report
          path: results
      # The branch is rebuilt as a single commit each time, so old reports do not pile up in the repository's history.
      # Each run gets a new folder, which keeps GitHub's image cache from showing an earlier run's screenshots.
      - name: Publish to the gh-pages branch
        if: ${{ steps.latest.outputs.latest }}
        run: |
          git init --quiet site && cd site
          git remote add origin "https://x-access-token:${GH_TOKEN}@github.com/${REPO}.git"
          if git fetch --quiet --depth 1 origin gh-pages; then git checkout --quiet FETCH_HEAD; fi
          git checkout --quiet --orphan publish
          rm -rf "${FOLDER%/*}"
          mkdir -p "$FOLDER/shots"
          touch .nojekyll
          cp -r ../results/playwright-report "$FOLDER/report"
          if [[ -d ../results/test-results ]]; then
            rsync -a --include='*/' --include='*.png' --exclude='*' --prune-empty-dirs \
              ../results/test-results/ "$FOLDER/shots/"
          fi
          git add -A
          git -c user.name='github-actions[bot]' -c user.email='41898282+github-actions[bot]@users.noreply.github.com' \
            commit --quiet -m "Screenshots and reports of the open pull requests"
          git push --quiet --force origin publish:gh-pages
      - name: Update the pull request comment
        if: ${{ steps.latest.outputs.latest }}
        env:
          SHOTS_DIR: site/${{ env.FOLDER }}/shots
          SHOTS_URL: https://raw.githubusercontent.com/${{ github.repository }}/gh-pages/${{ env.FOLDER }}/shots
          REPORT_URL: https://${{ github.repository_owner }}.github.io/${{ github.event.repository.name }}/${{ env.FOLDER }}/report/
          BASELINES_FILE: baselines.txt
          CHANGED_FILES_FILE: changed-files.txt
          RESULTS_FILE: results/test-results/results.json
          RUN_URL: ${{ github.event.workflow_run.html_url }}
        run: |
          gh api --paginate "repos/$REPO/pulls/$PR/files" \
            --jq '.[] | select(.filename | startswith("e2e/screenshots/")) | "\(.status) \(.filename)"' > baselines.txt
          gh api --paginate "repos/$REPO/pulls/$PR/files" --jq '.[].filename' > changed-files.txt
          E2E_RESULT=$(gh api --paginate "repos/$REPO/actions/runs/$SOURCE_RUN_ID/jobs" |
            jq -rs '[.[].jobs[] | select(.name | startswith("e2e / test ("))] |
              if length == 3 and all(.conclusion == "success") then "success" else "failure" end')
          E2E_RESULT="$E2E_RESULT" node scripts/screenshot-comment.ts > comment.md
          ids=$(gh api --paginate "repos/$REPO/issues/$PR/comments" --jq \
            '.[] | select(.user.login == "github-actions[bot]" and (.body | startswith("<!-- playwright-screenshots -->"))) | .id')
          id=$(head -n 1 <<< "$ids")
          if [[ -n $id ]]; then
            gh api --method PATCH "repos/$REPO/issues/comments/$id" -F body=@comment.md > /dev/null
          else
            gh api --method POST "repos/$REPO/issues/$PR/comments" -F body=@comment.md > /dev/null
          fi
