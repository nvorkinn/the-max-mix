version: 2

# Daily update PRs. Minor and patch updates are grouped per ecosystem to keep the number of PRs down; major
# updates arrive one at a time. Security updates are opened separately by GitHub and are not affected by the schedule.
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: daily
    commit-message:
      prefix: 'chore(deps)'
    # typescript-eslint cannot load TypeScript 7 (the native compiler has no JS API) yet; its peer range is <6.1.
    ignore:
      - dependency-name: typescript
        update-types: [version-update:semver-major, version-update:semver-minor]
    groups:
      npm-minor-patch:
        update-types: [minor, patch]

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: daily
    commit-message:
      prefix: 'chore(ci)'
    groups:
      actions-minor-patch:
        update-types: [minor, patch]
