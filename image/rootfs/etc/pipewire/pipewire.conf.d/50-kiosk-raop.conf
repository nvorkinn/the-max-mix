# Finds AirPlay (RAOP) speakers through Avahi and makes a PipeWire sink for each, with a short latency so the music
# follows the touch screen's controls quickly. The server links Spotify Soloist's stream to the chosen sinks.
#
# And a silent sink, kiosk_silent (SILENT_SINK in server/src/pipewire.ts), for when no speaker is chosen: the
# kiosk has no speaker of its own, so the default sink would otherwise be whichever AirPlay speaker WirePlumber picked,
# and that speaker would play. Its high session priority makes it the default, so Soloist's stream joins it when it
# starts; it keeps the stream running, with its position moving, and nothing leaves the Pi.
#
# And kiosk_sonos (TABLET_SINK in server/src/tablet-stream.ts): while Sonos rooms play along with the tablet, the
# server links Soloist's stream here too, and serves what it plays to the rooms as a FLAC stream. Never the default.
context.objects = [
    {   factory = adapter
        args = {
            factory.name = support.null-audio-sink
            node.name = kiosk_silent
            node.description = "Kiosk (no speaker)"
            media.class = Audio/Sink
            audio.position = [ FL FR ]
            priority.session = 3000
            object.linger = true
            monitor.channel-volumes = true
        }
    }
    {   factory = adapter
        args = {
            factory.name = support.null-audio-sink
            node.name = kiosk_sonos
            node.description = "Sonos (from this tablet)"
            media.class = Audio/Sink
            audio.position = [ FL FR ]
            audio.rate = 44100
            priority.session = 0
            object.linger = true
        }
    }
]

context.modules = [
    {   name = libpipewire-module-raop-discover
        args = {
            raop.latency.ms = 500
            stream.rules = [
                {   matches = [ { raop.ip = "~.*" } ]
                    actions = {
                        create-stream = {
                            raop.latency.ms = 500
                        }
                    }
                }
            ]
        }
    }
]
