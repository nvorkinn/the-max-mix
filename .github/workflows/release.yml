name: Release

# Releases happen here and only here (vercel.json turns off Vercel's own deploy of main). Push a version tag from main
# (git tag v1.2.3 && git push origin v1.2.3) to build the app, deploy it to Vercel production and then publish the GitHub
# release for the tag, with notes generated from the merged pull requests. The Raspberry Pi kiosks follow the latest
# GitHub release (kiosk_pull_ref: latest), so the release is published only once the deploy has worked, and the Pis and
# the web app move together.
#
# Run it by hand with an existing tag to redeploy that release and mark it as the latest one again, which also rolls the
# Pis back (or forward) to it at their next update. Needs the repository secrets VERCEL_TOKEN, VERCEL_ORG_ID and
# VERCEL_PROJECT_ID.
on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      tag:
        description: Existing tag to deploy and mark as the latest release (for example v1.2.3)
        required: true
        type: string

permissions:
  contents: read

# Never run two production deploys at once, and never cancel one that is under way.
concurrency:
  group: release
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      TAG: ${{ inputs.tag || github.ref_name }}
      VERCEL_CLI: vercel@64.4.0
      VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
      VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
      VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
    steps:
      - name: Check the tag and the secrets
        run: |
          if [[ ! $TAG =~ ^v[0-9A-Za-z][0-9A-Za-z._-]*$ ]]; then
            echo "::error::The tag must look like v1.2.3, got: $TAG"
            exit 1
          fi
          for name in VERCEL_TOKEN VERCEL_ORG_ID VERCEL_PROJECT_ID; do
            if [[ -z ${!name} ]]; then
              echo "::error::The repository secret $name is not set (Settings > Secrets and variables > Actions)."
              exit 1
            fi
          done
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: refs/tags/${{ env.TAG }}
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: npm
      # The build gets the release's version (v1.2.3 becomes 1.2.3) without committing anything; npm rejects a tag that is
      # not a valid semantic version.
      - name: Set the version from the tag
        run: npm version "${TAG#v}" --no-git-tag-version --allow-same-version
      # Build on this runner and upload only the finished files (--prebuilt). Without it Vercel downloads the source and
      # runs npm ci and the build again on its own machine.
      # `vercel build` runs the install and build commands from vercel.json here (npm ci uses the npm cache from
      # setup-node), so a release that does not build still fails before anything is deployed.
      - name: Get the Vercel production settings
        run: npx --yes "$VERCEL_CLI" pull --yes --environment=production --token="$VERCEL_TOKEN"
      - name: Build
        run: npx --yes "$VERCEL_CLI" build --prod --token="$VERCEL_TOKEN"
      - name: Deploy to Vercel production
        run: npx --yes "$VERCEL_CLI" deploy --prebuilt --prod --yes --token="$VERCEL_TOKEN"

  # A separate job, so that only this step, which runs no code from the repository, can write to it.
  publish:
    needs: release
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write
    env:
      TAG: ${{ inputs.tag || github.ref_name }}
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
    steps:
      # A new tag gets a new release; a tag that already has one (a redeploy or rollback) only becomes the latest again.
      - name: Publish the GitHub release
        run: |
          if gh release view "$TAG" > /dev/null 2>&1; then
            gh release edit "$TAG" --draft=false --prerelease=false --latest
          else
            gh release create "$TAG" --verify-tag --generate-notes --latest --title "$TAG"
          fi
