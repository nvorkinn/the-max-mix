name: Tests

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      # The coverage run executes the app tests (and enforces the thresholds), so `npm test` would run them twice; only the
      # Wi-Fi panel tests are left to run on their own.
      - run: npm run test:coverage
      - run: npm run test:wifi-panel
      - name: Coverage summary
        if: ${{ !cancelled() }}
        run: node scripts/coverage-summary.ts >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: ${{ !cancelled() }}
        with:
          name: coverage
          path: coverage
          if-no-files-found: ignore
      - run: npm run build

  # Runs the kiosk playbook with kiosk_enable_only=true (enable services, start nothing) in a Debian trixie container, checks the key
  # files and that the units are enabled but not started, and runs it again to check it changes nothing.
  #
  # It only runs when something the playbook reads changed: ansible/, the two pi/ folders it installs, or this workflow.
  # The job itself always runs and passes when there is nothing to test, so "Global PR Status" never waits for a check
  # that was skipped.
  ansible-playbook:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0
      - name: Check whether the playbook or its files changed
        id: changes
        env:
          BASE: ${{ github.event.pull_request.base.sha || github.event.before }}
        run: |
          paths=(ansible pi/wifi-panel pi/kiosk-audio .github/workflows/tests.yml)
          # A new branch or an unknown base has nothing to compare with, so it is tested.
          run=true
          if [[ -n $BASE && ! $BASE =~ ^0+$ ]] && git cat-file -e "$BASE^{commit}" 2> /dev/null &&
            git diff --quiet "$BASE...HEAD" -- "${paths[@]}"; then
            echo "Nothing the playbook reads changed; skipping the playbook test."
            run=false
          fi
          echo "run=$run" >> "$GITHUB_OUTPUT"
      - if: steps.changes.outputs.run == 'true'
        run: docker run --rm --volume "$PWD:/repo:ro" debian:trixie bash /repo/ansible/tests/image-build.sh

  # Browser smoke test of the built app in demo mode, served by `vite preview`. Runs in parallel with `tests` and uses the Google Chrome that
  # ships on ubuntu-latest, so no browser download is needed.
  e2e:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci --ignore-scripts
      - run: npm run build
      - run: npm run test:e2e
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: ${{ failure() }}
        with:
          name: playwright-report
          path: |
            e2e/playwright-report
            e2e/test-results
          if-no-files-found: ignore
