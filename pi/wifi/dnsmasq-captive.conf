# Captive portal for the THE-MAX-MIX-SETUP hotspot: NetworkManager's "shared" mode runs its own dnsmasq, which reads
# this directory. Every name resolves to the Pi's gateway address, so a phone's connectivity check lands on the portal
# and the phone offers to "sign in". The address must match GATEWAY in logic.py (the hotspot pins 10.42.0.1/24).
# Installed by pi/wifi/install.sh. It applies to every "shared" connection on this machine; the kiosk uses none other.
address=/#/10.42.0.1
