---
# What a pull does. The web app and kiosk.service are installed on every run (below). The rest of the setup is in five
# parts (tasks/full/, listed in kiosk_sections), and running all of them on a Pi takes minutes even when nothing changed,
# so each part runs only when what it installs changed since it last ran: its task file, the files and templates it
# copies, and what every part reads (the defaults, the handlers, this file, /etc/the-max-mix/kiosk-vars.yml, the host
# name). A part also runs once it last ran more than kiosk_full_run_after_days ago, which puts back anything changed on
# the Pi by hand or by a package upgrade. kiosk_applied_stamp records, for each part, what it last applied and when; it
# is written only once the run, handlers included, went through, so a failed run tries again. A hand run follows the
# same rule (it does not see -e variables); to apply everything, delete kiosk_applied_stamp.
- name: Work out what each part of the setup installs
  ansible.builtin.shell:
    cmd: |
      set -euo pipefail
      cd "$ROOT"
      # The checksums of these files, and of every file in these folders, as one id.
      digest() {
        local path
        for path in "$@"; do
          if [[ -d $path ]]; then
            find "$path" -type f -not -path '*/node_modules/*' -print0 | sort -z | xargs -0 -r sha1sum
          elif [[ -e $path ]]; then
            sha1sum "$path"
          else
            echo "missing $path"
          fi
        done | sha1sum | cut -c1-40
      }
      shared=$(digest $SHARED)
      while read -r name inputs; do
        [[ -n $name ]] || continue
        # shellcheck disable=SC2086  # The inputs are separate paths.
        echo "$name $( (echo "$shared $EXTRA"; digest $inputs) | sha1sum | cut -c1-40)"
      done <<< "$SECTIONS"
    executable: /bin/bash
  environment:
    ROOT: '{{ playbook_dir }}/..'
    SHARED: >-
      ansible/local.yml ansible/roles/kiosk/tasks/main.yml ansible/roles/kiosk/defaults/main.yml
      ansible/roles/kiosk/handlers/main.yml ansible/roles/kiosk/files/install-files.ts /etc/the-max-mix/kiosk-vars.yml
    EXTRA: '{{ kiosk_enable_only | string }} {{ kiosk_hostname }}'
    SECTIONS: |
      {% for section in kiosk_sections %}
      {{ section.name }} ansible/roles/kiosk/tasks/full/{{ section.name }}.yml {{ section.inputs | join(' ') }}
      {% endfor %}
  register: kiosk_section_digests
  changed_when: false

- name: Work out which parts to run
  ansible.builtin.set_fact:
    kiosk_section_ids: "{{ dict(kiosk_section_digests.stdout_lines | map('split', ' ')) }}"
    kiosk_applied: >-
      {{ lookup('ansible.builtin.file', kiosk_applied_stamp, errors='ignore') | default('{}', true) | from_json }}
    kiosk_now: "{{ now(utc=true, fmt='%s') | int }}"

- name: List the parts to run
  ansible.builtin.set_fact:
    kiosk_sections_due: >-
      {%- set due = [] -%}
      {%- for section in kiosk_sections -%}
      {%- set last = kiosk_applied[section.name] | default({}) -%}
      {%- if last.id | default('') != kiosk_section_ids[section.name]
        or kiosk_now | int - last.at | default(0) | int > kiosk_full_run_after_days | int * 86400 -%}
      {%- set _ = due.append(section.name) -%}
      {%- endif -%}
      {%- endfor -%}
      {{ due }}

# The web app changes with every release, so it is installed on every run. Each release gets a folder
# of its own, written once; `next` then points at it, and the kiosk serves it from its next start (kiosk-app-switch), when
# the page loads again. Nothing is installed when there is no build: a branch checkout before kiosk-pull fetched one, or
# the playbook test.
- name: Find the web app this run installs
  ansible.builtin.set_fact:
    kiosk_app_source: '{{ kiosk_app_from[0].source | default("") }}'
    kiosk_app_release: '{{ kiosk_app_from[0].commit | default("") }}'
  vars:
    kiosk_branch_release: >-
      {{ lookup('ansible.builtin.file', kiosk_branch_app_dir ~ '/release.json', errors='ignore')
      | default('{}', true) | from_json }}
    kiosk_app_from: >-
      {{ ([{'source': playbook_dir ~ '/../app', 'commit': kiosk_release_info.commit | default('') | string}]
      if (playbook_dir ~ '/../app/index.html') is file else [])
      + ([{'source': kiosk_branch_app_dir ~ '/app', 'commit': kiosk_branch_release.commit | default('') | string}]
      if (kiosk_branch_app_dir ~ '/app/index.html') is file else []) }}

# One program, as a module run costs seconds on a Pi. Prints what it did: "copied", and "next" when the kiosk is to switch
# (or "forgot next" when a release installed again, the same one or a rollback to the one already served, leaves nothing
# to switch to).
- name: Install the web app
  ansible.builtin.shell:
    cmd: |
      set -euo pipefail
      dest=$APP_DIR/releases/$RELEASE
      if [[ ! -e $dest/index.html ]]; then
        mkdir -p "$APP_DIR/releases"
        rm -rf "$dest.tmp"
        cp -R "$SOURCE" "$dest.tmp"
        chmod -R u=rwX,go=rX "$dest.tmp"
        mv -T "$dest.tmp" "$dest"
        echo copied
      fi
      if [[ $(readlink "$APP_DIR/current" || true) == "releases/$RELEASE" ]]; then
        if [[ -L $APP_DIR/next || -e $APP_DIR/next ]]; then
          rm -f "$APP_DIR/next"
          echo forgot next
        fi
      elif [[ $(readlink "$APP_DIR/next" || true) != "releases/$RELEASE" ]]; then
        ln -sfn "releases/$RELEASE" "$APP_DIR/next"
        echo next
      fi
    executable: /bin/bash
  environment:
    SOURCE: '{{ kiosk_app_source }}'
    APP_DIR: '{{ kiosk_app_dir }}'
    RELEASE: '{{ kiosk_app_release }}'
  register: kiosk_app_installed
  changed_when: kiosk_app_installed.stdout | length > 0
  when: kiosk_app_source | length > 0 and kiosk_app_release is match('^[0-9a-f]{7,40}$')

# Runs no module, so it costs nothing: it only passes the change on to the handler.
- name: Serve the new web app from the next kiosk start
  ansible.builtin.debug:
    msg: The kiosk serves the new web app from its next start.
  when: "'next' in kiosk_app_installed.stdout_lines | default([])"
  changed_when: true
  notify: Ask for a kiosk restart

# Before the parts, which enable it. With the shell rather than install-files.ts, as Node.js is not there yet on the first
# run. Prints the unit's path when it changed it.
- name: Install the kiosk service
  ansible.builtin.shell:
    cmd: |
      set -euo pipefail
      next=$(mktemp "$UNIT.XXXXXX")
      cat > "$next"
      if cmp -s "$next" "$UNIT" && [[ $(stat -c '%a %u %g' "$UNIT") == '644 0 0' ]]; then
        rm "$next"
      else
        chmod 0644 "$next"
        mv "$next" "$UNIT"
        echo "$UNIT"
      fi
    executable: /bin/bash
    stdin: "{{ lookup('ansible.builtin.template', 'kiosk.service.j2') }}"
    stdin_add_newline: false
  environment:
    UNIT: /etc/systemd/system/kiosk.service
  register: kiosk_service_installed
  changed_when: kiosk_service_installed.stdout | length > 0
  notify:
    - Reload systemd
    - Ask for a kiosk restart

- name: Apply the parts that changed
  ansible.builtin.include_tasks: full/{{ kiosk_section }}.yml
  loop: '{{ kiosk_sections_due }}'
  loop_control:
    loop_var: kiosk_section

# The stamp is written only when everything, handlers included, went through, so a failed run tries again.
- name: Run the pending handlers
  ansible.builtin.meta: flush_handlers

- name: Record what was applied
  ansible.builtin.command:
    argv: [node, '{{ kiosk_install_files }}']
    stdin: >-
      {%- set applied = dict(kiosk_applied) -%}
      {%- for name in kiosk_sections_due -%}
      {%- set _ = applied.update({name: {'id': kiosk_section_ids[name], 'at': kiosk_now | int}}) -%}
      {%- endfor -%}
      {{ [{'path': kiosk_applied_stamp, 'mode': '0644', 'content': applied | to_json}] | to_json }}
  # Bookkeeping, not a change to the Pi: a run that applied nothing new must report changed=0 (the playbook test relies on it).
  changed_when: false
  when: kiosk_sections_due | length > 0
