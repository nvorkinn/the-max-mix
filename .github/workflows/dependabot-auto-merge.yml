name: Dependabot auto-merge

# Turns on auto-merge for Dependabot pull requests that only contain patch and minor updates (grouped updates
# included), so they merge by themselves once the required checks pass. Major updates are left for a manual review.
# Auto-merge waits for everything branch protection requires, so this does not skip any check. It is not a pull request
# check itself, so it is not listed in all-checks.yml.
on:
  pull_request:

permissions:
  contents: write
  pull-requests: write

jobs:
  auto-merge:
    if: ${{ github.event.pull_request.user.login == 'dependabot[bot]' }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - id: metadata
        uses: dependabot/fetch-metadata@25dd0e34f4fe68f24cc83900b1fe3fe149efef98 # v3.1.0
        with:
          github-token: ${{ github.token }}
      - name: Enable auto-merge for patch and minor updates
        env:
          GH_TOKEN: ${{ github.token }}
          PR_URL: ${{ github.event.pull_request.html_url }}
          UPDATES: ${{ steps.metadata.outputs.updated-dependencies-json }}
        run: |
          if jq -e 'length > 0 and all(.[]; .updateType == "version-update:semver-patch" or .updateType == "version-update:semver-minor")' <<< "$UPDATES" > /dev/null; then
            gh pr merge --auto --merge "$PR_URL"
          else
            echo "Not a patch or minor only update; leaving it for a manual review."
          fi
