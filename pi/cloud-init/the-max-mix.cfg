# THE MAX MIX's addition to cloud-init's own settings, baked into the ready-made flash image (build-image.sh) as
# /etc/cloud/cloud.cfg.d/99-the-max-mix.cfg. Raspberry Pi Imager's user-data does not set power_state, so this stays.
# Once the first-boot setup (first-boot, run by cloud-init's scripts_per_instance) has finished, reboot: the playbook
# changed boot settings (the kernel command line, config.txt).
power_state:
  mode: reboot
  message: THE MAX MIX kiosk is set up
