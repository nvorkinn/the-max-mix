name: Release

# Shown on the GitHub dashboard among the running releases.
# dashboard: release

# Releases happen here and only here. Push a version tag from main (git tag v1.2.3 && git push origin v1.2.3) to build
# the app, copy it to the server over Tailscale and then publish the GitHub release for the tag, with notes generated
# from the merged pull requests. The Raspberry Pi kiosks follow the latest GitHub release (kiosk_pull_ref: latest), so
# the release is published only once the deploy has worked, and the Pis and the web app move together.
#
# Run it by hand with an existing tag to redeploy that release and mark it as the latest one again, which also rolls the
# Pis back (or forward) to it at their next update. The runner joins the tailnet with its GitHub identity (id-token), so
# it needs no repository secrets.
on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      tag:
        description: Existing tag to deploy and mark as the latest release (for example v1.2.3)
        required: true
        type: string

permissions:
  id-token: write
  contents: read

# Never run two production deploys at once, and never cancel one that is under way.
concurrency:
  group: release
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      TAG: ${{ inputs.tag || github.ref_name }}
    steps:
      - name: Check the tag
        run: |
          if [[ ! $TAG =~ ^v[0-9A-Za-z][0-9A-Za-z._-]*$ ]]; then
            echo "::error::The tag must look like v1.2.3, got: $TAG"
            exit 1
          fi
      # The Pis run whatever the latest release holds as root (see SECURITY.md), so only release a commit that is on main.
      - name: Check the tag is on main
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          sha=$(gh api "repos/$GH_REPO/commits/$TAG" --jq .sha)
          status=$(gh api "repos/$GH_REPO/compare/$sha...main" --jq .status)
          if [[ $status != ahead && $status != identical ]]; then
            echo "::error::$TAG ($sha) is not on main. Only tag commits on main."
            exit 1
          fi
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: refs/tags/${{ env.TAG }}
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: npm
      # The build gets the release's version (v1.2.3 becomes 1.2.3) without committing anything; npm rejects a tag that is
      # not a valid semantic version.
      - name: Set the version from the tag
        run: npm version "${TAG#v}" --no-git-tag-version --allow-same-version
      # Build before joining the tailnet, so a release that does not build fails before anything is deployed.
      - run: npm ci
      - name: Build
        run: npm run build
      - name: Tailscale
        uses: tailscale/github-action@064b10558093f38325e838ddea35486bdc6b1d5c # v4.4.0
        with:
          oauth-client-id: TBqTMhW4Q811CNTRL-k6UF5xqLhW11CNTRL
          audience: api.tailscale.com/TBqTMhW4Q811CNTRL-k6UF5xqLhW11CNTRL
          tags: tag:ci
      # The release directory is named after the tag's commit (the checkout), which on a run by hand is not github.sha.
      - name: Deploy
        env:
          APP: the-max-mix
          HOST: deploy@nikolai-server
        run: |
          ssh_opts=(-o StrictHostKeyChecking=accept-new)
          rel="/srv/releases/$APP/$(git rev-parse HEAD)"
          ssh "${ssh_opts[@]}" "$HOST" "mkdir -p $rel"
          rsync -az --delete -e "ssh ${ssh_opts[*]}" dist/ "$HOST:$rel/"
          ssh "${ssh_opts[@]}" "$HOST" "ln -sfn $rel /srv/sites/$APP.tmp && mv -T /srv/sites/$APP.tmp /srv/sites/$APP"

  # A separate job, so that only this step, which runs no code from the repository, can write to it.
  publish:
    needs: release
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write
    env:
      TAG: ${{ inputs.tag || github.ref_name }}
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
    steps:
      # A new tag gets a new release; a tag that already has one (a redeploy or rollback) only becomes the latest again.
      - name: Publish the GitHub release
        run: |
          if gh release view "$TAG" > /dev/null 2>&1; then
            gh release edit "$TAG" --draft=false --prerelease=false --latest
          else
            gh release create "$TAG" --verify-tag --generate-notes --latest --title "$TAG"
          fi
