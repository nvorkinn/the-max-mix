---
# A part of the setup (tasks/main.yml runs it when what it installs changed, or a week after it last ran).
# Updates: the pull, restart, SSH key and Soloist update units, then enabling and starting what runs from boot.

# Updates -------------------------------------------------------------------------------------------------------------
- name: full | units | Install the update and SSH key units
  ansible.builtin.command:
    argv: [node, '{{ kiosk_install_files }}']
    stdin: '{{ kiosk_units | to_json }}'
  vars:
    kiosk_units: >-
      {%- set units = [] -%}
      {%- for name in ['kiosk-pull.service', 'kiosk-pull.timer', 'kiosk-restart.service', 'kiosk-restart.timer',
        'kiosk-soloist-update.service', 'kiosk-soloist-update.timer']
        + (['kiosk-ssh-keys.service', 'kiosk-ssh-keys.timer'] if kiosk_admin_github_user else []) -%}
      {%- set _ = units.append({'path': '/etc/systemd/system/' ~ name, 'mode': '0644',
        'content': lookup('ansible.builtin.template', name ~ '.j2')}) -%}
      {%- endfor -%}
      {{ units }}
  register: kiosk_units_installed
  changed_when: kiosk_units_installed.stdout | length > 0
  notify: Reload systemd

# Leftovers of the Web Playback SDK, which Spotify Soloist replaced: Chromium needed Widevine (Spotify's DRM module),
# with units that restarted the kiosk after Chromium's Widevine download, and played through PipeWire's PulseAudio
# server, which Soloist (a native PipeWire client) and kiosk-audio (wpctl, pw-link) do not use. The units, Chromium's
# downloaded Widevine, its package and pipewire-pulse go. A one-off: remove this task once every kiosk has run it.
# Prints what it removed.
- name: full | units | Remove the Web Playback SDK leftovers
  ansible.builtin.shell:
    cmd: |
      set -euo pipefail
      if [[ -e /etc/systemd/system/kiosk-widevine.path ]]; then
        systemctl disable --now --quiet kiosk-widevine.path 2>/dev/null || true
        rm -f /etc/systemd/system/kiosk-widevine.path /etc/systemd/system/kiosk-widevine.service \
          /var/lib/the-max-mix/widevine-loaded
        echo "removed the Widevine units"
      fi
      if [[ -e /home/kiosk/.config/chromium/WidevineCdm ]]; then
        rm -rf /home/kiosk/.config/chromium/WidevineCdm
        echo "removed Chromium's Widevine download"
      fi
      for package in libwidevinecdm0 pipewire-pulse; do
        if dpkg-query -W -f='${Status}' "$package" 2>/dev/null | grep -q 'ok installed'; then
          DEBIAN_FRONTEND=noninteractive apt-get purge -y -qq "$package" > /dev/null
          echo "purged $package"
        fi
      done
    executable: /bin/bash
  register: kiosk_sdk_leftovers_removed
  changed_when: kiosk_sdk_leftovers_removed.stdout | length > 0
  notify: Reload systemd

# The units must be known to systemd before they are enabled and started.
- name: full | units | Apply the pending changes
  ansible.builtin.meta: flush_handlers

# One program for all of them, as a module run costs seconds on a Pi. The kiosk and Bluetooth are only enabled: the next
# boot starts them, and nothing here starts or restarts the kiosk. Bluetooth pairs phones and hears who is home; Avahi
# finds the AirPlay speakers. Prints each unit it enabled or started.
- name: full | units | Enable the kiosk, Bluetooth, Avahi and the timers, and start Avahi and the timers
  ansible.builtin.shell:
    cmd: |
      set -euo pipefail
      for unit in $ENABLE $START; do
        if ! systemctl is-enabled --quiet "$unit"; then
          systemctl enable --quiet "$unit"
          echo "enabled $unit"
        fi
      done
      [[ $ENABLE_ONLY != True ]] || exit 0
      for unit in $START; do
        if ! systemctl is-active --quiet "$unit"; then
          systemctl start "$unit"
          echo "started $unit"
        fi
      done
    executable: /bin/bash
  environment:
    ENABLE: kiosk.service bluetooth.service
    START: >-
      {{ (['avahi-daemon.service', 'kiosk-pull.timer', 'kiosk-restart.timer', 'kiosk-soloist-update.timer']
      + (['kiosk-ssh-keys.timer'] if kiosk_admin_github_user else [])) | join(' ') }}
    ENABLE_ONLY: '{{ kiosk_enable_only | bool }}'
  register: kiosk_units_enabled
  changed_when: kiosk_units_enabled.stdout | length > 0
