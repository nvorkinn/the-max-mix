name: Lint

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  # Picks the checks this change needs from the files it touches (scripts/lint-plan.ts has the list); a push to main
  # runs them all. The other jobs skip themselves when they are not in the plan.
  plan:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      checks: ${{ steps.plan.outputs.checks }}
      npm: ${{ steps.plan.outputs.npm }}
    steps:
      # A pull request checks out its merge commit, whose first parent is the base branch, so two commits are enough.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 2
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
      - id: plan
        env:
          EVENT: ${{ github.event_name }}
        run: |
          if [ "$EVENT" = pull_request ]; then
            checks=$(git diff --name-only HEAD^1 HEAD | node scripts/lint-plan.ts)
          else
            checks=$(node scripts/lint-plan.ts --all)
          fi
          echo "Checks: $checks"
          echo "checks=$checks" >> "$GITHUB_OUTPUT"
          # The npm run checks alone, for the matrix job.
          echo "npm=$(echo "$checks" | jq -c 'map(select(. != "shellcheck" and . != "actionlint" and . != "editorconfig"))')" >> "$GITHUB_OUTPUT"

  checks:
    name: npm run ${{ matrix.check }}
    needs: plan
    if: needs.plan.outputs.npm != '[]'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        check: ${{ fromJSON(needs.plan.outputs.npm) }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
      # Unpacking node_modules from the cache is quicker than `npm ci` writing its 800 packages one by one. The key
      # matches the e2e job's in tests.yml, so both share one cache.
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        id: modules
        with:
          path: node_modules
          key: e2e-node-modules-${{ runner.os }}-${{ hashFiles('.nvmrc', 'package-lock.json') }}
      - if: steps.modules.outputs.cache-hit != 'true'
        run: npm ci --ignore-scripts --no-audit --no-fund
      - run: npm run ${{ matrix.check }}

  shellcheck:
    needs: plan
    if: contains(fromJSON(needs.plan.outputs.checks), 'shellcheck')
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Run shellcheck
        env:
          VERSION: 0.11.0
          SHA256: 8c3be12b05d5c177a04c29e3c78ce89ac86f1595681cab149b65b97c4e227198
        run: |
          curl -fsSL -o "$RUNNER_TEMP/shellcheck.tar.xz" "https://github.com/koalaman/shellcheck/releases/download/v${VERSION}/shellcheck-v${VERSION}.linux.x86_64.tar.xz"
          echo "$SHA256  $RUNNER_TEMP/shellcheck.tar.xz" | sha256sum -c -
          mkdir "$RUNNER_TEMP/shellcheck"
          tar -xJf "$RUNNER_TEMP/shellcheck.tar.xz" -C "$RUNNER_TEMP/shellcheck" --strip-components=1 "shellcheck-v${VERSION}/shellcheck"
          "$RUNNER_TEMP/shellcheck/shellcheck" ansible/roles/kiosk/files/bin/* ansible/tests/*.sh

  actionlint:
    needs: plan
    if: contains(fromJSON(needs.plan.outputs.checks), 'actionlint')
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Run actionlint
        env:
          VERSION: 1.7.12
          SHA256: 8aca8db96f1b94770f1b0d72b6dddcb1ebb8123cb3712530b08cc387b349a3d8
        run: |
          curl -fsSL -o "$RUNNER_TEMP/actionlint.tar.gz" "https://github.com/rhysd/actionlint/releases/download/v${VERSION}/actionlint_${VERSION}_linux_amd64.tar.gz"
          echo "$SHA256  $RUNNER_TEMP/actionlint.tar.gz" | sha256sum -c -
          mkdir "$RUNNER_TEMP/actionlint"
          tar -xzf "$RUNNER_TEMP/actionlint.tar.gz" -C "$RUNNER_TEMP/actionlint" actionlint
          # cspell:ignore color (an actionlint flag)
          "$RUNNER_TEMP/actionlint/actionlint" -color .github/workflows/*.yml

  editorconfig:
    needs: plan
    if: contains(fromJSON(needs.plan.outputs.checks), 'editorconfig')
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Run editorconfig-checker
        env:
          VERSION: 4.0.2
          SHA256: 44efaef3ed14c6ab52eb87481d78e5e5c204796dccf26e2f4598a61ba17f8003
        run: |
          curl -fsSL -o "$RUNNER_TEMP/editorconfig-checker.tar.gz" "https://github.com/editorconfig-checker/editorconfig-checker/releases/download/v${VERSION}/editorconfig-checker-linux-amd64.tar.gz"
          echo "$SHA256  $RUNNER_TEMP/editorconfig-checker.tar.gz" | sha256sum -c -
          mkdir "$RUNNER_TEMP/editorconfig-checker"
          tar -xzf "$RUNNER_TEMP/editorconfig-checker.tar.gz" -C "$RUNNER_TEMP/editorconfig-checker" editorconfig-checker
          "$RUNNER_TEMP/editorconfig-checker/editorconfig-checker"
