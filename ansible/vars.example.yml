---
# Copy to ~/the-max-mix-kiosk.yml on the Pi and pass it to ansible-pull with -e @~/the-max-mix-kiosk.yml, so every pull
# uses the same settings.

# Required: the address the kiosk opens, the hosted app on Vercel. Register exactly this address (trailing slash
# included) as a redirect URI in the Spotify dashboard.
kiosk_url: https://example.vercel.app/

# Optional: the desktop user that runs the kiosk (default: the user running ansible-pull, or SUDO_USER).
# kiosk_user: pi
# Optional: seconds to wait for the address to answer before launching Chromium (default 120).
# kiosk_startup_timeout: 120
# Optional: set to false to leave desktop autologin and screen blanking alone.
# kiosk_configure_raspi_config: true
