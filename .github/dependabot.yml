version: 2

# Daily update PRs. Minor and patch updates are grouped per ecosystem to keep the number of PRs down; major
# updates arrive one at a time. Security updates are opened separately by GitHub and are not affected by the schedule.
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: daily
    commit-message:
      prefix: 'chore(deps)'
    # typescript-eslint cannot load TypeScript 7 (the native compiler has no JS API) yet; its peer range is <6.1.
    ignore:
      - dependency-name: typescript
        update-types: [version-update:semver-major, version-update:semver-minor]
      # Node types follow the Node major in .nvmrc (24), so a newer major would allow APIs the Pi and CI lack.
      - dependency-name: '@types/node'
        update-types: [version-update:semver-major]
    groups:
      npm-minor-patch:
        update-types: [minor, patch]

  # ws, the kiosk-audio service's one package on the Pi: installed there from this lockfile by the playbook (npm ci).
  - package-ecosystem: npm
    directory: /ansible/roles/kiosk/files/kiosk-audio
    schedule:
      interval: daily
    commit-message:
      prefix: 'chore(deps)'
    groups:
      kiosk-audio-minor-patch:
        update-types: [minor, patch]

  # ansible-core and ansible-lint, which CI uses to lint the playbook. Unpinned in ansible/pyproject.toml, so the lockfile
  # is the only record of their versions.
  - package-ecosystem: uv
    directory: /ansible
    schedule:
      interval: daily
    commit-message:
      prefix: 'chore(deps)'
    groups:
      ansible-minor-patch:
        update-types: [minor, patch]

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: daily
    commit-message:
      prefix: 'chore(ci)'
    groups:
      actions-minor-patch:
        update-types: [minor, patch]
