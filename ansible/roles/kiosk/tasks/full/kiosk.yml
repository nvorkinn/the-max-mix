---
# A part of the setup (tasks/main.yml runs it when what it installs changed, or a week after it last ran).
# The kiosk itself: the journal, the kiosk programs, the kiosk-audio service, AirPlay, the Chromium policy, polkit
# rules, the blank cursor and the console.

# The kiosk -----------------------------------------------------------------------------------------------------------
# The kiosk programs, and the kiosk-audio service's source files and package list. Ansible's copy module costs about 2.5
# seconds per file on a Pi even when nothing changed (it starts Python for each), so rsync copies them all in one go:
# by checksum, only what differs, and it prints a line for each file it changed or removed. kiosk-audio's tests and
# their fixtures stay behind, and a source file the repository no longer has is removed (node_modules and the package
# list are left alone). AirPlay: PipeWire makes a sink for each speaker Avahi finds; the app asks the kiosk-audio service
# (127.0.0.1) to route the browser's audio to the chosen ones, and the same user unit keeps it there. The blank cursor
# theme, one transparent pixel, goes in the same step (Cage loads it as its default theme, see below), for touch screens
# that look like a mouse.
- name: full | kiosk | Install the kiosk programs, the audio routing and the blank cursor
  ansible.builtin.shell:
    cmd: |
      set -euo pipefail
      copy=(rsync --recursive --checksum --perms --owner --group --chown=root:root --itemize-changes)
      "${copy[@]}" --chmod=F0755 "$FILES/bin/kiosk-session" "$FILES/bin/kiosk-display" /usr/local/bin/
      "${copy[@]}" --chmod=F0755 "$FILES/bin/kiosk-pull" "$FILES/bin/kiosk-app-switch" "$FILES/bin/kiosk-status" \
        "$FILES/bin/kiosk-ssh-keys" /usr/local/sbin/
      "${copy[@]}" --chmod=D0755,F0644 --delete --exclude='*.test.ts' --exclude=fixtures.ts --include='*.ts' \
        --exclude='*' "$AUDIO_SRC/" "$AUDIO_DIR/"
      "${copy[@]}" --chmod=F0644 "$FILES/kiosk-audio/package.json" "$FILES/kiosk-audio/package-lock.json" "$AUDIO_DIR/"
      "${copy[@]}" --chmod=F0644 "$FILES/icons/index.theme" /usr/share/icons/blank/
      "${copy[@]}" --chmod=F0644 "$FILES/icons/left_ptr" /usr/share/icons/blank/cursors/
    executable: /bin/bash
  environment:
    FILES: '{{ role_path }}/files'
    AUDIO_SRC: '{{ kiosk_audio_src }}'
    AUDIO_DIR: '{{ kiosk_audio_dir }}'
  register: kiosk_copied
  changed_when: kiosk_copied.stdout | length > 0
  notify: Ask for a kiosk restart

# ws, the one npm package, for the update stream (the WebSocket). Installed from the lockfile, so it is the version that
# was reviewed; --ignore-scripts because nothing it needs has to build. Only when the lockfile is not the one installed.
- name: full | kiosk | Install the audio routing's npm packages
  when: >-
    kiosk_audio_lock_id
    != (lookup('ansible.builtin.file', kiosk_audio_deps_stamp, errors='ignore') | default('', true) | string | trim)
  vars:
    kiosk_audio_lock_id: "{{ lookup('ansible.builtin.file', 'kiosk-audio/package-lock.json') | hash('sha1') }}"
  block:
    - name: full | kiosk | Run npm ci
      ansible.builtin.command:
        cmd: npm ci --omit=dev --ignore-scripts --no-audit --no-fund
        chdir: '{{ kiosk_audio_dir }}'
      changed_when: true
      notify: Ask for a kiosk restart

    - name: full | kiosk | Record which lockfile was installed
      ansible.builtin.copy:
        content: '{{ kiosk_audio_lock_id }}'
        dest: '{{ kiosk_audio_deps_stamp }}'
        owner: root
        group: root
        mode: '0644'

# The journal, AirPlay, the audio routing's unit, the Chromium policy, polkit and /run/kiosk, in one step, as a module run
# costs seconds on a Pi. Raspberry Pi OS keeps the journal in memory, so every log is lost at a reboot, including the one
# that shows why a shutdown was slow: kiosk-journald.conf keeps it on disk, capped so that it does not wear the SD card or
# fill it. polkitd reads rules.d itself. The kiosk user manages Wi-Fi connections without sudo (networkmanager), and may
# update and restart the kiosk and reboot the Pi (power): the Update now, Restart kiosk and Reboot Pi buttons in the
# app's settings.
- name: full | kiosk | Install the journal, AirPlay, audio routing, Chromium, polkit and run directory settings
  ansible.builtin.command:
    argv: [node, '{{ kiosk_install_files }}']
    stdin: '{{ kiosk_settings | to_json }}'
  vars:
    kiosk_settings: >-
      {%- set files = [] -%}
      {%- for template, path in [
        ('kiosk-journald.conf', '/etc/systemd/journald.conf.d/kiosk.conf'),
        ('50-kiosk-raop.conf', '/etc/pipewire/pipewire.conf.d/50-kiosk-raop.conf'),
        ('kiosk-audio.service', '/etc/systemd/user/kiosk-audio.service'),
        ('kiosk-policy.json', '/etc/chromium/policies/managed/kiosk.json'),
        ('50-kiosk-networkmanager.rules', '/etc/polkit-1/rules.d/50-kiosk-networkmanager.rules'),
        ('50-kiosk-power.rules', '/etc/polkit-1/rules.d/50-kiosk-power.rules'),
        ('kiosk-tmpfiles.conf', '/etc/tmpfiles.d/kiosk.conf')] -%}
      {%- set _ = files.append({'path': path, 'mode': '0644',
        'content': lookup('ansible.builtin.template', template ~ '.j2')}) -%}
      {%- endfor -%}
      {{ files }}
  register: kiosk_settings_installed
  changed_when: kiosk_settings_installed.stdout | length > 0

# These run no module, so they cost nothing: they only pass each change on to its handler.
- name: full | kiosk | Apply the journal settings
  ansible.builtin.debug:
    msg: The journal settings changed.
  when: "'/etc/systemd/journald.conf.d/kiosk.conf' in kiosk_settings_installed.stdout_lines"
  changed_when: true
  notify: Apply the journal settings

- name: full | kiosk | Restart the kiosk for its new audio and Chromium settings
  ansible.builtin.debug:
    msg: The kiosk's audio or Chromium settings changed.
  when: >-
    kiosk_settings_installed.stdout_lines
    | intersect(['/etc/pipewire/pipewire.conf.d/50-kiosk-raop.conf', '/etc/systemd/user/kiosk-audio.service',
    '/etc/chromium/policies/managed/kiosk.json'])
    | length > 0
  changed_when: true
  notify: Ask for a kiosk restart

- name: full | kiosk | Create /run/kiosk
  ansible.builtin.debug:
    msg: The run directory's settings changed.
  when: "'/etc/tmpfiles.d/kiosk.conf' in kiosk_settings_installed.stdout_lines"
  changed_when: true
  notify: Create the run directory

# The links, in one program, as a module run costs seconds on a Pi. The audio routing starts in the kiosk user's session:
# what `systemctl --global enable` does, as a link, so it also works without a running systemd (kiosk_enable_only).
# Cage ignores XCURSOR_THEME: wlroots always loads the theme called "default", which is Adwaita on Pi OS. kiosk.service
# puts /usr/share/kiosk-cursors first in Cage's XCURSOR_PATH, so there "default" is the blank theme, and every cursor name
# in it is the blank cursor. The rest of the system keeps its own. The kiosk takes the display on tty7 and tty1 shows
# nothing. Prints each link it made.
- name: full | kiosk | Start the audio routing in the kiosk's session, blank the cursor and mask the login prompt on tty1
  ansible.builtin.shell:
    cmd: |
      set -euo pipefail
      # Usage: link TARGET NAME
      link() {
        if [[ $(readlink "$2" || true) != "$1" ]]; then
          ln -sfn "$1" "$2"
          echo "$2"
        fi
      }
      link ../kiosk-audio.service /etc/systemd/user/default.target.wants/kiosk-audio.service
      link /usr/share/icons/blank /usr/share/kiosk-cursors/default
      link /dev/null /etc/systemd/system/getty@tty1.service
      for name in $CURSOR_NAMES; do
        link left_ptr "/usr/share/icons/blank/cursors/$name"
      done
    executable: /bin/bash
  environment:
    CURSOR_NAMES: >-
      default arrow text xterm pointer hand1 hand2 grab grabbing crosshair wait watch progress not-allowed
  register: kiosk_links
  changed_when: kiosk_links.stdout | length > 0

- name: full | kiosk | Restart the kiosk for the audio routing
  ansible.builtin.debug:
    msg: The audio routing's link changed.
  when: "'/etc/systemd/user/default.target.wants/kiosk-audio.service' in kiosk_links.stdout_lines"
  changed_when: true
  notify: Ask for a kiosk restart

- name: full | kiosk | Reload systemd for the masked login prompt
  ansible.builtin.debug:
    msg: The login prompt on tty1 was masked.
  when: "'/etc/systemd/system/getty@tty1.service' in kiosk_links.stdout_lines"
  changed_when: true
  notify: Reload systemd
