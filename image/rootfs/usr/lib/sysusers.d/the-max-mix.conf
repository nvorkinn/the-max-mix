# The kiosk's two accounts. The image build runs systemd-sysusers, as /etc/passwd is read-only on the Pi. The IDs are
# fixed because the homes live on /data (image/persist.list) and outlive every image: each new image must give the same
# files to the same accounts.
#
# admin: maintenance over SSH by key only (sshd_config.d/10-kiosk.conf), sudo without a password (sudoers.d). Its keys
# come from GitHub (kiosk-ssh-keys.timer) and from Raspberry Pi Imager's wizard on the first boot.
u admin 1000 "THE MAX MIX admin" /home/admin /bin/bash
m admin sudo
# kiosk: the account Cage and Chromium run as. No sudo, no password, and only the groups it needs. systemd-journal lets
# the kiosk-audio service read the update's journal for the app's update console; bluetooth lets it pair and connect
# speakers (BlueZ's D-Bus policy), and WirePlumber play to them; video lets it set a DSI panel's backlight.
u kiosk 1001 "THE MAX MIX kiosk" /home/kiosk /bin/bash
m kiosk audio
m kiosk bluetooth
m kiosk input
m kiosk netdev
m kiosk render
m kiosk systemd-journal
m kiosk video
