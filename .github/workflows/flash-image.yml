name: Flash image

# Promotes a bundle to THE MAX MIX's flash image for Raspberry Pi Imager: that bundle's slot images, unchanged, on a
# six-partition A/B card (image/build.sh card). Run it by hand with a release tag (or dev, or branch-<name>) when a
# freshly flashed Pi should start from it; ordinary releases build only the bundle. A freshly flashed Pi updates itself
# to its channel's newest bundle at its first check, so the flash image may lag behind.
#
# The card and the Imager list go on one rolling pre-release, flash-image, so their links never change:
#   https://github.com/nvorkinn/the-max-mix/releases/download/flash-image/the-max-mix.rpi-imager-manifest
# It is a pre-release so that releases/latest, which stable Pis and the app follow, never points at it.
on:
  workflow_dispatch:
    inputs:
      from:
        description: The release tag (v1.2.3) or channel (dev, branch-<name>) whose bundle to promote
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: flash-image
  cancel-in-progress: false

env:
  TAG: flash-image
  GH_REPO: ${{ github.repository }}
  FROM: ${{ inputs.from }}

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Check the input
        run: |
          if [[ ! $FROM =~ ^(v[0-9A-Za-z][0-9A-Za-z._-]*|dev|branch-[A-Za-z0-9._-]+)$ ]]; then
            echo "::error::Give a release tag (v1.2.3), dev or branch-<name>, got: $FROM"
            exit 1
          fi
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # The runner's own package lists usually still have these, so `apt-get update` runs only when they do not. Nor
      # does needrestart look for services to restart on a runner that is thrown away.
      - name: Install the tools
        run: |
          install() {
            sudo env NEEDRESTART_SUSPEND=1 apt-get install --yes --no-install-recommends rauc dosfstools mtools fdisk zstd jq
          }
          install || { sudo apt-get update -q && install; }
      - name: Download the bundle
        env:
          GH_TOKEN: ${{ github.token }}
        # bundle.txt names the release's bundle.
        run: |
          gh release download "$FROM" --pattern bundle.txt --output "$RUNNER_TEMP/bundle.txt"
          gh release download "$FROM" --pattern "$(basename "$(< "$RUNNER_TEMP/bundle.txt")")" \
            --output "$RUNNER_TEMP/the-max-mix.raucb"
      # The folder is made first, as the runner user, so that the step can still write to it after the root build.
      - name: Build the card
        run: |
          mkdir -p "$RUNNER_TEMP/out"
          # RAUC, run as root, refuses a bundle another user could change while it is read ("unsafe bundle uid").
          sudo chown root:root "$RUNNER_TEMP/the-max-mix.raucb"
          sudo env IMAGE_URL="https://github.com/$GH_REPO/releases/download/$TAG/the-max-mix.img.zst" \
            image/build.sh card "$RUNNER_TEMP/the-max-mix.raucb" "$RUNNER_TEMP/out"
          jq -r '.os_list[0].description' "$RUNNER_TEMP/out/the-max-mix.rpi-imager-manifest" > "$RUNNER_TEMP/out/description.txt"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: flash-image
          path: ${{ runner.temp }}/out/
          if-no-files-found: error
          retention-days: 1
          compression-level: 0

  # A separate job, so that only this one, which runs no code from the repository, can write to it.
  publish:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: flash-image
      # The card goes up before the list that names its checksum. Never the latest release: see the top of this file.
      - name: Publish the flash-image pre-release
        run: |
          notes=$(printf '%s\n\n%s\n\n%s\n' \
            "Ready-made A/B flash image for a Max Mix kiosk (Pi 4 and Pi 5), promoted from $FROM." \
            "$(cat description.txt)" \
            "Imager list: https://github.com/$GH_REPO/releases/download/$TAG/the-max-mix.rpi-imager-manifest")
          if ! gh release view "$TAG" > /dev/null 2>&1; then
            gh release create "$TAG" --target "$GITHUB_SHA" --prerelease --latest=false --title 'Flash image' --notes 'Building'
          fi
          echo "Uploading the-max-mix.img.zst ($(($(stat --format=%s the-max-mix.img.zst) / 1048576)) MiB)"
          gh release upload "$TAG" the-max-mix.img.zst --clobber
          gh release upload "$TAG" the-max-mix.rpi-imager-manifest --clobber
          gh release edit "$TAG" --prerelease --latest=false --notes "$notes"
          echo "Published: https://github.com/$GH_REPO/releases/download/$TAG/the-max-mix.rpi-imager-manifest"
