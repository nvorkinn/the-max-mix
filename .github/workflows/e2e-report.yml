name: Merge E2E report

on:
  workflow_call:
    inputs:
      source_run_id:
        description: Workflow run containing the shard artifacts (empty for this run)
        type: string
        default: ''

permissions:
  actions: read
  contents: read

jobs:
  merge:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
      - run: |
          node scripts/e2e-package.ts
          npm install --ignore-scripts --no-audit --no-fund
      # Each artifact holds e2e/blob-report and e2e/test-results; the blob files and test folders have unique names.
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: e2e-shard-*
          merge-multiple: true
          path: e2e
          github-token: ${{ inputs.source_run_id && github.token || '' }}
          run-id: ${{ inputs.source_run_id || github.run_id }}
      - name: Merge the reports
        env:
          PLAYWRIGHT_HTML_OUTPUT_DIR: e2e/playwright-report
          PLAYWRIGHT_HTML_OPEN: never
          PLAYWRIGHT_JSON_OUTPUT_FILE: e2e/test-results/results.json
        run: npx playwright merge-reports --reporter html,json e2e/blob-report
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: playwright-report
          path: |
            e2e/playwright-report
            e2e/test-results
          if-no-files-found: ignore
