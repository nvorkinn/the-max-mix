name: Audit

# Weekly dependency vulnerability scan of everything the lockfiles resolve, including dev tooling. It is not a pull
# request check (a new advisory must not block unrelated PRs), so it is not listed in all-checks.yml; a failing run
# notifies the repository owner instead. Run it by hand from the Actions tab with "Run workflow".
on:
  schedule:
    - cron: '17 6 * * 1'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
      - run: npm --prefix server audit --audit-level=moderate
      - run: npm --prefix client audit --audit-level=moderate
