# Lets the kiosk-audio service (an ordinary user) serve the hotspot's setup page on port 80, where a phone's check for
# internet looks for it. Without it the page is served on port 8080, and only the second QR code reaches it. Only the
# kiosk and admin accounts exist on the device, and neither runs another service.
net.ipv4.ip_unprivileged_port_start = 80
