---
# True while an image is being built (pi-gen passes -e kiosk_image_build=true). Services are then only enabled, never
# started or restarted, and nothing that needs a running systemd, D-Bus or NetworkManager is run.
kiosk_image_build: false

# The account Cage and Chromium run as. pi-gen creates it as the image's first user (FIRST_USER_NAME in pi/image/config).
kiosk_user: kiosk
# The only groups the kiosk user is in (the user has no sudo and no password).
kiosk_groups: [audio, input, netdev, render, video]
# The origin of the hosted app and the address the kiosk opens (?kiosk=1 turns on the app's kiosk-only settings,
# ?cursor=hidden|shown follows kiosk_hide_cursor, in case Chromium ignores the session's blank cursor theme, and
# ?pi_ref=&pi_commit= name the kiosk_pull_ref and commit this playbook ran from, which the app's settings show).
# Register the redirect URI of this address in the Spotify dashboard.
kiosk_app_origin: https://the-max-mix.vercel.app
kiosk_url: >-
  {{ kiosk_app_origin }}/?kiosk=1&cursor={{ 'hidden' if kiosk_hide_cursor | bool else 'shown' }}
  {{- ('&pi_ref=' ~ (kiosk_pull_ref | urlencode) ~ '&pi_commit=' ~ kiosk_commit) if kiosk_commit else '' }}
# The commit this playbook runs from: ansible-pull runs it from a Git checkout, and the image build, which has no .git,
# from the copy pi/image/prepare.sh makes, with the commit in ansible/COMMIT. Empty when neither is there. Because the
# commit is in kiosk_url, every new commit on kiosk_pull_ref changes kiosk.service and so restarts the kiosk at
# kiosk_restart_time, after which the settings show the new commit.
kiosk_commit: >-
  {{ lookup('ansible.builtin.pipe',
     'git -C ' ~ (playbook_dir | quote) ~ ' rev-parse --short=7 HEAD 2> /dev/null || cat '
     ~ ((playbook_dir ~ '/COMMIT') | quote) ~ ' 2> /dev/null || true')
     | regex_search('^[0-9a-f]{7,40}$') | default('', true) }}

# System settings.
kiosk_locale: en_GB.UTF-8
kiosk_timezone: Europe/London
kiosk_wifi_country: GB
# The 1024x600 HDMI screen (Waveshare 7 inch). Forced on both HDMI ports because the firmware sets no mode.
kiosk_video_mode: 1024x600@60
# Added to the kernel command line (/boot/firmware/cmdline.txt) if missing; console=tty1 becomes tty3. Quiet boot with
# the Plymouth splash, no logo or cursor, the screen mode, and the Wi-Fi regulatory domain.
kiosk_cmdline_params:
  - quiet
  - splash
  - plymouth.ignore-serial-consoles
  - logo.nologo
  - vt.global_cursor_default=0
  - loglevel=3
  - 'video=HDMI-A-1:{{ kiosk_video_mode }}'
  - 'video=HDMI-A-2:{{ kiosk_video_mode }}'
  - 'cfg80211.ieee80211_regdom={{ kiosk_wifi_country }}'
# SSH for maintenance, by key only and only for the admin account below. Set to false to turn SSH off.
kiosk_ssh_enabled: true
# The maintenance account. It has no password, so it can only log in over SSH with a key; it uses sudo without one.
kiosk_admin_user: admin
# The admin account's SSH keys are this GitHub account's public keys (https://github.com/<name>.keys), fetched again at
# every playbook run, so a key added or removed on GitHub reaches the Pi at its next pull. Empty for no keys.
kiosk_admin_github_user: nvorkinn
# Regenerate the initramfs when the Plymouth theme changes. Needs a kernel, so tests in a plain container turn it off.
kiosk_update_initramfs: true

# Bluetooth keyboard and mouse, paired on first boot by kiosk-bluetooth-pair (no network or touch screen needed). Put each
# device in pairing mode when the Pi first starts. Several addresses with the same name are alternatives, for devices whose
# channels have their own address; one paired address is enough. Use [] for none.
kiosk_bluetooth_devices:
  - { name: mouse, address: 'DE:E3:A5:BE:A8:00' }
  - { name: keyboard, address: 'D1:B9:E3:A0:7A:9D' }

# Hide the mouse pointer (a blank cursor theme) for the touch screen. Turn off while a mouse is the only way to use it.
kiosk_hide_cursor: true
kiosk_cursor_theme: whiteglass

# Packages from the Raspberry Pi archive only (not in Debian). Tests in a plain Debian container set this to [].
kiosk_rpi_packages:
  - pi-bluetooth
  - rpi-chromium-mods
  - libwidevinecdm0
# Packages the playbook needs to run again with ansible-pull.
kiosk_ansible_packages:
  - ansible-core
  - ca-certificates
  - git
  - python3-apt
kiosk_packages:
  # Display: Cage runs one app full screen on Wayland. kbd provides chvt, xkb-data the keyboard layouts.
  - cage
  - kbd
  - xkb-data
  - fonts-dejavu-core
  - fonts-noto-color-emoji
  # Browser; libwidevinecdm0 (kiosk_rpi_packages) is the Widevine DRM module Spotify's player needs.
  - chromium
  - xdg-utils
  # Maintenance over SSH (kiosk_ssh_enabled)
  - openssh-server
  - sudo
  # Boot splash
  - initramfs-tools
  - plymouth
  - plymouth-themes
  # Locale, time zone and NetworkManager (polkit lets the kiosk user manage connections)
  - locales
  - tzdata
  - network-manager
  - polkitd
  # Bluetooth, for the keyboard and mouse (and audio later)
  - bluez
  - rfkill
  - pipewire
  - pipewire-pulse
  - wireplumber
  # AirPlay: PipeWire's RAOP modules find speakers over mDNS (Avahi); pw-dump and pw-link route the sound to them.
  - avahi-daemon
  - libpipewire-0.3-modules
  - pipewire-audio-client-libraries
  - pipewire-bin
  # Security updates
  - unattended-upgrades

# The Wi-Fi panel's source and its package list (one package per line, # comments allowed) live in the pulled repository.
kiosk_panel_src: '{{ playbook_dir }}/../pi/wifi-panel'
kiosk_panel_dir: /opt/the-max-mix/wifi-panel

# The audio routing (pi/kiosk-audio): the app opens kiosk-audio:// links to send its sound to AirPlay speakers, and a
# user unit keeps the links in place. kiosk-open-audio and kiosk-audio.desktop name kiosk_audio_dir's default.
kiosk_audio_src: '{{ playbook_dir }}/../pi/kiosk-audio'
kiosk_audio_dir: /opt/the-max-mix/kiosk-audio
# PipeWire's AirPlay buffer. Shorter means play, pause and skip are heard sooner on the speakers; too short and a busy
# Wi-Fi network makes them drop out.
kiosk_raop_latency_ms: 500
# The audio routing is TypeScript that Node runs directly, which needs Node 22.18 or later; Debian trixie has 20, so
# Node comes from NodeSource's archive (the same major version as .nvmrc). The key is pinned by its checksum.
kiosk_nodejs_major: 24
kiosk_nodesource_key_url: https://deb.nodesource.com/gpgkey/nodesource-repo.gpg.key
kiosk_nodesource_key_sha256: b42e0321dabdc24e892115da705cf061167eac12a317f23d329862d0aa0a271d

# On-device updates: kiosk-pull.timer runs ansible-pull against this repository and ref. The ref is a branch or tag that
# the owner moves on purpose (never a development branch); the image build bakes in the same value. To roll a device
# back, move the ref back. The repository is public, so no credentials are needed.
kiosk_pull_repo: https://github.com/nvorkinn/the-max-mix.git
kiosk_pull_ref: stable
kiosk_pull_dir: /var/lib/the-max-mix/ansible-pull
# First run this long after boot, then again this long after each run finishes, plus up to the random delay. A run only
# fetches the ref and applies the playbook when the ref has moved (ansible-pull --only-if-changed), so a short interval
# costs one git fetch.
kiosk_pull_boot_delay: 3min
kiosk_pull_interval: 5min
kiosk_pull_random_delay: 1min
# A pull that changed kiosk files leaves this marker (in /run, so a reboot clears it); kiosk-restart.timer restarts the
# kiosk at this time of day if the marker is there.
kiosk_restart_time: '04:30'
kiosk_restart_marker: /run/kiosk/restart-needed
