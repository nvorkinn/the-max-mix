# /run/kiosk: Chromium's pid file and screen.env (kiosk.service), written by the kiosk user.
d /run/kiosk 0755 kiosk kiosk -
# The homes live on /data (image/persist.list) and are empty after the first boot or a reset. The admin account's .ssh
# is where kiosk-ssh-keys and the first boot write its keys.
d /home/admin 0750 admin admin -
d /home/admin/.ssh 0700 admin admin -
d /home/kiosk 0750 kiosk kiosk -
