name: Release

# Production deploys happen here and only here (vercel.json turns off Vercel's own deploy of main). Push a version tag
# (git tag v1.2.3 && git push origin v1.2.3) to build the app and deploy it to Vercel production; run it by hand with an
# existing tag to redeploy that release. The Raspberry Pi kiosk simply opens this deployment. Needs the repository
# secrets VERCEL_TOKEN, VERCEL_ORG_ID and VERCEL_PROJECT_ID.
on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      tag:
        description: Existing tag to build and deploy (for example v1.2.3)
        required: true
        type: string

permissions:
  contents: read

# Never run two production deploys at once, and never cancel one that is under way.
concurrency:
  group: release
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      TAG: ${{ inputs.tag || github.ref_name }}
      VERCEL_CLI: vercel@64.4.0
      VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
      VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
      VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
    steps:
      - name: Check the tag and the secrets
        run: |
          if [[ ! $TAG =~ ^v[0-9A-Za-z][0-9A-Za-z._-]*$ ]]; then
            echo "::error::The tag must look like v1.2.3, got: $TAG"
            exit 1
          fi
          for name in VERCEL_TOKEN VERCEL_ORG_ID VERCEL_PROJECT_ID; do
            if [[ -z ${!name} ]]; then
              echo "::error::The repository secret $name is not set (Settings > Secrets and variables > Actions)."
              exit 1
            fi
          done
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: refs/tags/${{ env.TAG }}
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: npm
      # The build gets the release's version (v1.2.3 becomes 1.2.3) without committing anything; npm rejects a tag that is
      # not a valid semantic version.
      - name: Set the version from the tag
        run: npm version "${TAG#v}" --no-git-tag-version --allow-same-version
      - run: npm ci
      # Fails the release before anything is deployed if the app does not build. Vercel then builds it again from the same
      # source with the settings in vercel.json.
      - run: npm run build
      - name: Deploy to Vercel production
        run: npx --yes "$VERCEL_CLI" deploy --prod --yes --token="$VERCEL_TOKEN"
