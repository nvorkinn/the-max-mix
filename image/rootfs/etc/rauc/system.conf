# RAUC on THE MAX MIX's image Pis (Pi 4, Pi 400, Pi 5). Each slot is a boot partition (firmware, kernel, config.txt,
# cmdline.txt) and its root partition; the Pi firmware's tryboot switches between them (pi/kiosk-audio/boot-slots.ts).
# Bundles come from GitHub, streamed: pi/kiosk-audio/image-update.ts.
[system]
compatible=the-max-mix-pi
bootloader=custom
data-directory=/data/rauc
# Where it mounts the bundle while installing: the default, /mnt/rauc, is on the read-only root.
mountprefix=/run/rauc
bundle-formats=-plain

[keyring]
path=/etc/rauc/keyring.pem

[handlers]
bootloader-custom-backend=/usr/local/lib/the-max-mix/rauc-backend
post-install=/usr/local/lib/the-max-mix/rauc-post-install

[slot.rootfs.0]
device=/dev/disk/by-partlabel/root-a
type=ext4
bootname=a

[slot.rootfs.1]
device=/dev/disk/by-partlabel/root-b
type=ext4
bootname=b

[slot.boot.0]
device=/dev/disk/by-partlabel/boot-a
type=vfat
parent=rootfs.0

[slot.boot.1]
device=/dev/disk/by-partlabel/boot-b
type=vfat
parent=rootfs.1
