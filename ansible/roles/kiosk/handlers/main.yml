---
# Nothing here restarts the kiosk. With kiosk_enable_only nothing is started at all, so most handlers are skipped.
- name: Reload systemd
  ansible.builtin.systemd_service:
    daemon_reload: true
  when: not kiosk_enable_only

- name: Reload NetworkManager
  ansible.builtin.systemd_service:
    name: NetworkManager.service
    state: reloaded
  when: not kiosk_enable_only

- name: Create the run directory
  ansible.builtin.command: systemd-tmpfiles --create /etc/tmpfiles.d/kiosk.conf
  changed_when: true
  when: not kiosk_enable_only

- name: Generate the locale
  ansible.builtin.command: locale-gen
  changed_when: true

- name: Update the initramfs
  ansible.builtin.command: update-initramfs -u -k all
  changed_when: true
  when: kiosk_update_initramfs | bool

# Leaves a marker; kiosk-restart.timer restarts the kiosk at a quiet time of day.
- name: Ask for a kiosk restart
  ansible.builtin.file:
    path: '{{ kiosk_restart_marker }}'
    state: touch
    mode: '0644'
    modification_time: preserve
    access_time: preserve
  when: not kiosk_enable_only
