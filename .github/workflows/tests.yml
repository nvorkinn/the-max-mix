name: Tests

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  # A push that only changes e2e screenshot baselines reruns just the e2e tests, once the unit tests passed on the
  # previous commit (see baseline-only.yml).
  baseline-only:
    uses: ./.github/workflows/baseline-only.yml
    permissions:
      actions: read
      contents: read
    with:
      ignore: '^(e2e /|screenshots$)'

  tests:
    needs: baseline-only
    if: ${{ !cancelled() && needs.baseline-only.outputs.skip != 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          # The countdown-api submodule: the config client's tests read its example touchscreen config.
          submodules: true
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
      # Same node_modules cache as Lint: unpacking it is quicker than `npm ci` writing its 800 packages one by one.
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        id: modules
        with:
          path: node_modules
          key: node-modules-${{ runner.os }}-${{ hashFiles('.nvmrc', 'package-lock.json') }}
      - if: steps.modules.outputs.cache-hit != 'true'
        run: npm ci --ignore-scripts --no-audit --no-fund
      # The coverage run executes the app tests (and enforces the thresholds), so `npm test` would run them twice.
      - run: npm run test:coverage
      - name: Coverage summary
        if: ${{ !cancelled() }}
        run: node scripts/coverage-summary.ts >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: ${{ !cancelled() }}
        with:
          name: coverage
          path: coverage
          if-no-files-found: ignore

  # Browser tests of the built app, split over three machines and run in parallel with `tests` (see e2e.yml, which can
  # also be dispatched on its own for a report with a trace of every test).
  e2e:
    uses: ./.github/workflows/e2e.yml
    permissions:
      actions: read
      contents: read
