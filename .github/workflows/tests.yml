name: Tests

on:
  pull_request:
  push:
    branches: [ main ]

permissions:
  contents: read

jobs:
  tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: |
            client/package-lock.json
            server/package-lock.json
      - run: npm --prefix client ci
      - run: npm --prefix server ci
      - run: npm run lint
      - run: npm run lint:shell
      - run: npm test
      - run: npm run test:coverage
      - name: Coverage summary
        if: ${{ !cancelled() }}
        run: |
          node -e '
            const t = require("./client/coverage/coverage-summary.json").total;
            const rows = ["statements", "branches", "functions", "lines"].map(k => `| ${k} | ${t[k].pct}% |`);
            console.log(["### Client coverage", "| metric | covered |", "|---|---|", ...rows].join("\n"));
          ' >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v7
        if: ${{ !cancelled() }}
        with:
          name: coverage
          path: |
            server/coverage
            client/coverage
          if-no-files-found: ignore
      - run: npm run build
