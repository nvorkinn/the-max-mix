---
# Fetches the admin user's SSH keys from GitHub when they are older than kiosk_admin_keys_max_age_hours. Run at every pull
# (see main.yml), so a key removed on GitHub stops working within that time even when no release changed the playbook.
- name: Check when the admin user's SSH keys were last fetched
  ansible.builtin.stat:
    path: '/home/{{ kiosk_admin_user }}/.ssh/authorized_keys'
    get_checksum: false
    get_mime: false
    get_attributes: false
  register: kiosk_admin_keys_file
  when: kiosk_admin_github_user | length > 0

# Fetched again only when the keys are older than kiosk_admin_keys_max_age_hours: the download can take many seconds on a
# slow connection. Without a network (a Pi offline at its pull) the keys from the last run stay, so this never fails the
# playbook, and a failed fetch leaves the old file in place, so the next run tries again.
- name: Fetch the admin user's SSH keys from GitHub
  ansible.builtin.get_url:
    url: 'https://github.com/{{ kiosk_admin_github_user }}.keys'
    dest: '/home/{{ kiosk_admin_user }}/.ssh/authorized_keys'
    force: true
    timeout: 10
    owner: '{{ kiosk_admin_user }}'
    group: '{{ kiosk_admin_user }}'
    mode: '0600'
  register: kiosk_admin_keys
  failed_when: false
  when:
    - kiosk_admin_github_user | length > 0
    - >-
      not kiosk_admin_keys_file.stat.exists
      or (now(utc=true).timestamp() - kiosk_admin_keys_file.stat.mtime) > kiosk_admin_keys_max_age_hours * 3600

- name: Report a failed key download
  ansible.builtin.debug:
    msg: 'Could not fetch the SSH keys, the previous ones stay: {{ kiosk_admin_keys.msg | default("") }}'
  when: (kiosk_admin_keys.status_code | default(200)) != 200
