[package]
name = "kiosk-shell"
version = "0.1.0"
description = "The kiosk's window: one full-screen WebKit view on the app, under Cage"
edition = "2021"
rust-version = "1.90"
publish = false

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
url = "2"

# The WebKitGTK view behind Tauri's webview, for the kiosk settings Tauri does not expose.
[target.'cfg(target_os = "linux")'.dependencies]
webkit2gtk = "2.0"

[profile.release]
opt-level = "s"
lto = true
codegen-units = 1
strip = true
panic = "abort"
