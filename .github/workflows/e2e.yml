name: E2E

# Browser tests of the built app with Spotify faked, served by `vite preview`, using the Google Chrome that ships on
# ubuntu-latest, so no browser download is needed. tests.yml calls this on every pull request and push to main; it runs
# as part of that run, so all-checks.yml waits for it through Tests. Each test runs once and no test is traced, because
# tracing every test took a third or more of the run; dispatch this workflow on a branch (`gh workflow run e2e.yml --ref <branch>`)
# for a report with a trace of every test, in the run's playwright-report artifact.
on:
  workflow_call:
    inputs:
      trace:
        description: Record a trace of every test
        type: boolean
        default: false
  workflow_dispatch:
    inputs:
      trace:
        description: Record a trace of every test
        type: boolean
        default: true

permissions:
  contents: read

jobs:
  # The tests are split over two machines, a half each; the report job merges what they write.
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2]
    env:
      E2E_TRACE: ${{ inputs.trace && 'on' || '' }}
    steps:
      # The runner's disk is read in lazily, so Chrome's first start takes about ten seconds. Starting it once in the
      # background lets that happen while the dependencies install, instead of before the first test.
      - name: Warm up Chrome
        run: (google-chrome --headless --disable-gpu --dump-dom about:blank > /dev/null 2>&1 &)
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          # The countdown-api submodule: the browser tests answer the config route with its example configs.
          submodules: true
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
      # Unpacking node_modules from the cache is quicker than `npm ci` writing its 800 packages one by one.
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        id: modules
        with:
          path: node_modules
          key: node-modules-${{ runner.os }}-${{ hashFiles('.nvmrc', 'package-lock.json') }}
      - if: steps.modules.outputs.cache-hit != 'true'
        run: npm ci --ignore-scripts --no-audit --no-fund
      - run: npm run build
      # EXPERIMENT: poll every 50 ms instead of backing off 100/250/500/1000 ms.
      - run: sed -i 's/poll.intervals ?? \[100, 250, 500, 1e3\]/poll.intervals ?? [50]/' node_modules/playwright/lib/matchers/expect.js && grep -c 'poll.intervals ?? \[50\]' node_modules/playwright/lib/matchers/expect.js
      - run: npm run test:e2e -- --shard=${{ matrix.shard }}/2
      # The blob report carries the results (and the traces, when asked for); the PNGs are the screenshots that differ from their
      # baselines, which the pull request comment shows. Playwright always writes .last-run.json, which keeps e2e/ the
      # artifact's root (the folder its files share) when there are no PNGs, so the report job finds blob-report/.
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: ${{ !cancelled() }}
        with:
          name: e2e-shard-${{ matrix.shard }}
          path: |
            e2e/blob-report
            e2e/test-results/.last-run.json
            e2e/test-results/**/*.png
          include-hidden-files: true
          if-no-files-found: ignore
          retention-days: 1

  # Merges the shards' reports into one HTML report and one JSON report, in the playwright-report artifact that the
  # screenshots job in tests.yml publishes.
  report:
    needs: test
    if: ${{ !cancelled() }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        id: modules
        with:
          path: node_modules
          key: node-modules-${{ runner.os }}-${{ hashFiles('.nvmrc', 'package-lock.json') }}
      - if: steps.modules.outputs.cache-hit != 'true'
        run: npm ci --ignore-scripts --no-audit --no-fund
      # Each artifact holds e2e/blob-report and e2e/test-results; the blob files and test folders have unique names.
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: e2e-shard-*
          merge-multiple: true
          path: e2e
      - name: Merge the reports
        env:
          PLAYWRIGHT_HTML_OUTPUT_DIR: e2e/playwright-report
          PLAYWRIGHT_HTML_OPEN: never
          PLAYWRIGHT_JSON_OUTPUT_FILE: e2e/test-results/results.json
        run: npx playwright merge-reports --reporter html,json e2e/blob-report
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: playwright-report
          path: |
            e2e/playwright-report
            e2e/test-results
          if-no-files-found: ignore
