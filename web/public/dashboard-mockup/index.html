<html lang="en">

    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>The Max Mix · Dashboard mockup</title>
    <style>
      /* Geist (SIL OFL 1.1, fonts/OFL.txt), bundled so nothing loads from a CDN. */
      @font-face {
        font-family: Geist;
        font-style: normal;
        font-display: swap;
        font-weight: 100 900;
        src: url('./fonts/geist-latin-ext-wght-normal.woff2') format('woff2');
        unicode-range:
          U+0100-02BA, U+02BD-02C5, U+02C7-02CC, U+02CE-02D7, U+02DD-02FF, U+0304, U+0308, U+0329, U+1D00-1DBF,
          U+1E00-1E9F, U+1EF2-1EFF, U+2020, U+20A0-20AB, U+20AD-20C0, U+2113, U+2C60-2C7F, U+A720-A7FF;
      }
      @font-face {
        font-family: Geist;
        font-style: normal;
        font-display: swap;
        font-weight: 100 900;
        src: url('./fonts/geist-latin-wght-normal.woff2') format('woff2');
        unicode-range:
          U+0000-00FF, U+0131, U+0152-0153, U+02BB-02BC, U+02C6, U+02DA, U+02DC, U+0304, U+0308, U+0329, U+2000-206F,
          U+20AC, U+2122, U+2191, U+2193, U+2212, U+2215, U+FEFF, U+FFFD;
      }

      :root {
        --text: #f7f4ec;
        --muted: rgba(247, 244, 236, 0.7);
        --faint: rgba(247, 244, 236, 0.14);
        --forest: #2f5a3c;
        --soon: #8fe39a;
        --red: #d6362b;
        --tube-blue: #1c3f94;
        --scrim: 9, 12, 16;
        /* Notice icons by severity: severe red, disruption amber, planned and info blue, everyday white. */
        --severe: #ff7b6e;
        --disruption: #f4c04a;
        --planned: #7cc0f5;
        --info: #7cc0f5;
        --everyday: var(--text);
      }
      * {
        box-sizing: border-box;
        margin: 0;
      }
      html,
      body {
        height: 100%;
        overflow: hidden;
        background: #000;
      }
      body {
        font-family: Geist, system-ui, sans-serif;
        -webkit-font-smoothing: antialiased;
      }
      /* The panel is laid out at 1280×800 and scaled to fit the screen by whichever of width or height is tighter. */
      .scaler {
        position: absolute;
        top: 0;
        left: 0;
        width: 1280px;
        height: 800px;
        transform-origin: 0 0;
      }
      svg.lucide {
        width: 24px;
        height: 24px;
        flex-shrink: 0;
        fill: none;
        stroke: currentcolor;
        stroke-width: 2;
        stroke-linecap: round;
        stroke-linejoin: round;
      }

      /* The daily generated photo replaces --backdrop */
      .panel {
        --backdrop: url('./img/backdrop.jpg');

        position: relative;
        isolation: isolate;
        width: 1280px;
        height: 800px;
        overflow: hidden;
        color: var(--text);
        background: #1c2230 var(--backdrop) center 30% / cover no-repeat;
        display: flex;
        flex-direction: column;
      }
      .panel::before {
        content: '';
        position: absolute;
        inset: 0;
        z-index: -1;
        pointer-events: none;
        background:
          linear-gradient(180deg, rgba(var(--scrim), 0.55) 0, rgba(var(--scrim), 0) 120px),
          linear-gradient(
            90deg,
            rgba(var(--scrim), 0.82) 0,
            rgba(var(--scrim), 0.66) 300px,
            rgba(var(--scrim), 0) 520px
          );
      }
      .shadowed {
        text-shadow: 0 1px 14px rgba(0, 0, 0, 0.45);
      }

      /* Header */
      header {
        height: 64px;
        flex-shrink: 0;
        display: flex;
        align-items: center;
        gap: 24px;
        padding: 0 16px;
      }
      .brand {
        display: flex;
        align-items: center;
        gap: 10px;
      }
      .brand-mark {
        width: 42px;
        height: 42px;
        border-radius: 12px;
        background: var(--forest);
        display: grid;
        place-items: center;
      }
      .brand-name {
        font-size: 24px;
        font-weight: 800;
        letter-spacing: -0.04em;
        text-transform: uppercase;
      }
      nav {
        display: flex;
        gap: 4px;
      }
      nav a {
        display: flex;
        align-items: center;
        gap: 10px;
        height: 44px;
        padding: 0 16px;
        border-radius: 999px;
        font-size: 19px;
        font-weight: 500;
        color: var(--text);
        text-decoration: none;
      }
      nav a[aria-current='page'] {
        background: rgba(255, 255, 255, 0.16);
        backdrop-filter: blur(12px);
        box-shadow: inset 0 0 0 1px rgba(255, 255, 255, 0.18);
      }
      .header-end {
        margin-left: auto;
        display: flex;
        align-items: center;
        gap: 16px;
      }
      .icon-btn {
        background: none;
        border: 0;
        color: var(--text);
        width: 44px;
        height: 44px;
        display: grid;
        place-items: center;
        border-radius: 50%;
        cursor: pointer;
      }
      .avatar {
        width: 44px;
        height: 44px;
        border-radius: 50%;
        border: 2px solid rgba(255, 255, 255, 0.7);
        display: grid;
        place-items: center;
        font-size: 19px;
        font-weight: 600;
      }
      .clock {
        display: flex;
        align-items: center;
        gap: 8px;
        font-size: 24px;
        font-weight: 600;
        font-variant-numeric: tabular-nums;
      }

      main {
        flex: 1;
        min-height: 0;
        display: flex;
      }

      /* Left rail: weather + notices, sitting directly on the photo */
      .rail {
        width: 344px;
        flex-shrink: 0;
        padding: 4px 16px 16px 24px;
        display: flex;
        flex-direction: column;
      }
      .weather {
        all: unset;
        display: block;
        cursor: pointer;
      }
      .weather:focus-visible {
        outline: 2px solid var(--text);
        outline-offset: 4px;
        border-radius: 6px;
      }
      .wx-period {
        font-size: 30px;
        font-weight: 700;
        letter-spacing: -0.02em;
        line-height: 1.1;
      }
      .wx-temp {
        font-size: 132px;
        font-weight: 700;
        line-height: 0.9;
        letter-spacing: -0.07em;
        margin: 4px 0 4px -6px;
      }
      .wx-cond {
        font-size: 30px;
        font-weight: 600;
        letter-spacing: -0.02em;
      }
      .wx-summary {
        display: flex;
        align-items: center;
        gap: 8px;
        font-size: 17px;
        color: var(--muted);
        margin-top: 4px;
        min-height: 24px;
      }

      .notices {
        margin-top: 24px;
        flex: 1;
        min-height: 0;
        display: flex;
        flex-direction: column;
      }
      .eyebrow {
        display: flex;
        align-items: center;
        gap: 8px;
        height: 34px;
        flex-shrink: 0;
        font-size: 13px;
        font-weight: 600;
        letter-spacing: 0.14em;
        text-transform: uppercase;
        color: var(--muted);
        border-bottom: 1px solid var(--faint);
      }
      .eyebrow .count {
        margin-left: auto;
        letter-spacing: 0.04em;
      }
      .pages {
        all: unset;
        display: flex;
        align-items: center;
        gap: 6px;
        height: 34px;
        padding: 0 2px 0 8px;
        cursor: pointer;
      }
      .pages[hidden] {
        display: none;
      }
      .pages i {
        width: 7px;
        height: 7px;
        border-radius: 50%;
        background: var(--faint);
      }
      .pages i.on {
        background: var(--text);
      }
      /* Rows have a fixed height; the notices that don't fit page through. */
      #notice-list {
        list-style: none;
        padding: 0;
        flex: 1;
        min-height: 0;
        overflow: hidden;
        transition: opacity 300ms ease;
      }
      #notice-list.fading {
        opacity: 0;
      }
      #notice-list li {
        height: 68px;
        border-bottom: 1px solid var(--faint);
        display: flex;
      }
      #notice-list li:last-child {
        border-bottom: 0;
      }
      .notice {
        all: unset;
        box-sizing: border-box;
        flex: 1;
        min-width: 0;
        display: flex;
        align-items: center;
        gap: 14px;
        padding: 0 2px;
      }
      button.notice {
        cursor: pointer;
      }
      .notice:focus-visible {
        outline: 2px solid var(--text);
        outline-offset: 2px;
        border-radius: 6px;
      }
      .notice-icon {
        color: var(--icon, var(--text));
      }
      .notice-body {
        flex: 1;
        min-width: 0;
      }
      .notice-title,
      .notice-sub {
        display: block;
        white-space: nowrap;
        overflow: hidden;
        text-overflow: ellipsis;
      }
      .notice-title {
        font-size: 18px;
        font-weight: 600;
        letter-spacing: -0.01em;
        line-height: 1.25;
      }
      .notice-sub {
        font-size: 14px;
        color: var(--muted);
        line-height: 1.3;
        margin-top: 2px;
      }
      .notice .chevron {
        width: 18px;
        height: 18px;
        color: var(--muted);
        opacity: 0.6;
      }

      /* A notice's full text, over the whole panel; a tap anywhere closes it. */
      .sheet {
        position: absolute;
        inset: 0;
        z-index: 2;
        display: grid;
        place-items: center;
        background: rgba(var(--scrim), 0.55);
        backdrop-filter: blur(10px);
      }
      .sheet[hidden] {
        display: none;
      }
      .sheet-card {
        position: relative;
        width: 640px;
        padding: 32px 36px 36px;
        border-radius: 20px;
        background: rgba(var(--scrim), 0.82);
        box-shadow:
          inset 0 0 0 1px rgba(255, 255, 255, 0.14),
          0 24px 70px rgba(0, 0, 0, 0.45);
      }
      .sheet-head {
        display: flex;
        align-items: center;
        gap: 14px;
        padding-right: 52px;
      }
      .sheet-head .lucide {
        width: 30px;
        height: 30px;
        color: var(--icon, var(--text));
      }
      .sheet-head h2 {
        font-size: 28px;
        font-weight: 700;
        letter-spacing: -0.02em;
      }
      .sheet-card p {
        margin-top: 18px;
        font-size: 21px;
        line-height: 1.45;
        color: var(--muted);
      }
      .sheet-card .icon-btn {
        position: absolute;
        top: 22px;
        right: 22px;
      }

      /* Right: open sky, then the departure board fading up from the bottom */
      .stage {
        flex: 1;
        min-width: 0;
        display: flex;
        flex-direction: column;
      }
      .sky {
        flex: 1;
        display: flex;
        justify-content: flex-end;
        align-items: flex-start;
        padding: 4px 24px 0;
      }
      .hours {
        display: flex;
        gap: 26px;
        text-align: center;
      }
      .hour {
        display: flex;
        flex-direction: column;
        align-items: center;
        gap: 4px;
      }
      .hour time {
        font-size: 15px;
        font-weight: 600;
        color: var(--muted);
      }
      .hour .lucide {
        width: 30px;
        height: 30px;
      }
      .hour strong {
        font-size: 24px;
        font-weight: 700;
      }
      .updated {
        display: flex;
        align-items: center;
        gap: 6px;
        font-size: 13px;
        color: var(--muted);
        margin-top: 10px;
        justify-content: flex-end;
      }

      /* Four rows per board. */
      .departures {
        position: relative;
        height: 360px;
        flex-shrink: 0;
        display: flex;
        gap: 28px;
        padding: 48px 24px 12px 8px;
      }
      .departures::before {
        content: '';
        position: absolute;
        inset: 0 0 0 -344px;
        z-index: -1;
        pointer-events: none;
        background: linear-gradient(
          180deg,
          rgba(var(--scrim), 0) 0,
          rgba(var(--scrim), 0.62) 70px,
          rgba(var(--scrim), 0.8) 100%
        );
        backdrop-filter: blur(18px) saturate(1.2);
        mask-image: linear-gradient(180deg, transparent 0, #000 80px);
      }
      .board {
        flex: 1;
        min-width: 0;
        display: flex;
        flex-direction: column;
      }
      .board-head {
        height: 44px;
        flex-shrink: 0;
        display: flex;
        align-items: center;
        gap: 12px;
        border-bottom: 1px solid rgba(255, 255, 255, 0.28);
        padding-bottom: 8px;
      }
      .board-head h2 {
        font-size: 26px;
        font-weight: 700;
        letter-spacing: -0.03em;
      }
      .board-stop {
        margin-left: auto;
        display: flex;
        align-items: center;
        gap: 2px;
        font: inherit;
        font-size: 15px;
        color: var(--muted);
        background: none;
        border: 0;
        cursor: pointer;
        padding: 4px 0;
      }
      .board-stop .lucide {
        width: 16px;
        height: 16px;
      }
      .roundel {
        width: 30px;
        height: 30px;
        border-radius: 50%;
        border: 5px solid #dc241f;
        background: transparent;
        position: relative;
        flex-shrink: 0;
        margin: 0 8px 0 9px;
      }
      .roundel::after {
        content: '';
        position: absolute;
        left: -10px;
        right: -10px;
        top: 50%;
        height: 7px;
        transform: translateY(-50%);
        background: var(--tube-blue);
      }
      .bus-mark {
        width: 32px;
        height: 32px;
        border-radius: 8px;
        background: var(--red);
        display: grid;
        place-items: center;
        flex-shrink: 0;
      }
      .bus-mark .lucide {
        width: 20px;
        height: 20px;
      }

      ol.rows {
        list-style: none;
        padding: 0;
        flex: 1;
        display: flex;
        flex-direction: column;
      }
      ol.rows li {
        flex: 1;
        min-height: 0;
        display: flex;
        align-items: center;
        gap: 14px;
        border-bottom: 1px solid var(--faint);
      }
      ol.rows li:last-child {
        border-bottom: 0;
      }
      .line-pill {
        width: 90px;
        height: 32px;
        border-radius: 999px;
        display: grid;
        place-items: center;
        font-size: 15px;
        font-weight: 600;
        flex-shrink: 0;
      }
      .route {
        min-width: 62px;
        height: 38px;
        padding: 0 8px;
        border-radius: 8px;
        background: var(--red);
        color: #fff;
        display: grid;
        place-items: center;
        font-size: 22px;
        font-weight: 700;
        flex-shrink: 0;
        font-variant-numeric: tabular-nums;
      }
      .dest {
        flex: 1;
        min-width: 0;
      }
      .dest strong {
        display: block;
        font-size: 22px;
        font-weight: 600;
        letter-spacing: -0.01em;
        white-space: nowrap;
        overflow: hidden;
        text-overflow: ellipsis;
      }
      .dest span {
        display: block;
        font-size: 14px;
        color: var(--muted);
      }
      .mins {
        display: flex;
        align-items: baseline;
        gap: 4px;
        font-size: 34px;
        font-weight: 700;
        letter-spacing: -0.03em;
        font-variant-numeric: tabular-nums;
        flex-shrink: 0;
        min-width: 72px;
        justify-content: flex-end;
      }
      .mins small {
        font-size: 15px;
        font-weight: 600;
        color: var(--muted);
        letter-spacing: 0;
      }
      .mins.soon {
        color: var(--soon);
      }
      .mins.soon small {
        color: var(--soon);
        opacity: 0.8;
      }
    </style>
  </head>

    <div class="scaler" id="scaler">
      <div class="panel">
        <header class="shadowed">
          <div class="brand">
            <span class="brand-mark" aria-hidden="true"
              ><svg class="lucide"><use href="#i-audio-lines" /></svg
            ></span>
            <span class="brand-name">The Max Mix.</span>
          </div>
          <nav aria-label="Main">
            <a href="#"
              ><svg class="lucide"><use href="#i-music-2" /></svg>Spotify</a
            >
            <a href="#" aria-current="page"
              ><svg class="lucide"><use href="#i-layout-grid" /></svg>Dashboard</a
            >
            <a href="#"
              ><svg class="lucide"><use href="#i-settings" /></svg>Settings</a
            >
          </nav>
          <div class="header-end">
            <button class="icon-btn" aria-label="Search">
              <svg class="lucide" style="width: 26px; height: 26px"><use href="#i-search" /></svg>
            </button>
            <span class="avatar" role="img" aria-label="Signed in as Max">M</span>
            <span class="clock"
              ><svg class="lucide" style="width: 20px; height: 20px"><use href="#i-clock-3" /></svg
              ><time id="clock">09:20</time></span
            >
          </div>
        </header>

        <main>
          <div class="rail">
            <button class="weather shadowed" id="weather"></button>

            <section class="notices" aria-labelledby="notice-title">
              <h2 class="eyebrow" id="notice-title">
                <svg class="lucide" style="width: 16px; height: 16px"><use href="#i-megaphone" /></svg>Notice board<span
                  class="count"
                  id="notice-count"
                ></span>
                <button class="pages" id="notice-pages" aria-label="Next notices" hidden></button>
              </h2>
              <ul id="notice-list"></ul>
            </section>
          </div>

          <div class="stage">
            <div class="sky shadowed">
              <section aria-label="Hourly forecast">
                <div class="hours" id="wx-hours"></div>
                <p class="updated">
                  Updated just now
                  <svg class="lucide" style="width: 13px; height: 13px"><use href="#i-refresh-cw" /></svg>
                </p>
              </section>
            </div>

            <div class="departures">
              <section class="board" aria-labelledby="tube-title">
                <div class="board-head">
                  <span class="roundel" aria-hidden="true"></span>
                  <h2 id="tube-title">Tube</h2>
                  <button class="board-stop">
                    Elephant &amp; Castle <svg class="lucide"><use href="#i-chevron-right" /></svg>
                  </button>
                </div>
                <ol class="rows" id="tube-rows"></ol>
              </section>
              <section class="board" aria-labelledby="bus-title">
                <div class="board-head">
                  <span class="bus-mark" aria-hidden="true"
                    ><svg class="lucide"><use href="#i-bus-front" /></svg
                  ></span>
                  <h2 id="bus-title">Buses</h2>
                  <button class="board-stop">
                    Elephant &amp; Castle <svg class="lucide"><use href="#i-chevron-right" /></svg>
                  </button>
                </div>
                <ol class="rows" id="bus-rows"></ol>
              </section>
            </div>
          </div>
        </main>

        <div class="sheet" id="sheet" hidden>
          <div class="sheet-card" role="dialog" aria-modal="true" aria-labelledby="sheet-title">
            <div class="sheet-head" id="sheet-head"></div>
            <p id="sheet-text"></p>
            <button class="icon-btn" aria-label="Close">
              <svg class="lucide"><use href="#i-x" /></svg>
            </button>
          </div>
        </div>
      </div>
    </div>

    <script>
      // Sample data, the same as web/src/dashboard/sample.ts. ?notices=N shows the first N of the eight notices (default 6).
      const ROWS_PER_BOARD = 4;
      const NOTICE_ROW_HEIGHT = 68;
      const NOTICE_PAGE_MS = 8000;

      const allNotices = [
        {
          title: 'Weather warning',
          sub: 'Heavy rain expected 14:00–18:00',
          icon: 'cloud-rain-wind',
          severity: 'severe',
          detail:
            'Yellow warning of rain affecting London & South East: Lambeth, Southwark. Valid from 14:00 to 18:00 today. Spray and flooding could make journeys longer.'
        },
        {
          title: 'Northern line: Delays',
          sub: 'Minor delays due to a signal fault',
          icon: 'triangle-alert',
          severity: 'disruption',
          detail:
            'Northern line: Minor delays between Kennington and Morden due to an earlier signal failure at Clapham Common. Tickets are being accepted on London Buses and South Western Railway.'
        },
        { title: 'Upcoming bank holiday', sub: 'Fri 25 Dec – Christmas Day', icon: 'calendar-days', severity: 'info' },
        {
          title: 'Victoria line: Planned work',
          sub: 'No service this weekend',
          icon: 'train-front',
          severity: 'planned',
          detail:
            'Victoria line: Saturday 21 and Sunday 22 November, no service between Euston and Walthamstow Central. Use the Northern line, London Overground or replacement buses.'
        },
        { title: 'Bins out tonight', sub: 'Recycling collection Wednesday', icon: 'recycle', severity: 'everyday' },
        { title: 'Parcel arriving', sub: 'Expected today, 16:00–18:00', icon: 'package', severity: 'everyday' },
        {
          title: 'Borough station closed',
          sub: 'Until 12:00 because of a fire alert',
          icon: 'octagon-x',
          severity: 'severe',
          detail:
            'Borough station is closed until about 12:00 while the London Fire Brigade checks a fire alert. Use Elephant & Castle or London Bridge.'
        },
        {
          title: 'Walworth Road works',
          sub: 'Lane closed northbound until Friday',
          icon: 'construction',
          severity: 'disruption',
          detail:
            'Walworth Road (A215) northbound: one lane closed at Larcom Street for gas main works until Friday 20 November. Buses 12, 35, 40, 148 and 343 may be delayed.'
        }
      ];
      const noticeCount = Number(new URLSearchParams(location.search).get('notices') ?? 6);
      const notices = allNotices.slice(0, Math.max(0, Math.min(allNotices.length, noticeCount)));

      const weatherViews = [
        { period: 'Now', temp: '9°', cond: 'Partly cloudy', summary: 'Heavy rain from 14:00', icon: 'umbrella' },
        { period: 'Tonight', temp: '6°', cond: 'Showers' },
        { period: 'Tomorrow', temp: '12°', cond: 'Cloudy', summary: 'Dry all day', icon: 'sun' },
        { period: 'Weekend', temp: '14°', cond: 'Sunny spells' }
      ];
      const hours = [
        ['10:00', 'cloud-sun', '9°', '#f6c453'],
        ['11:00', 'cloud', '10°'],
        ['12:00', 'cloud', '11°'],
        ['13:00', 'cloud-drizzle', '11°'],
        ['14:00', 'cloud-rain', '10°']
      ];
      const lines = { Northern: ['#111', '#fff'], Bakerloo: ['#a45a2a', '#fff'] };
      // [line, destination, platform, minutes, vehicle id]
      const tube = [
        ['Northern', 'High Barnet', 'Platform 1 · Northbound', 3, '012'],
        ['Bakerloo', 'Stonebridge Park', 'Platform 3 · Northbound', 4, '231'],
        ['Northern', 'Morden', 'Platform 2 · Southbound', 7, '045'],
        ['Northern', 'Edgware', 'Platform 1 · Northbound', 9, '017'],
        ['Bakerloo', "Queen's Park", 'Platform 4 · Northbound', 11, '236'],
        ['Northern', 'Kennington', 'Platform 2 · Southbound', 14, '052']
      ];
      // [route, destination, stop, minutes, vehicle id]
      const buses = [
        ['12', 'Oxford Circus', 'Stop E', 2, 'LJ17WRK'],
        ['343', 'New Cross', 'Stop F', 6, 'LX58CWK'],
        ['148', 'White City', 'Stop D', 8, 'SN68AEJ'],
        ['35', 'Clapham Junction', 'Stop G', 10, 'LF19FWM'],
        ['40', 'Aldgate', 'Stop B', 13, 'BV66GSO'],
        ['363', 'Crystal Palace', 'Stop H', 16, 'LK65EJN']
      ];

      const $ = id => document.getElementById(id);
      const esc = s =>
        String(s).replace(
          /[&<>"']/g,
          c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' })[c]
        );
      const icon = (name, size, style = '') =>
        `<svg class="lucide" style="width:${size}px;height:${size}px;${style}"><use href="#i-${name}" /></svg>`;
      const mins = m =>
        `<span class="mins${m <= 3 ? ' soon' : ''}">${m <= 0 ? 'Due' : `${m}<small>min</small>`}</span>`;

      let weatherView = 0;
      function renderWeather() {
        const view = weatherViews[weatherView];
        $('weather').innerHTML = `
          <p class="wx-period">${esc(view.period)}</p>
          <p class="wx-temp">${esc(view.temp)}</p>
          <p class="wx-cond">${esc(view.cond)}</p>
          <p class="wx-summary">${view.summary ? `${icon(view.icon, 18)}${esc(view.summary)}` : ''}</p>`;
      }
      $('weather').addEventListener('click', () => {
        weatherView = (weatherView + 1) % weatherViews.length;
        renderWeather();
      });

      $('wx-hours').innerHTML = hours
        .map(
          ([t, name, temp, color]) =>
            `<div class="hour"><time>${t}</time>${icon(name, 30, color ? `color:${color}` : '')}<strong>${temp}</strong></div>`
        )
        .join('');

      // The notice board: as many fixed-height rows as fit, paging through the rest.
      let noticePage = 0;
      let perPage = 1;
      let pageTimer;
      const pageCount = () => Math.max(1, Math.ceil(notices.length / perPage));

      function renderNotices() {
        $('notice-count').textContent = notices.length || '';
        const page = notices.slice(noticePage * perPage, (noticePage + 1) * perPage);
        $('notice-list').innerHTML = page
          .map((n, i) => {
            const tag = n.detail ? 'button' : 'div';
            return `<li><${tag} class="notice" style="--icon:var(--${n.severity})"${n.detail ? ` data-notice="${noticePage * perPage + i}"` : ''}>
              <span class="notice-icon">${icon(n.icon, 24)}</span>
              <span class="notice-body"><span class="notice-title">${esc(n.title)}</span><span class="notice-sub">${esc(n.sub)}</span></span>
              ${n.detail ? `<svg class="lucide chevron"><use href="#i-chevron-right" /></svg>` : ''}
            </${tag}></li>`;
          })
          .join('');
        const pages = $('notice-pages');
        pages.hidden = pageCount() < 2;
        pages.innerHTML = Array.from(
          { length: pageCount() },
          (_, i) => `<i${i === noticePage ? ' class="on"' : ''}></i>`
        ).join('');
      }

      function nextNoticePage() {
        if (pageCount() < 2) return;
        const list = $('notice-list');
        list.classList.add('fading');
        setTimeout(() => {
          noticePage = (noticePage + 1) % pageCount();
          renderNotices();
          list.classList.remove('fading');
        }, 300);
      }

      function layoutNotices() {
        perPage = Math.max(1, Math.floor($('notice-list').clientHeight / NOTICE_ROW_HEIGHT));
        noticePage = Math.min(noticePage, pageCount() - 1);
        renderNotices();
        clearInterval(pageTimer);
        pageTimer = setInterval(nextNoticePage, NOTICE_PAGE_MS);
      }

      $('notice-pages').addEventListener('click', () => {
        clearInterval(pageTimer);
        nextNoticePage();
        pageTimer = setInterval(nextNoticePage, NOTICE_PAGE_MS);
      });

      $('notice-list').addEventListener('click', event => {
        const row = event.target.closest('[data-notice]');
        if (!row) return;
        const n = notices[Number(row.dataset.notice)];
        $('sheet-head').innerHTML =
          `<span style="--icon:var(--${n.severity})">${icon(n.icon, 30, 'color:var(--icon)')}</span><h2 id="sheet-title">${esc(n.title)}</h2>`;
        $('sheet-text').textContent = n.detail;
        $('sheet').hidden = false;
        clearInterval(pageTimer);
      });
      $('sheet').addEventListener('click', () => {
        $('sheet').hidden = true;
        pageTimer = setInterval(nextNoticePage, NOTICE_PAGE_MS);
      });

      function renderBoards() {
        $('tube-rows').innerHTML = tube
          .slice(0, ROWS_PER_BOARD)
          .map(
            ([line, dest, sub, m, vehicle]) => `
            <li data-vehicle="${esc(vehicle)}"><span class="line-pill" style="background:${lines[line][0]};color:${lines[line][1]}">${line}</span>
            <span class="dest"><strong>${esc(dest)}</strong><span>${esc(sub)}</span></span>${mins(m)}</li>`
          )
          .join('');
        $('bus-rows').innerHTML = buses
          .slice(0, ROWS_PER_BOARD)
          .map(
            ([route, dest, sub, m, vehicle]) => `
            <li data-vehicle="${esc(vehicle)}"><span class="route">${route}</span>
            <span class="dest"><strong>${esc(dest)}</strong><span>${esc(sub)}</span></span>${mins(m)}</li>`
          )
          .join('');
      }

      // Each minute the departures count down; one that has left goes to the back of the queue.
      function tick(list, gap) {
        list.forEach(r => r[3]--);
        while (list.length && list[0][3] < 0) {
          const gone = list.shift();
          gone[3] = list[list.length - 1][3] + gap;
          list.push(gone);
        }
      }

      function updateClock() {
        $('clock').textContent = new Date().toLocaleTimeString('en-GB', { hour: '2-digit', minute: '2-digit' });
      }

      function fit() {
        const scale = Math.min(innerWidth / 1280, innerHeight / 800);
        const left = (innerWidth - 1280 * scale) / 2;
        const top = (innerHeight - 800 * scale) / 2;
        $('scaler').style.transform = `translate(${left}px, ${top}px) scale(${scale})`;
      }

      renderWeather();
      renderBoards();
      updateClock();
      fit();
      layoutNotices();
      addEventListener('resize', fit);
      setInterval(() => {
        tick(tube, 3);
        tick(buses, 3);
        renderBoards();
        updateClock();
      }, 60000);
    </script>
  </body>
