---
# A part of the setup (tasks/main.yml runs it when what it installs changed, or a week after it last ran).
# System settings: locale, host name, time zone, the kernel command line and boot firmware, and the settings for
# unattended upgrades and the setup hotspot.

# System settings -----------------------------------------------------------------------------------------------------
- name: full | Enable the locale
  ansible.builtin.lineinfile:
    path: /etc/locale.gen
    regexp: '^#?\s*{{ kiosk_locale | regex_escape }}\s+UTF-8'
    line: '{{ kiosk_locale }} UTF-8'
  notify: Generate the locale

- name: full | Set the default locale
  ansible.builtin.copy:
    content: |
      LANG={{ kiosk_locale }}
    dest: /etc/default/locale
    owner: root
    group: root
    mode: '0644'

# Debian's sudo and some tools look the host name up; Raspberry Pi OS's cloud-init does not add it to /etc/hosts.
- name: full | Resolve the host name locally
  ansible.builtin.lineinfile:
    path: /etc/hosts
    regexp: '^127\.0\.1\.1\s'
    line: '127.0.1.1 {{ kiosk_hostname }}'
    # A container's /etc/hosts (the playbook test) is a bind mount, which cannot be replaced by a rename.
    unsafe_writes: true

- name: full | Set the time zone
  ansible.builtin.file:
    src: '/usr/share/zoneinfo/{{ kiosk_timezone }}'
    dest: /etc/localtime
    state: link
    force: true

# Boot: console on tty3 and a quiet boot, the Wi-Fi country, the screen mode. cmdline.txt is a single line. The params
# are appended only if missing; [ \t]*$ (not \s*$) keeps the final newline.
- name: full | Move the console to tty3
  ansible.builtin.replace:
    path: /boot/firmware/cmdline.txt
    regexp: '\bconsole=tty1\b'
    replace: console=tty3

- name: full | Add the kernel command line parameters
  ansible.builtin.replace:
    path: /boot/firmware/cmdline.txt
    regexp: '^(?!.*(?:^|\s){{ item | regex_escape }}(?:\s|$))(.*?)[ \t]*$'
    replace: '\1 {{ item }}'
  loop: '{{ kiosk_cmdline_params }}'

# The screen mode (kiosk_video_mode in defaults/main.yml). Not read in a container, which has no screen of the Pi's.
- name: full | Read the screen's own mode
  ansible.builtin.command:
    argv:
      - node
      - '{{ kiosk_audio_src }}/screen-mode.ts'
  register: kiosk_screen_mode_read
  changed_when: false
  failed_when: false
  when: not kiosk_video_mode and not kiosk_enable_only

- name: full | Work out the screen mode
  ansible.builtin.set_fact:
    kiosk_screen_mode: >-
      {{ kiosk_video_mode or (kiosk_screen_mode_read.stdout | default('') | trim
        | regex_search('^[0-9]+x[0-9]+@[0-9]+$') | default('', true)) }}

# Only once the mode is known: without a screen to read it from, the mode already set stays.
- name: full | Remove another screen mode from the kernel command line
  ansible.builtin.replace:
    path: /boot/firmware/cmdline.txt
    regexp: '[ \t]+video=HDMI-A-{{ item }}:(?!{{ kiosk_screen_mode | regex_escape }}(?:\s|$))\S*'
    replace: ''
  loop: [1, 2]
  when: kiosk_screen_mode | length > 0

- name: full | Add the screen mode to the kernel command line
  ansible.builtin.replace:
    path: /boot/firmware/cmdline.txt
    regexp: '^(?!.*(?:^|\s)video=HDMI-A-{{ item }}:)(.*?)[ \t]*$'
    replace: '\1 video=HDMI-A-{{ item }}:{{ kiosk_screen_mode or kiosk_video_mode_fallback }}'
  loop: [1, 2]

# disable_splash hides the firmware's rainbow screen. The Pi 5 would boot a kernel with 16 KB memory pages; kernel8.img
# is the 4 KB-page kernel the Pi 4 already uses, which Widevine's module is built for.
- name: full | Configure the boot firmware
  ansible.builtin.blockinfile:
    path: /boot/firmware/config.txt
    marker: '# {mark} THE MAX MIX KIOSK'
    block: |
      disable_splash=1

      [pi5]
      kernel=kernel8.img

      [all]

# The setup hotspot (pi/kiosk-audio/hotspot.ts): NetworkManager's own DHCP and DNS for it answer every name with the kiosk
# (50-kiosk-captive.conf), and the service may serve its page on port 80.
- name: full | Install the settings for unattended upgrades and the setup hotspot's DNS
  ansible.builtin.copy:
    src: '{{ item.src }}'
    dest: '{{ item.dest }}/{{ item.src }}'
    owner: root
    group: root
    mode: '0644'
  loop:
    - { src: 20auto-upgrades, dest: /etc/apt/apt.conf.d }
    - { src: 52kiosk-unattended-upgrades, dest: /etc/apt/apt.conf.d }
    - { src: 50-kiosk-captive.conf, dest: /etc/NetworkManager/dnsmasq-shared.d }
  loop_control:
    label: '{{ item.src }}'

- name: full | Let the kiosk service serve the hotspot's page on port 80
  ansible.builtin.copy:
    src: 50-kiosk-unprivileged-ports.conf
    dest: /etc/sysctl.d/50-kiosk-unprivileged-ports.conf
    owner: root
    group: root
    mode: '0644'
  notify: Apply sysctl settings

# Releases up to v2.22.0 pointed NetworkManager's connectivity check at Debian for kiosk-session, which no longer asks.
- name: full | Remove NetworkManager's connectivity check
  ansible.builtin.file:
    path: /etc/NetworkManager/conf.d/20-connectivity.conf
    state: absent
  notify: Reload NetworkManager
