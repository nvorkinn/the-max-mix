version: 2

# One daily PR for the whole project: every entry below feeds the `dependencies` multi-ecosystem group, which sets the
# schedule and the commit message for all of them, and `patterns: ['*']` puts each of an entry's dependencies in it,
# major updates included. Security updates are opened separately by GitHub and are not affected by the schedule.
multi-ecosystem-groups:
  dependencies:
    schedule:
      interval: daily
    commit-message:
      prefix: 'chore(deps)'

updates:
  - package-ecosystem: npm
    directory: /
    patterns: ['*']
    multi-ecosystem-group: dependencies
    # typescript-eslint cannot load TypeScript 7 (the native compiler has no JS API) yet; its peer range is <6.1.
    ignore:
      - dependency-name: typescript
        update-types: [version-update:semver-major, version-update:semver-minor]
      # Node types follow the Node major in .nvmrc (24), so a newer major would allow APIs the Pi and CI lack.
      - dependency-name: '@types/node'
        update-types: [version-update:semver-major]

  # The kiosk-audio service's packages on the Pi: the image build installs them from this lockfile (npm ci).
  - package-ecosystem: npm
    directory: /server
    patterns: ['*']
    multi-ecosystem-group: dependencies

  - package-ecosystem: github-actions
    directory: /
    patterns: ['*']
    multi-ecosystem-group: dependencies
