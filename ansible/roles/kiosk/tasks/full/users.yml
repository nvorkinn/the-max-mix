---
# A part of the setup (tasks/main.yml runs it when what it installs changed, or a week after it last ran).
# The kiosk user, and the admin account for maintenance over SSH (and Tailscale).

# The kiosk user ------------------------------------------------------------------------------------------------------
# One program for all of them, as a module run costs seconds on a Pi. Prints each group it created.
- name: full | users | Make sure the kiosk user's groups exist
  ansible.builtin.shell:
    cmd: |
      set -euo pipefail
      for group in $GROUPS_NEEDED; do
        if ! getent group "$group" > /dev/null; then
          groupadd --system "$group"
          echo "$group"
        fi
      done
    executable: /bin/bash
  environment:
    GROUPS_NEEDED: "{{ kiosk_groups | join(' ') }}"
  register: kiosk_groups_created
  changed_when: kiosk_groups_created.stdout | length > 0

# Locked password and only the groups the kiosk needs, so nothing can log in as it and nothing can use sudo, whatever
# created the user.
- name: full | users | Set up the kiosk user
  ansible.builtin.user:
    name: '{{ kiosk_user }}'
    comment: THE MAX MIX kiosk
    shell: /bin/bash
    password: '*'
    groups: '{{ kiosk_groups }}'
    append: false
    create_home: true

# Maintenance over SSH ------------------------------------------------------------------------------------------------
# The admin account: no password ('*' cannot match one, but unlike '!' it does not lock out SSH keys), sudo without one,
# and the GitHub account's public keys as its only way in.
- name: full | users | Set up the admin user
  ansible.builtin.user:
    name: '{{ kiosk_admin_user }}'
    comment: THE MAX MIX admin
    shell: /bin/bash
    password: '*'
    groups: [sudo]
    append: true
    create_home: true

# The keys themselves come from GitHub (kiosk_admin_github_user): kiosk-ssh-keys.timer fetches them soon after every boot
# and then regularly, so a key removed there stops working without waiting for a release. sshd uses the first value it
# reads and Debian's sshd_config includes sshd_config.d first, so these settings win. sudo checks its file first.
- name: full | users | Let the admin user use sudo without a password, and allow SSH for it by key only
  ansible.builtin.command:
    argv: [node, '{{ kiosk_install_files }}']
    stdin: '{{ kiosk_user_files | to_json }}'
  vars:
    kiosk_user_files:
      - path: /etc/sudoers.d/50-kiosk-admin
        mode: '0440'
        validate: [/usr/sbin/visudo, -cf, '%s']
        content: |
          {{ kiosk_admin_user }} ALL=(ALL:ALL) NOPASSWD: ALL
      - path: /etc/ssh/sshd_config.d/10-kiosk.conf
        mode: '0644'
        content: |
          # Installed by the kiosk playbook (ansible/roles/kiosk).
          PermitRootLogin no
          PasswordAuthentication no
          KbdInteractiveAuthentication no
          AuthenticationMethods publickey
          AllowUsers {{ kiosk_admin_user }}
  register: kiosk_user_files_installed
  changed_when: kiosk_user_files_installed.stdout | length > 0

# One program, as a module run costs seconds on a Pi: the SSH directory (kiosk-ssh-keys writes the keys only where it
# exists), sshd on or off (restarted when its settings changed), and Tailscale. Tailscale runs from boot. It joins the
# tailnet only after a one-time `sudo tailscale up` by hand (see pi/cloud-init/README.md), so no key is in the
# repository; the login lives in /var/lib/tailscale. SSH then goes through sshd as above, over the tailnet address.
# Prints what it changed.
- name: full | users | Turn SSH and Tailscale on or off
  ansible.builtin.shell:
    cmd: |
      set -euo pipefail
      ssh_dir=/home/$ADMIN/.ssh
      if [[ ! -d $ssh_dir || $(stat -c '%a %U %G' "$ssh_dir") != "700 $ADMIN $ADMIN" ]]; then
        install -d -m 0700 -o "$ADMIN" -g "$ADMIN" "$ssh_dir"
        echo "$ssh_dir"
      fi
      # Usage: unit UNIT on|off [restart]
      unit() {
        if [[ $2 == on ]] && ! systemctl is-enabled --quiet "$1"; then
          systemctl enable --quiet "$1"
          echo "enabled $1"
        elif [[ $2 == off ]] && systemctl is-enabled --quiet "$1"; then
          systemctl disable --quiet "$1"
          echo "disabled $1"
        fi
        [[ $ENABLE_ONLY != True ]] || return 0
        if [[ $2 == off ]]; then
          if systemctl is-active --quiet "$1"; then
            systemctl stop "$1"
            echo "stopped $1"
          fi
        elif [[ ${3:-} == restart ]]; then
          systemctl restart "$1"
          echo "restarted $1"
        elif ! systemctl is-active --quiet "$1"; then
          systemctl start "$1"
          echo "started $1"
        fi
      }
      unit ssh.service "$SSH" "$SSH_RESTART"
      if [[ $TAILSCALE == on ]]; then
        unit tailscaled.service on
      fi
    executable: /bin/bash
  environment:
    ADMIN: '{{ kiosk_admin_user }}'
    SSH: "{{ 'on' if kiosk_ssh_enabled | bool else 'off' }}"
    SSH_RESTART: "{{ 'restart' if '/etc/ssh/sshd_config.d/10-kiosk.conf' in kiosk_user_files_installed.stdout_lines else '' }}"
    TAILSCALE: "{{ 'on' if kiosk_tailscale_enabled | bool else 'off' }}"
    ENABLE_ONLY: '{{ kiosk_enable_only | bool }}'
  register: kiosk_user_services
  changed_when: kiosk_user_services.stdout | length > 0
