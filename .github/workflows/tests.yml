name: Tests

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  tests:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
      # Same node_modules cache as the e2e job: unpacking it is quicker than `npm ci` writing its 800 packages one by one.
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        id: modules
        with:
          path: node_modules
          key: node-modules-${{ runner.os }}-${{ hashFiles('.nvmrc', 'package-lock.json') }}
      - if: steps.modules.outputs.cache-hit != 'true'
        run: npm ci --ignore-scripts --no-audit --no-fund
      # The coverage run executes the app tests (and enforces the thresholds), so `npm test` would run them twice.
      - run: npm run test:coverage
      - name: Coverage summary
        if: ${{ !cancelled() }}
        run: node scripts/coverage-summary.ts >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: ${{ !cancelled() }}
        with:
          name: coverage
          path: coverage
          if-no-files-found: ignore

  # Browser tests of the built app with Spotify faked, served by `vite preview`. Runs in parallel with `tests` and uses the Google Chrome that
  # ships on ubuntu-latest, so no browser download is needed.
  e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      # The runner's disk is read in lazily, so Chrome's first start takes about ten seconds. Starting it once in the
      # background lets that happen while the dependencies install, instead of before the first test.
      - name: Warm up Chrome
        run: (google-chrome --headless --disable-gpu --dump-dom about:blank > /dev/null 2>&1 &)
      # Two commits: a pull request is checked out as its merge into main, whose first parent is main, so the difference
      # between the two is what the pull request changes (see "Choose the tests to trace").
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 2
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
      # Unpacking node_modules from the cache is quicker than `npm ci` writing its 800 packages one by one.
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        id: modules
        with:
          path: node_modules
          key: node-modules-${{ runner.os }}-${{ hashFiles('.nvmrc', 'package-lock.json') }}
      - if: steps.modules.outputs.cache-hit != 'true'
        run: npm ci --ignore-scripts --no-audit --no-fund
      - run: npm run build
      # Filming a failed test's second run needs Playwright's ffmpeg, a small download; the browser is the preinstalled Chrome.
      - run: npx playwright install ffmpeg
      # Recording a trace of every test takes about a fifth of the run, so only the tests a pull request is about are
      # traced (scripts/e2e-areas.ts); any other test is traced on its second run, if its first fails. A push to main
      # has no report to read, so nothing is traced there until it fails.
      - name: Choose the tests to trace
        env:
          EVENT: ${{ github.event_name }}
        run: |
          set -o pipefail
          if [[ $EVENT == pull_request ]]; then
            git diff --name-only HEAD^1 HEAD | node scripts/e2e-traced.ts | tee -a "$GITHUB_ENV"
          else
            echo 'E2E_TRACE_TAGS=' >> "$GITHUB_ENV"
          fi
      - run: npm run test:e2e
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: ${{ !cancelled() }}
        with:
          name: playwright-report
          path: |
            e2e/playwright-report
            e2e/test-results
            e2e/screenshots
          if-no-files-found: ignore

  # Puts the e2e screenshots and the Playwright report on the gh-pages branch (served by GitHub Pages) and keeps one
  # comment on the pull request up to date with the screens that changed, so a UI change can be judged from the PR
  # page. A separate job, so that the e2e job, which runs the PR's code, never gets write access. Forks and Dependabot
  # get no write token, so their PRs are skipped. pr-screenshots-cleanup.yml removes a PR's folder when it closes.
  screenshots:
    needs: e2e
    if: >-
      ${{ !cancelled() && needs.e2e.result != 'skipped' && github.event_name == 'pull_request' &&
      github.event.pull_request.head.repo.full_name == github.repository && github.actor != 'dependabot[bot]' }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
      pull-requests: write
    # One writer at a time, because each push replaces the branch.
    concurrency:
      group: gh-pages
      cancel-in-progress: false
    env:
      GH_TOKEN: ${{ github.token }}
      REPO: ${{ github.repository }}
      PR: ${{ github.event.pull_request.number }}
      FOLDER: pr-${{ github.event.pull_request.number }}/${{ github.run_id }}-${{ github.run_attempt }}
    steps:
      # Runs can finish out of order, so a run for an older commit of the PR leaves the comment to the newer one.
      - name: Check this run is for the PR's latest commit
        id: latest
        env:
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: echo "latest=$([[ $(gh api "repos/$REPO/pulls/$PR" --jq .head.sha) == "$HEAD_SHA" ]] && echo true)" >> "$GITHUB_OUTPUT"
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        if: ${{ steps.latest.outputs.latest }}
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        if: ${{ steps.latest.outputs.latest }}
        with:
          node-version-file: .nvmrc
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        if: ${{ steps.latest.outputs.latest }}
        with:
          name: playwright-report
          path: results
      # The branch is rebuilt as a single commit each time, so old reports do not pile up in the repository's history.
      # Each run gets a new folder, which keeps GitHub's image cache from showing an earlier run's screenshots.
      - name: Publish to the gh-pages branch
        if: ${{ steps.latest.outputs.latest }}
        run: |
          git init --quiet site && cd site
          git remote add origin "https://x-access-token:${GH_TOKEN}@github.com/${REPO}.git"
          if git fetch --quiet --depth 1 origin gh-pages; then git checkout --quiet FETCH_HEAD; fi
          git checkout --quiet --orphan publish
          rm -rf "${FOLDER%/*}"
          mkdir -p "$FOLDER/shots"
          touch .nojekyll
          cp -r ../results/playwright-report "$FOLDER/report"
          if [[ -d ../results/test-results ]]; then
            # A failed test's second run (its -retry1 folder) repeats the same screenshots, so only the first is shown.
            rsync -a --exclude='*-retry*/' --include='*/' --include='*.png' --exclude='*' --prune-empty-dirs \
              ../results/test-results/ "$FOLDER/shots/"
          fi
          git add -A
          git -c user.name='github-actions[bot]' -c user.email='41898282+github-actions[bot]@users.noreply.github.com' \
            commit --quiet -m "Screenshots and reports of the open pull requests"
          git push --quiet --force origin publish:gh-pages
      - name: Update the pull request comment
        if: ${{ steps.latest.outputs.latest }}
        env:
          SHOTS_DIR: site/${{ env.FOLDER }}/shots
          SHOTS_URL: https://raw.githubusercontent.com/${{ github.repository }}/gh-pages/${{ env.FOLDER }}/shots
          REPORT_URL: https://${{ github.repository_owner }}.github.io/${{ github.event.repository.name }}/${{ env.FOLDER }}/report/
          BASELINES_FILE: baselines.txt
          CHANGED_FILES_FILE: changed-files.txt
          RESULTS_FILE: results/test-results/results.json
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          E2E_RESULT: ${{ needs.e2e.result }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          gh api --paginate "repos/$REPO/pulls/$PR/files" \
            --jq '.[] | select(.filename | startswith("e2e/screenshots/")) | "\(.status) \(.filename)"' > baselines.txt
          gh api --paginate "repos/$REPO/pulls/$PR/files" --jq '.[].filename' > changed-files.txt
          node scripts/screenshot-comment.ts > comment.md
          ids=$(gh api --paginate "repos/$REPO/issues/$PR/comments" --jq \
            '.[] | select(.user.login == "github-actions[bot]" and (.body | startswith("<!-- playwright-screenshots -->"))) | .id')
          id=$(head -n 1 <<< "$ids")
          if [[ -n $id ]]; then
            gh api --method PATCH "repos/$REPO/issues/comments/$id" -F body=@comment.md > /dev/null
          else
            gh api --method POST "repos/$REPO/issues/$PR/comments" -F body=@comment.md > /dev/null
          fi
