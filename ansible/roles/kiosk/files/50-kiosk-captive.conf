# Read by the dnsmasq NetworkManager runs for the setup hotspot (pi/kiosk-audio/hotspot.ts), and by no other connection.
# Every name the phone asks for gets the kiosk's address on the hotspot, so the phone's check for internet reaches the
# kiosk's setup page, and its "sign in to Wi-Fi" screen opens it by itself. 10.42.0.1 is the address NetworkManager gives
# a hotspot.
address=/#/10.42.0.1
