name: Release

# Shown on the GitHub dashboard among the running releases.
# dashboard: release

# Releases happen here and only here. Create a release for a new v* tag on main (GitHub's New release form, which also
# writes the notes) or push a version tag from main (git tag v1.2.3 && git push origin v1.2.3) to build the app, copy it
# to the server over Tailscale and then publish the GitHub release for the tag (notes generated from the merged pull
# requests when it has none yet). The very last step uploads the Pis' signed A/B update bundle (the-max-mix.raucb,
# built by bundle.yml) to the release. Stable Pis install releases/latest/download/the-max-mix.raucb
# (pi/kiosk-audio/image-update.ts), so a release made with the form, which is the latest from the start, reaches them
# only once the deploy has worked and its bundle is there, and the Pis and the web app move together.
#
# Run it by hand with an existing tag to redeploy that release and mark it as the latest one again, which also rolls the
# Pis back (or forward) to its bundle at their next update. The runner joins the tailnet with its GitHub identity (id-token); the
# bundle's signing key comes from Vaultwarden (bundle.yml).
on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      tag:
        description: Existing tag to deploy and mark as the latest release (for example v1.2.3)
        required: true
        type: string

permissions:
  id-token: write
  contents: read

# Never run two production deploys at once, and never cancel one that is under way.
concurrency:
  group: release
  cancel-in-progress: false

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      TAG: ${{ inputs.tag || github.ref_name }}
    steps:
      - name: Check the tag
        run: |
          if [[ ! $TAG =~ ^v[0-9A-Za-z][0-9A-Za-z._-]*$ ]]; then
            echo "::error::The tag must look like v1.2.3, got: $TAG"
            exit 1
          fi
      # The Pis run whatever the latest release holds as root (see SECURITY.md), so only release a commit that is on main.
      - name: Check the tag is on main
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          sha=$(gh api "repos/$GH_REPO/commits/$TAG" --jq .sha)
          status=$(gh api "repos/$GH_REPO/compare/$sha...main" --jq .status)
          if [[ $status != ahead && $status != identical ]]; then
            echo "::error::$TAG ($sha) is not on main. Only tag commits on main."
            exit 1
          fi

  release:
    needs: check
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      TAG: ${{ inputs.tag || github.ref_name }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: refs/tags/${{ env.TAG }}
          persist-credentials: false
          # The countdown-api submodule: the build bundles its generated client.
          submodules: true
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
      # The node_modules cache the tests on main saved (the key matches tests.yml): unpacking it is quicker than `npm ci`
      # writing its 800 packages one by one. Restore only: a cache saved from a tag is one no other run can read. This
      # comes before the version is set, which changes package-lock.json and with it the key.
      - uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        id: modules
        with:
          path: node_modules
          key: node-modules-${{ runner.os }}-${{ hashFiles('.nvmrc', 'package-lock.json') }}
      # The build gets the release's version (v1.2.3 becomes 1.2.3) without committing anything; npm rejects a tag that is
      # not a valid semantic version.
      - name: Set the version from the tag
        run: npm version "${TAG#v}" --no-git-tag-version --allow-same-version
      # Build before joining the tailnet, so a release that does not build fails before anything is deployed.
      - if: steps.modules.outputs.cache-hit != 'true'
        run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Build
        run: npm run build
      - name: Tailscale
        uses: tailscale/github-action@064b10558093f38325e838ddea35486bdc6b1d5c # v4.4.0
        with:
          oauth-client-id: TBqTMhW4Q811CNTRL-k6UF5xqLhW11CNTRL
          audience: api.tailscale.com/TBqTMhW4Q811CNTRL-k6UF5xqLhW11CNTRL
          tags: tag:ci
      # The release directory is named after the tag's commit (the checkout), which on a run by hand is not github.sha.
      - name: Deploy
        env:
          APP: the-max-mix
          HOST: deploy@nikolai-server
        run: |
          ssh_opts=(-o StrictHostKeyChecking=accept-new)
          rel="/srv/releases/$APP/$(git rev-parse HEAD)"
          # shellcheck disable=SC2029 # the paths are meant to be filled in here, on the runner
          ssh "${ssh_opts[@]}" "$HOST" "mkdir -p $rel"
          rsync -az --delete -e "ssh ${ssh_opts[*]}" dist/ "$HOST:$rel/"
          # shellcheck disable=SC2029 # the paths are meant to be filled in here, on the runner
          ssh "${ssh_opts[@]}" "$HOST" "ln -sfn $rel /srv/sites/$APP.tmp && mv -T /srv/sites/$APP.tmp /srv/sites/$APP"

  # The Pis' bundle, built from the pushed tag in parallel with the deploy. A run by hand (a redeploy or a rollback)
  # keeps the bundle the release already has, so the Pis go back to exactly what was released.
  bundle:
    needs: check
    if: github.event_name == 'push'
    uses: ./.github/workflows/bundle.yml
    with:
      channel: ${{ github.ref_name }}
      version: ${{ github.ref_name }}
      sign: true
    secrets: inherit

  # A separate job, so that only this step, which runs no code from the repository, can write to it.
  publish:
    needs: [release, bundle]
    if: ${{ !cancelled() && needs.release.result == 'success' && contains(fromJSON('["success", "skipped"]'), needs.bundle.result) }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write
    env:
      TAG: ${{ inputs.tag || github.ref_name }}
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
    steps:
      - if: needs.bundle.result == 'success'
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: bundle
      # A new tag gets a new release; a tag that already has one (made with the New release form, a redeploy or a
      # rollback) only becomes the latest again. A new bundle goes up last: the Pis install a release only once it is
      # there. A run by hand needs the bundle the release already has.
      - name: Publish the GitHub release
        run: |
          if [[ ! -f the-max-mix.raucb ]] \
            && ! gh release view "$TAG" --json assets --jq '.assets[].name' 2> /dev/null | grep -qx the-max-mix.raucb; then
            echo "::error::$TAG has no the-max-mix.raucb, so the Pis could not install it. Push a new tag instead."
            exit 1
          fi
          if gh release view "$TAG" > /dev/null 2>&1; then
            gh release edit "$TAG" --draft=false --prerelease=false --latest
          else
            gh release create "$TAG" --verify-tag --generate-notes --latest --title "$TAG"
          fi
          if [[ -f the-max-mix.raucb ]]; then
            gh release upload "$TAG" the-max-mix.raucb --clobber
          fi
