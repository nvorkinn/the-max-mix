---
- name: Reload the user units
  ansible.builtin.systemd_service:
    scope: user
    daemon_reload: true
  become: "{{ kiosk_user != ansible_facts['user_id'] }}"
  become_user: '{{ kiosk_user }}'
  environment:
    XDG_RUNTIME_DIR: '/run/user/{{ kiosk_uid }}'
  listen: Restart the kiosk

# try-restart only restarts a kiosk that is running, so a headless first run starts nothing and the kiosk starts at the
# next login. The systemd module has no equivalent (state: restarted would start it too).
- name: Restart a running kiosk
  ansible.builtin.command: systemctl --user try-restart the-max-mix-kiosk.service # noqa: command-instead-of-module
  become: "{{ kiosk_user != ansible_facts['user_id'] }}"
  become_user: '{{ kiosk_user }}'
  environment:
    XDG_RUNTIME_DIR: '/run/user/{{ kiosk_uid }}'
  changed_when: false
  listen: Restart the kiosk
