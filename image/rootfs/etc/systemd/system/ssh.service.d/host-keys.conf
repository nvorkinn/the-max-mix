# The host keys live on /data (kiosk-ssh-host-keys makes them on first boot), so they must exist before sshd checks its
# configuration. Drop-in ExecStartPre lines run after the unit's own, so reset the list and put the check back after.
[Service]
ExecStartPre=
ExecStartPre=/usr/local/sbin/kiosk-ssh-host-keys
ExecStartPre=/usr/sbin/sshd -t
