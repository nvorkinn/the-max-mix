---
# Sets up Raspberry Pi OS as a THE MAX MIX kiosk: Chromium in fullscreen opens the hosted app after desktop login.
# Run it on the Pi with ansible-pull as the desktop user (see the README, "Raspberry Pi kiosk installation"):
#   ansible-pull -U https://github.com/nvorkinn/the-max-mix.git -C main -d ~/.cache/the-max-mix-ansible \
#     -i localhost, ansible/local.yml
- name: Set up the THE MAX MIX kiosk
  hosts: localhost
  connection: local
  roles:
    - kiosk
