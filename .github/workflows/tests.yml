name: Tests

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  tests:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      # The coverage run executes the app tests (and enforces the thresholds), so `npm test` would run them twice; only the
      # Wi-Fi panel tests are left to run on their own.
      - run: npm run test:coverage
      - run: npm run test:wifi-panel
      - name: Coverage summary
        if: ${{ !cancelled() }}
        run: node scripts/coverage-summary.ts >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: ${{ !cancelled() }}
        with:
          name: coverage
          path: coverage
          if-no-files-found: ignore

  # Browser tests of the built app with Spotify faked, served by `vite preview`. Runs in parallel with `tests` and uses the Google Chrome that
  # ships on ubuntu-latest, so no browser download is needed.
  e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci --ignore-scripts
      - run: npm run build
      # The test videos need Playwright's ffmpeg, a small download; the browser itself is the preinstalled Chrome.
      - run: npx playwright install ffmpeg
      - run: npm run test:e2e
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: ${{ !cancelled() }}
        with:
          name: playwright-report
          path: |
            e2e/playwright-report
            e2e/test-results
            e2e/screenshots
          if-no-files-found: ignore

  # Puts the e2e screenshots and the Playwright report on the gh-pages branch (served by GitHub Pages) and keeps one
  # comment on the pull request up to date with the screens that changed, so a UI change can be judged from the PR
  # page. A separate job, so that the e2e job, which runs the PR's code, never gets write access. Forks and Dependabot
  # get no write token, so their PRs are skipped. pr-screenshots-cleanup.yml removes a PR's folder when it closes.
  screenshots:
    needs: e2e
    if: >-
      ${{ !cancelled() && needs.e2e.result != 'skipped' && github.event_name == 'pull_request' &&
      github.event.pull_request.head.repo.full_name == github.repository && github.actor != 'dependabot[bot]' }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
      pull-requests: write
    # One writer at a time, because each push replaces the branch.
    concurrency:
      group: gh-pages
      cancel-in-progress: false
    env:
      GH_TOKEN: ${{ github.token }}
      REPO: ${{ github.repository }}
      PR: ${{ github.event.pull_request.number }}
      FOLDER: pr-${{ github.event.pull_request.number }}/${{ github.run_id }}-${{ github.run_attempt }}
    steps:
      # Runs can finish out of order, so a run for an older commit of the PR leaves the comment to the newer one.
      - name: Check this run is for the PR's latest commit
        id: latest
        env:
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: echo "latest=$([[ $(gh api "repos/$REPO/pulls/$PR" --jq .head.sha) == "$HEAD_SHA" ]] && echo true)" >> "$GITHUB_OUTPUT"
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        if: ${{ steps.latest.outputs.latest }}
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        if: ${{ steps.latest.outputs.latest }}
        with:
          node-version-file: .nvmrc
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        if: ${{ steps.latest.outputs.latest }}
        with:
          name: playwright-report
          path: results
      # The branch is rebuilt as a single commit each time, so old reports do not pile up in the repository's history.
      # Each run gets a new folder, which keeps GitHub's image cache from showing an earlier run's screenshots.
      - name: Publish to the gh-pages branch
        if: ${{ steps.latest.outputs.latest }}
        run: |
          git init --quiet site && cd site
          git remote add origin "https://x-access-token:${GH_TOKEN}@github.com/${REPO}.git"
          if git fetch --quiet --depth 1 origin gh-pages; then git checkout --quiet FETCH_HEAD; fi
          git checkout --quiet --orphan publish
          rm -rf "${FOLDER%/*}"
          mkdir -p "$FOLDER/shots"
          touch .nojekyll
          cp -r ../results/playwright-report "$FOLDER/report"
          if [[ -d ../results/test-results ]]; then
            rsync -a --include='*/' --include='*.png' --exclude='*' --prune-empty-dirs ../results/test-results/ "$FOLDER/shots/"
          fi
          git add -A
          git -c user.name='github-actions[bot]' -c user.email='41898282+github-actions[bot]@users.noreply.github.com' \
            commit --quiet -m "Screenshots and reports of the open pull requests"
          git push --quiet --force origin publish:gh-pages
      - name: Update the pull request comment
        if: ${{ steps.latest.outputs.latest }}
        env:
          SHOTS_DIR: site/${{ env.FOLDER }}/shots
          SHOTS_URL: https://raw.githubusercontent.com/${{ github.repository }}/gh-pages/${{ env.FOLDER }}/shots
          REPORT_URL: https://${{ github.repository_owner }}.github.io/${{ github.event.repository.name }}/${{ env.FOLDER }}/report/
          BASELINES_FILE: baselines.txt
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          E2E_RESULT: ${{ needs.e2e.result }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          gh api --paginate "repos/$REPO/pulls/$PR/files" \
            --jq '.[] | select(.filename | startswith("e2e/screenshots/")) | "\(.status) \(.filename)"' > baselines.txt
          node scripts/screenshot-comment.ts > comment.md
          ids=$(gh api --paginate "repos/$REPO/issues/$PR/comments" --jq \
            '.[] | select(.user.login == "github-actions[bot]" and (.body | startswith("<!-- playwright-screenshots -->"))) | .id')
          id=$(head -n 1 <<< "$ids")
          if [[ -n $id ]]; then
            gh api --method PATCH "repos/$REPO/issues/comments/$id" -F body=@comment.md > /dev/null
          else
            gh api --method POST "repos/$REPO/issues/$PR/comments" -F body=@comment.md > /dev/null
          fi
