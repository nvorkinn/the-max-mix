<?xml version="1.0"?>
<!DOCTYPE busconfig PUBLIC "-//freedesktop//DTD D-BUS Bus Configuration 1.0//EN"
  "http://www.freedesktop.org/standards/dbus/1.0/busconfig.dtd">
<!-- kiosk-server (the kiosk user) checks for updates from the screen: it reads RAUC's state and a bundle's manifest. -->
<!-- Installing, marking slots and rolling back stay with root (kiosk-update.service, kiosk-health.service). -->
<busconfig>
  <policy user="kiosk">
    <allow send_destination="de.pengutronix.rauc" send_interface="org.freedesktop.DBus.Introspectable"/>
    <allow send_destination="de.pengutronix.rauc" send_interface="org.freedesktop.DBus.Properties" send_member="Get"/>
    <allow send_destination="de.pengutronix.rauc" send_interface="de.pengutronix.rauc.Installer" send_member="GetSlotStatus"/>
    <allow send_destination="de.pengutronix.rauc" send_interface="de.pengutronix.rauc.Installer" send_member="InspectBundle"/>
  </policy>
</busconfig>
