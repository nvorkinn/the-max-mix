name: Tests

on:
  pull_request:
  push:
    branches: [main]
  workflow_call:

permissions:
  contents: read

jobs:
  tests:
    name: tests (${{ matrix.label }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # The lowest Node version package.json's engines field promises, and the one .nvmrc (the Pi, the other
        # workflows) uses.
        include:
          - label: Node 22 minimum
            node-version: 22
          - label: Node from .nvmrc
            node-version-file: .nvmrc
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: ${{ matrix.node-version }}
          node-version-file: ${{ matrix.node-version-file }}
          cache: npm
          cache-dependency-path: |
            client/package-lock.json
            server/package-lock.json
      - run: npm --prefix client ci
      - run: npm --prefix server ci
      # The coverage run executes the server and client tests (and enforces the thresholds), so `npm test` would run
      # them twice; only the kiosk script test is left to run on its own.
      - run: npm run test:coverage
      - run: bash scripts/test-kiosk.sh
      - name: Coverage summary
        if: ${{ !cancelled() && matrix.node-version-file }}
        run: node scripts/coverage-summary.mjs >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: ${{ !cancelled() && matrix.node-version-file }}
        with:
          name: coverage
          path: |
            server/coverage
            client/coverage
          if-no-files-found: ignore
      - run: npm run build
