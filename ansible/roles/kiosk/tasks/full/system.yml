---
# A part of the setup (tasks/main.yml runs it when what it installs changed, or a week after it last ran).
# System settings: locale, host name, time zone, the kernel command line and boot firmware, and the settings for
# unattended upgrades and the setup hotspot.

# System settings -----------------------------------------------------------------------------------------------------
- name: full | system | Enable the locale
  ansible.builtin.lineinfile:
    path: /etc/locale.gen
    regexp: '^#?\s*{{ kiosk_locale | regex_escape }}\s+UTF-8'
    line: '{{ kiosk_locale }} UTF-8'
  notify: Generate the locale

# Debian's sudo and some tools look the host name up; Raspberry Pi OS's cloud-init does not add it to /etc/hosts.
- name: full | system | Resolve the host name locally
  ansible.builtin.lineinfile:
    path: /etc/hosts
    regexp: '^127\.0\.1\.1\s'
    line: '127.0.1.1 {{ kiosk_hostname }}'
    # A container's /etc/hosts (the playbook test) is a bind mount, which cannot be replaced by a rename.
    unsafe_writes: true

- name: full | system | Set the time zone
  ansible.builtin.file:
    src: '/usr/share/zoneinfo/{{ kiosk_timezone }}'
    dest: /etc/localtime
    state: link
    force: true

# Boot: console on tty3 and a quiet boot, the Wi-Fi country, the screen mode (kiosk_video_mode in defaults/main.yml, or
# the screen's own, read here but not in a container, which has no screen of the Pi's). cmdline.txt is a single line. One
# program makes every change to it, as a module run costs seconds on a Pi: a parameter is added only if missing, and
# another screen mode is removed only once the mode is known (without a screen to read it from, the mode already set
# stays). Prints the new line when it changed it.
- name: full | system | Set the kernel command line
  ansible.builtin.shell:
    cmd: |
      set -euo pipefail
      file=/boot/firmware/cmdline.txt
      mode=$VIDEO_MODE
      if [[ -z $mode && $ENABLE_ONLY != True ]]; then
        mode=$(node "$AUDIO_SRC/screen-mode.ts" 2> /dev/null || true)
      fi
      [[ $mode =~ ^[0-9]+x[0-9]+@[0-9]+$ ]] || mode=
      # The file may end without a newline (an image's own, or one a package rewrote), which read reports as a failure.
      read -r -a words < "$file" || [[ -n ${words[*]-} ]]
      new=()
      for word in "${words[@]}"; do
        if [[ $word == console=tty1 ]]; then
          word=console=tty3
        # The kiosk has no boot splash; installing Plymouth adds these.
        elif [[ $word == splash || $word == plymouth.* ]]; then
          continue
        elif [[ -n $mode && $word == video=HDMI-A-[12]:* && $word != "${word%%:*}:$mode" ]]; then
          continue
        fi
        new+=("$word")
      done
      # The parameters are one a line.
      while read -r param; do
        [[ -z $param || " ${new[*]} " == *" $param "* ]] || new+=("$param")
      done <<< "$PARAMS"
      for output in HDMI-A-1 HDMI-A-2; do
        [[ " ${new[*]}" == *" video=$output:"* ]] || new+=("video=$output:${mode:-$FALLBACK}")
      done
      if [[ "${new[*]}" != "${words[*]}" ]]; then
        printf '%s\n' "${new[*]}" > "$file"
        echo "${new[*]}"
      fi
    executable: /bin/bash
  environment:
    VIDEO_MODE: '{{ kiosk_video_mode }}'
    FALLBACK: '{{ kiosk_video_mode_fallback }}'
    PARAMS: "{{ kiosk_cmdline_params | join('\n') }}"
    AUDIO_SRC: '{{ kiosk_audio_src }}'
    ENABLE_ONLY: '{{ kiosk_enable_only | bool }}'
  register: kiosk_cmdline
  changed_when: kiosk_cmdline.stdout | length > 0

# disable_splash hides the firmware's rainbow screen. The Pi 5 would boot a kernel with 16 KB memory pages; kernel8.img
# is the 4 KB-page kernel the Pi 4 already uses, which Widevine's module is built for.
- name: full | system | Configure the boot firmware
  ansible.builtin.blockinfile:
    path: /boot/firmware/config.txt
    marker: '# {mark} THE MAX MIX KIOSK'
    block: |
      disable_splash=1

      [pi5]
      kernel=kernel8.img

      [all]

# The default locale, the settings for unattended upgrades, and the setup hotspot (pi/kiosk-audio/hotspot.ts):
# NetworkManager's own DHCP and DNS for it answer every name with the kiosk (50-kiosk-captive.conf), and the service may
# serve its page on port 80. And the touch screen's rotation (kiosk_screen_rotation): libinput reads the matrix from
# udev when Cage opens the touch screen, DSI or USB, and turns every touch by it, as kiosk-display turns the picture.
# And the backlight of a panel that has one (DSI): the kernel lets only root write its brightness, so a udev rule gives
# it to the video group, which the kiosk user is in, for the kiosk-audio service (pi/kiosk-audio/backlight.ts).
# In one step, as a module run costs seconds on a Pi.
- name: full | system | Install the locale, unattended upgrade, setup hotspot, touch rotation and backlight settings
  ansible.builtin.command:
    argv: [node, '{{ kiosk_install_files }}']
    stdin: '{{ kiosk_system_files | to_json }}'
  vars:
    kiosk_system_files:
      - path: /etc/default/locale
        mode: '0644'
        content: |
          LANG={{ kiosk_locale }}
      - path: /etc/apt/apt.conf.d/20auto-upgrades
        mode: '0644'
        content: "{{ lookup('ansible.builtin.file', '20auto-upgrades', rstrip=false) }}"
      - path: /etc/apt/apt.conf.d/52kiosk-unattended-upgrades
        mode: '0644'
        content: "{{ lookup('ansible.builtin.file', '52kiosk-unattended-upgrades', rstrip=false) }}"
      - path: /etc/NetworkManager/dnsmasq-shared.d/50-kiosk-captive.conf
        mode: '0644'
        content: "{{ lookup('ansible.builtin.file', '50-kiosk-captive.conf', rstrip=false) }}"
      - path: /etc/sysctl.d/50-kiosk-unprivileged-ports.conf
        mode: '0644'
        content: "{{ lookup('ansible.builtin.file', '50-kiosk-unprivileged-ports.conf', rstrip=false) }}"
      - path: /etc/udev/rules.d/90-kiosk-touch-rotation.rules
        mode: '0644'
        content: |
          ACTION!="remove", SUBSYSTEM=="input", ENV{ID_INPUT_TOUCHSCREEN}=="1", ENV{LIBINPUT_CALIBRATION_MATRIX}="{{ kiosk_touch_matrices[kiosk_screen_rotation | int] }}"
      - path: /etc/udev/rules.d/90-kiosk-backlight.rules
        mode: '0644'
        content: |
          ACTION!="remove", SUBSYSTEM=="backlight", RUN+="/bin/chgrp video /sys/class/backlight/%k/brightness", RUN+="/bin/chmod g+w /sys/class/backlight/%k/brightness"
  register: kiosk_system_files_installed
  changed_when: kiosk_system_files_installed.stdout | length > 0

# These run no module, so they cost nothing: they only pass each change on to its handlers.
- name: full | system | Apply the touch rotation
  ansible.builtin.debug:
    msg: The touch rotation changed.
  when: "'/etc/udev/rules.d/90-kiosk-touch-rotation.rules' in kiosk_system_files_installed.stdout_lines"
  changed_when: true
  notify:
    - Apply the udev rules
    - Ask for a kiosk restart

- name: full | system | Let the kiosk set the backlight
  ansible.builtin.debug:
    msg: The backlight's rule changed.
  when: "'/etc/udev/rules.d/90-kiosk-backlight.rules' in kiosk_system_files_installed.stdout_lines"
  changed_when: true
  notify: Apply the udev rules

# Runs no module, so it costs nothing: it only passes the change on to the handler.
- name: full | system | Apply the port setting
  ansible.builtin.debug:
    msg: The port setting changed.
  when: "'/etc/sysctl.d/50-kiosk-unprivileged-ports.conf' in kiosk_system_files_installed.stdout_lines"
  changed_when: true
  notify: Apply sysctl settings
