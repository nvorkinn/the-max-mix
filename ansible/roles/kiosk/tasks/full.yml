---
# Everything the playbook installs and configures, in order: directories, packages, system settings, the kiosk user, the kiosk itself,
# then updates. Run by main.yml only when the files it installs have changed. Every task is idempotent. Services are only
# enabled when kiosk_enable_only is true; nothing restarts the running kiosk (see handlers).

# Directories ---------------------------------------------------------------------------------------------------------
# One program makes all of them: a module run costs about a second on a Pi, and there are over twenty directories.
# `install -d` creates what is missing and sets the owner and mode of what exists, so it can run every time.
- name: full | Create the directories
  ansible.builtin.command:
    argv: "{{ ['install', '-d', '-m', '0755', '-o', 'root', '-g', 'root'] + kiosk_directories }}"
  vars:
    kiosk_directories:
      - /etc/apt/keyrings
      - /etc/chromium/policies/managed
      - /etc/NetworkManager/dnsmasq-shared.d
      - /etc/systemd/journald.conf.d
      - /etc/the-max-mix
      - /etc/pipewire
      - /etc/pipewire/pipewire.conf.d
      - /etc/plymouth
      - /etc/systemd/system
      - /etc/systemd/user
      - /etc/systemd/user/default.target.wants
      - /etc/tmpfiles.d
      - /opt/the-max-mix
      - '{{ kiosk_audio_dir }}'
      - '{{ kiosk_keyboard_dir }}'
      - '{{ kiosk_keyboard_dir }}/src'
      - '{{ kiosk_keyboard_dir }}/extension'
      - /usr/share/icons/blank
      - /usr/share/icons/blank/cursors
      - /usr/share/kiosk-cursors
      - /usr/share/plymouth/themes/the-max-mix
      - /var/lib/the-max-mix
  changed_when: false

# Packages ------------------------------------------------------------------------------------------------------------
# Installing packages is slow on a Pi even when nothing is missing (apt's cache is loaded from Python), and so are the
# key and archive checks. They are done again only when what they depend on changed: a stamp records the packages and
# the other archives (kiosk_packages_id) as last installed. The stamp is written after a successful install only, so a
# failed run tries again. A package removed by hand is not put back until the list changes; the nightly
# unattended-upgrades run keeps what is installed up to date.
- name: full | Read what the package step last installed
  ansible.builtin.set_fact:
    kiosk_packages_done: >-
      {{ (lookup('ansible.builtin.file', kiosk_packages_stamp, errors='ignore') | default('', true)) | string | trim }}

- name: full | Install the packages and the other archives' own
  when: kiosk_packages_id != kiosk_packages_done
  block:
    - name: full | Install the packages
      ansible.builtin.apt:
        name: '{{ kiosk_all_packages }}'
        state: present
        install_recommends: false
        update_cache: true
        cache_valid_time: 3600
        lock_timeout: 300

    # Node.js and Tailscale come from their own archives (kiosk_apt_sources), each with its pinned signing key.
    - name: full | Install the other archives' signing keys
      ansible.builtin.get_url:
        url: '{{ item.key_url }}'
        dest: '{{ item.key }}'
        checksum: 'sha256:{{ item.key_sha256 }}'
        owner: root
        group: root
        mode: '0644'
      loop: '{{ kiosk_apt_sources }}'
      loop_control:
        label: '{{ item.name }}'
      register: kiosk_apt_keys

    - name: full | Add the other archives
      ansible.builtin.copy:
        content: |
          Types: deb
          URIs: {{ item.uris }}
          Suites: {{ item.suite }}
          Components: main
          Signed-By: {{ item.key }}
        dest: '/etc/apt/sources.list.d/{{ item.name }}.sources'
        owner: root
        group: root
        mode: '0644'
      loop: '{{ kiosk_apt_sources }}'
      loop_control:
        label: '{{ item.name }}'
      register: kiosk_apt_lists

    - name: full | Install the other archives' packages
      ansible.builtin.apt:
        name: "{{ kiosk_apt_sources | map(attribute='package') }}"
        state: present
        update_cache: '{{ kiosk_apt_keys is changed or kiosk_apt_lists is changed }}'
        lock_timeout: 300

    - name: full | Record what was installed
      ansible.builtin.copy:
        content: '{{ kiosk_packages_id }}'
        dest: '{{ kiosk_packages_stamp }}'
        owner: root
        group: root
        mode: '0644'

# System settings -----------------------------------------------------------------------------------------------------
- name: full | Enable the locale
  ansible.builtin.lineinfile:
    path: /etc/locale.gen
    regexp: '^#?\s*{{ kiosk_locale | regex_escape }}\s+UTF-8'
    line: '{{ kiosk_locale }} UTF-8'
  notify: Generate the locale

- name: full | Set the default locale
  ansible.builtin.copy:
    content: |
      LANG={{ kiosk_locale }}
    dest: /etc/default/locale
    owner: root
    group: root
    mode: '0644'

# Debian's sudo and some tools look the host name up; Raspberry Pi OS's cloud-init does not add it to /etc/hosts.
- name: full | Resolve the host name locally
  ansible.builtin.lineinfile:
    path: /etc/hosts
    regexp: '^127\.0\.1\.1\s'
    line: '127.0.1.1 {{ kiosk_hostname }}'
    # A container's /etc/hosts (the playbook test) is a bind mount, which cannot be replaced by a rename.
    unsafe_writes: true

- name: full | Set the time zone
  ansible.builtin.file:
    src: '/usr/share/zoneinfo/{{ kiosk_timezone }}'
    dest: /etc/localtime
    state: link
    force: true

# Boot: console on tty3 and a quiet splash, the Wi-Fi country, the screen mode. cmdline.txt is a single line. The params
# are appended only if missing; [ \t]*$ (not \s*$) keeps the final newline.
- name: full | Move the console to tty3
  ansible.builtin.replace:
    path: /boot/firmware/cmdline.txt
    regexp: '\bconsole=tty1\b'
    replace: console=tty3

- name: full | Add the kernel command line parameters
  ansible.builtin.replace:
    path: /boot/firmware/cmdline.txt
    regexp: '^(?!.*(?:^|\s){{ item | regex_escape }}(?:\s|$))(.*?)[ \t]*$'
    replace: '\1 {{ item }}'
  loop: '{{ kiosk_cmdline_params }}'

# The screen mode (kiosk_video_mode in defaults/main.yml). Not read in a container, which has no screen of the Pi's.
- name: full | Read the screen's own mode
  ansible.builtin.command:
    argv:
      - node
      - '{{ kiosk_audio_src }}/screen-mode.ts'
  register: kiosk_screen_mode_read
  changed_when: false
  failed_when: false
  when: not kiosk_video_mode and not kiosk_enable_only

- name: full | Work out the screen mode
  ansible.builtin.set_fact:
    kiosk_screen_mode: >-
      {{ kiosk_video_mode or (kiosk_screen_mode_read.stdout | default('') | trim
        | regex_search('^[0-9]+x[0-9]+@[0-9]+$') | default('', true)) }}

# Only once the mode is known: without a screen to read it from, the mode already set stays.
- name: full | Remove another screen mode from the kernel command line
  ansible.builtin.replace:
    path: /boot/firmware/cmdline.txt
    regexp: '[ \t]+video=HDMI-A-{{ item }}:(?!{{ kiosk_screen_mode | regex_escape }}(?:\s|$))\S*'
    replace: ''
  loop: [1, 2]
  when: kiosk_screen_mode | length > 0

- name: full | Add the screen mode to the kernel command line
  ansible.builtin.replace:
    path: /boot/firmware/cmdline.txt
    regexp: '^(?!.*(?:^|\s)video=HDMI-A-{{ item }}:)(.*?)[ \t]*$'
    replace: '\1 video=HDMI-A-{{ item }}:{{ kiosk_screen_mode or kiosk_video_mode_fallback }}'
  loop: [1, 2]

# disable_splash hides the firmware's rainbow screen. The Pi 5 would boot a kernel with 16 KB memory pages; kernel8.img
# is the 4 KB-page kernel the Pi 4 already uses, which Widevine's module is built for.
- name: full | Configure the boot firmware
  ansible.builtin.blockinfile:
    path: /boot/firmware/config.txt
    marker: '# {mark} THE MAX MIX KIOSK'
    block: |
      disable_splash=1

      [pi5]
      kernel=kernel8.img

      [all]

# The setup hotspot (pi/kiosk-audio/hotspot.ts): NetworkManager's own DHCP and DNS for it answer every name with the kiosk
# (50-kiosk-captive.conf), and the service may serve its page on port 80.
- name: full | Install the settings for unattended upgrades and the setup hotspot's DNS
  ansible.builtin.copy:
    src: '{{ item.src }}'
    dest: '{{ item.dest }}/{{ item.src }}'
    owner: root
    group: root
    mode: '0644'
  loop:
    - { src: 20auto-upgrades, dest: /etc/apt/apt.conf.d }
    - { src: 52kiosk-unattended-upgrades, dest: /etc/apt/apt.conf.d }
    - { src: 50-kiosk-captive.conf, dest: /etc/NetworkManager/dnsmasq-shared.d }
  loop_control:
    label: '{{ item.src }}'

- name: full | Let the kiosk service serve the hotspot's page on port 80
  ansible.builtin.copy:
    src: 50-kiosk-unprivileged-ports.conf
    dest: /etc/sysctl.d/50-kiosk-unprivileged-ports.conf
    owner: root
    group: root
    mode: '0644'
  notify: Apply sysctl settings

- name: full | Make NetworkManager's connectivity check reach the internet
  ansible.builtin.copy:
    src: 20-connectivity.conf
    dest: /etc/NetworkManager/conf.d/20-connectivity.conf
    owner: root
    group: root
    mode: '0644'
  notify: Reload NetworkManager

# The kiosk user ------------------------------------------------------------------------------------------------------
- name: full | Make sure the kiosk user's groups exist
  ansible.builtin.group:
    name: '{{ item }}'
    system: true
  loop: '{{ kiosk_groups }}'

# Locked password and only the groups the kiosk needs, so nothing can log in as it and nothing can use sudo, whatever
# created the user.
- name: full | Set up the kiosk user
  ansible.builtin.user:
    name: '{{ kiosk_user }}'
    comment: THE MAX MIX kiosk
    shell: /bin/bash
    password: '*'
    groups: '{{ kiosk_groups }}'
    append: false
    create_home: true

# Maintenance over SSH ------------------------------------------------------------------------------------------------
# The admin account: no password ('*' cannot match one, but unlike '!' it does not lock out SSH keys), sudo without one,
# and the GitHub account's public keys as its only way in.
- name: full | Set up the admin user
  ansible.builtin.user:
    name: '{{ kiosk_admin_user }}'
    comment: THE MAX MIX admin
    shell: /bin/bash
    password: '*'
    groups: [sudo]
    append: true
    create_home: true

- name: full | Let the admin user use sudo without a password
  ansible.builtin.copy:
    content: |
      {{ kiosk_admin_user }} ALL=(ALL:ALL) NOPASSWD: ALL
    dest: /etc/sudoers.d/50-kiosk-admin
    owner: root
    group: root
    mode: '0440'
    validate: /usr/sbin/visudo -cf %s

# kiosk-ssh-keys writes the keys only where this exists.
- name: full | Create the admin user's SSH directory
  ansible.builtin.file:
    path: '/home/{{ kiosk_admin_user }}/.ssh'
    state: directory
    owner: '{{ kiosk_admin_user }}'
    group: '{{ kiosk_admin_user }}'
    mode: '0700'

# The keys themselves come from GitHub (kiosk_admin_github_user): kiosk-ssh-keys.timer fetches them soon after every boot
# and then regularly, so a key removed there stops working without waiting for a release.
# sshd uses the first value it reads and Debian's sshd_config includes sshd_config.d first, so these settings win.
- name: full | Allow SSH for the admin user, by key only
  ansible.builtin.copy:
    content: |
      # Installed by the kiosk playbook (ansible/roles/kiosk).
      PermitRootLogin no
      PasswordAuthentication no
      KbdInteractiveAuthentication no
      AuthenticationMethods publickey
      AllowUsers {{ kiosk_admin_user }}
    dest: /etc/ssh/sshd_config.d/10-kiosk.conf
    owner: root
    group: root
    mode: '0644'
  register: kiosk_sshd_config

- name: full | Turn SSH on or off
  ansible.builtin.systemd_service:
    name: ssh.service
    enabled: '{{ kiosk_ssh_enabled | bool }}'
    state: >-
      {{ omit if kiosk_enable_only else ('stopped' if not kiosk_ssh_enabled | bool
      else ('restarted' if kiosk_sshd_config is changed else 'started')) }}

# Tailscale: tailscaled runs from boot. It joins the tailnet only after a one-time `sudo tailscale up` by hand (see
# pi/cloud-init/README.md), so no key is in the repository; the login lives in /var/lib/tailscale. SSH
# then goes through sshd as above, over the tailnet address.
- name: full | Start Tailscale at boot
  ansible.builtin.systemd_service:
    name: tailscaled.service
    enabled: true
    state: "{{ omit if kiosk_enable_only else 'started' }}"
  when: kiosk_tailscale_enabled | bool

# The kiosk -----------------------------------------------------------------------------------------------------------
# Raspberry Pi OS keeps the journal in memory, so every log is lost at a reboot, including the one that shows why a shutdown
# was slow. This keeps it on disk, capped so that it does not wear the SD card or fill it.
- name: full | Keep the journal across reboots
  ansible.builtin.template:
    src: kiosk-journald.conf.j2
    dest: /etc/systemd/journald.conf.d/kiosk.conf
    owner: root
    group: root
    mode: '0644'
  notify: Apply the journal settings

- name: full | Install the kiosk programs
  ansible.builtin.copy:
    src: '{{ item.src }}'
    dest: '{{ item.dest }}'
    owner: root
    group: root
    mode: '{{ item.mode }}'
  loop:
    - { src: bin/kiosk-session, dest: /usr/local/bin/kiosk-session, mode: '0755' }
    - { src: bin/kiosk-display, dest: /usr/local/bin/kiosk-display, mode: '0755' }
    - { src: bin/kiosk-pull, dest: /usr/local/sbin/kiosk-pull, mode: '0755' }
    - { src: bin/kiosk-app-switch, dest: /usr/local/sbin/kiosk-app-switch, mode: '0755' }
    - { src: bin/kiosk-status, dest: /usr/local/sbin/kiosk-status, mode: '0755' }
    - { src: bin/kiosk-ssh-keys, dest: /usr/local/sbin/kiosk-ssh-keys, mode: '0755' }
  loop_control:
    label: '{{ item.dest }}'
  notify: Ask for a kiosk restart

# The card's Wi-Fi is for the first boot only: cloud-init has made it a netplan file by now, which keeps the network,
# and the app's Wi-Fi screen sets up any other. So the card's copies go, with the setup user-data, and cloud-init is
# turned off so that it never applies them again.
- name: full | Remove the card's first-boot setup
  ansible.builtin.file:
    path: '{{ item }}'
    state: absent
  loop:
    - /boot/firmware/network-config
    - /boot/firmware/user-data

- name: full | Make cloud-init's settings folder
  ansible.builtin.file:
    path: /etc/cloud
    state: directory
    owner: root
    group: root
    mode: '0755'

- name: full | Turn cloud-init off
  ansible.builtin.copy:
    content: ''
    dest: /etc/cloud/cloud-init.disabled
    owner: root
    group: root
    mode: '0644'

# A small Chromium extension draws a button back to the app on every page outside the app, as the kiosk has no back
# button, and clears Spotify's own sign-in when the app signs out, so it gets the app's origin. The on-screen keyboard
# beside it (keyboard.ts) is bundled into the app, so it is not installed. Spotify's sign-in pages get no keyboard:
# people sign in with the QR code that Spotify's "Continue with Apple" shows.
# Chromium cannot load TypeScript, so the build strips the types (Node, no packages) and prints "changed" only when it
# wrote a file.
- name: full | Install the kiosk extension's source
  ansible.builtin.copy:
    src: '{{ item }}'
    dest: '{{ kiosk_keyboard_dir }}/src/{{ item | basename }}'
    owner: root
    group: root
    mode: '0644'
  loop: >-
    {{ query('ansible.builtin.fileglob', kiosk_keyboard_src ~ '/*.ts', kiosk_keyboard_src ~ '/manifest.json')
      | reject('search', kiosk_not_installed) | reject('search', '/keyboard\\.ts$') | sort }}
  loop_control:
    label: '{{ item | basename }}'

- name: full | Build the kiosk extension
  ansible.builtin.command:
    argv:
      - node
      - '{{ kiosk_keyboard_dir }}/src/build.ts'
      - '{{ kiosk_keyboard_dir }}/src'
      - '{{ kiosk_keyboard_dir }}/extension'
      - '{{ kiosk_app_origin }}'
  register: kiosk_keyboard_build
  changed_when: "'changed' in kiosk_keyboard_build.stdout"
  notify: Ask for a kiosk restart

# Releases before the keyboard left Spotify's sign-in pages installed its content script, and before the Wi-Fi setup
# moved into the app, the keyboard the Wi-Fi page loaded.
- name: full | Remove the extension's keyboard
  ansible.builtin.file:
    path: '{{ item }}'
    state: absent
  loop:
    - '{{ kiosk_keyboard_dir }}/src/loader.ts'
    - '{{ kiosk_keyboard_dir }}/extension/loader.js'
    - '{{ kiosk_keyboard_dir }}/src/keyboard.ts'
    - '{{ kiosk_keyboard_dir }}/extension/keyboard.js'

# AirPlay: PipeWire makes a sink for each speaker Avahi finds; the app asks the kiosk-audio service (127.0.0.1) to route
# the browser's audio to the chosen ones, and the same user unit keeps it there.
# Every source file of the service, so a new one needs no mention here (the tests and their fixtures stay behind).
- name: full | Install the audio routing
  ansible.builtin.copy:
    src: '{{ item }}'
    dest: '{{ kiosk_audio_dir }}/{{ item | basename }}'
    owner: root
    group: root
    mode: '0644'
  loop: >-
    {{ query('ansible.builtin.fileglob', kiosk_audio_src ~ '/*.ts') | reject('search', kiosk_not_installed) | sort }}
  loop_control:
    label: '{{ item | basename }}'
  notify: Ask for a kiosk restart

# ws, the one npm package, for the update stream (the WebSocket). Installed from the lockfile, so it is the version that
# was reviewed; --ignore-scripts because nothing it needs has to build. Only when the lockfile is not the one installed.
- name: full | Install the audio routing's package list
  ansible.builtin.copy:
    src: kiosk-audio/{{ item }}
    dest: '{{ kiosk_audio_dir }}/{{ item }}'
    owner: root
    group: root
    mode: '0644'
  loop:
    - package.json
    - package-lock.json
  notify: Ask for a kiosk restart

- name: full | Install the audio routing's npm packages
  when: >-
    kiosk_audio_lock_id
    != (lookup('ansible.builtin.file', kiosk_audio_deps_stamp, errors='ignore') | default('', true) | string | trim)
  vars:
    kiosk_audio_lock_id: "{{ lookup('ansible.builtin.file', 'kiosk-audio/package-lock.json') | hash('sha1') }}"
  block:
    - name: full | Run npm ci
      ansible.builtin.command:
        cmd: npm ci --omit=dev --ignore-scripts --no-audit --no-fund
        chdir: '{{ kiosk_audio_dir }}'
      changed_when: true
      notify: Ask for a kiosk restart

    - name: full | Record which lockfile was installed
      ansible.builtin.copy:
        content: '{{ kiosk_audio_lock_id }}'
        dest: '{{ kiosk_audio_deps_stamp }}'
        owner: root
        group: root
        mode: '0644'

- name: full | Install the AirPlay settings, the audio routing unit and the Chromium policy
  ansible.builtin.template:
    src: '{{ item.src }}'
    dest: '{{ item.dest }}'
    owner: root
    group: root
    mode: '0644'
  loop:
    - { src: 50-kiosk-raop.conf.j2, dest: /etc/pipewire/pipewire.conf.d/50-kiosk-raop.conf }
    - { src: kiosk-audio.service.j2, dest: /etc/systemd/user/kiosk-audio.service }
    - { src: kiosk-policy.json.j2, dest: /etc/chromium/policies/managed/kiosk.json }
  loop_control:
    label: '{{ item.dest }}'
  notify: Ask for a kiosk restart

# What `systemctl --global enable` does, as a link, so it also works without a running systemd (kiosk_enable_only).
- name: full | Start the audio routing in the kiosk user's session
  ansible.builtin.file:
    src: ../kiosk-audio.service
    dest: /etc/systemd/user/default.target.wants/kiosk-audio.service
    state: link
    force: true
    follow: false
  notify: Ask for a kiosk restart

# polkitd reads rules.d itself. The kiosk user manages Wi-Fi connections without sudo (networkmanager), and may update and
# restart the kiosk and reboot the Pi (power): the Update now, Restart kiosk and Reboot Pi buttons in the app's settings.
- name: full | Install the kiosk user's polkit rules
  ansible.builtin.template:
    src: '{{ item }}.j2'
    dest: '/etc/polkit-1/rules.d/{{ item }}'
    owner: root
    group: root
    mode: '0644'
  loop:
    - 50-kiosk-networkmanager.rules
    - 50-kiosk-power.rules

- name: full | Create /run/kiosk at every boot
  ansible.builtin.template:
    src: kiosk-tmpfiles.conf.j2
    dest: /etc/tmpfiles.d/kiosk.conf
    owner: root
    group: root
    mode: '0644'
  notify: Create the run directory

- name: full | Install the Plymouth theme
  ansible.builtin.copy:
    src: plymouth/{{ item }}
    dest: /usr/share/plymouth/themes/the-max-mix/{{ item }}
    owner: root
    group: root
    mode: '0644'
  loop:
    - the-max-mix.plymouth
    - the-max-mix.script
  notify: Update the initramfs

- name: full | Select the Plymouth theme
  ansible.builtin.copy:
    src: plymouthd.conf
    dest: /etc/plymouth/plymouthd.conf
    owner: root
    group: root
    mode: '0644'
  notify: Update the initramfs

# A cursor theme of one transparent pixel (Cage loads it as its default theme, see below), for touch screens that look like a mouse.
- name: full | Install the blank cursor theme
  ansible.builtin.copy:
    src: icons/{{ item.src }}
    dest: /usr/share/icons/blank/{{ item.dest }}
    owner: root
    group: root
    mode: '0644'
  loop:
    - { src: index.theme, dest: index.theme }
    - { src: left_ptr, dest: cursors/left_ptr }
  loop_control:
    label: '{{ item.dest }}'

# One program makes all the links, for the same reason as the directories above. `ln -sfn` replaces a link that exists.
- name: full | Point the cursor names at the blank cursor
  ansible.builtin.command:
    argv: '{{ [''bash'', ''-c'', ''for name in "$@"; do ln -sfn left_ptr "$name"; done'', ''bash''] + kiosk_cursor_names }}'
    chdir: /usr/share/icons/blank/cursors
  vars:
    kiosk_cursor_names:
      - default
      - arrow
      - text
      - xterm
      - pointer
      - hand1
      - hand2
      - grab
      - grabbing
      - crosshair
      - wait
      - watch
      - progress
      - not-allowed
  changed_when: false

# Cage ignores XCURSOR_THEME: wlroots always loads the theme called "default", which is Adwaita on Pi OS. kiosk.service
# puts this folder first in Cage's XCURSOR_PATH, so there "default" is the blank theme. The rest of the system keeps its own.
- name: full | Make the blank cursor the kiosk's default theme
  ansible.builtin.file:
    src: /usr/share/icons/blank
    dest: /usr/share/kiosk-cursors/default
    state: link
    owner: root
    group: root

# The kiosk takes the display on tty7 and tty1 shows nothing.
- name: full | Mask the login prompt on tty1
  ansible.builtin.file:
    src: /dev/null
    dest: /etc/systemd/system/getty@tty1.service
    state: link
  notify: Reload systemd

# Updates -------------------------------------------------------------------------------------------------------------
- name: full | Install the update and SSH key units
  ansible.builtin.template:
    src: '{{ item }}.j2'
    dest: '/etc/systemd/system/{{ item }}'
    owner: root
    group: root
    mode: '0644'
  loop: >-
    {{ ['kiosk-pull.service', 'kiosk-pull.timer', 'kiosk-restart.service', 'kiosk-restart.timer',
        'kiosk-widevine.path', 'kiosk-widevine.service']
      + (['kiosk-ssh-keys.service', 'kiosk-ssh-keys.timer'] if kiosk_admin_github_user else []) }}
  notify: Reload systemd

# The units must be known to systemd before they are enabled and started.
- name: full | Apply the pending changes
  ansible.builtin.meta: flush_handlers

# Started by the next boot, not here: nothing starts or restarts the kiosk. Bluetooth pairs phones and hears who is home.
- name: full | Enable the kiosk and Bluetooth
  ansible.builtin.systemd_service:
    name: '{{ item }}'
    enabled: true
  loop:
    - kiosk.service
    - bluetooth.service

# Avahi finds the AirPlay speakers.
- name: full | Enable and start Avahi and the timers
  ansible.builtin.systemd_service:
    name: '{{ item }}'
    enabled: true
    state: "{{ 'started' if not kiosk_enable_only else omit }}"
  loop: >-
    {{ ['avahi-daemon.service', 'kiosk-pull.timer', 'kiosk-restart.timer', 'kiosk-widevine.path']
      + (['kiosk-ssh-keys.timer'] if kiosk_admin_github_user else []) }}
