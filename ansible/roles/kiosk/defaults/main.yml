---
# True where nothing may be started: the playbook test in a container (ansible/tests/image-build.sh) passes
# -e kiosk_enable_only=true. Services are then only enabled, never started or restarted, and nothing that needs a running
# systemd, D-Bus or NetworkManager is run.
kiosk_enable_only: false

# The account Cage and Chromium run as. cloud-init creates it on the first boot (pi/cloud-init/user-data).
kiosk_user: kiosk
# The only groups the kiosk user is in (the user has no sudo and no password). systemd-journal lets the kiosk-audio
# service read the journal of the pull and the restart, which it streams to the app's update console. bluetooth lets
# that service pair and connect Bluetooth speakers (BlueZ's D-Bus policy), and WirePlumber play to them.
kiosk_groups: [audio, bluetooth, input, netdev, render, systemd-journal, video]
# The origin of the hosted app and the address the kiosk opens (?kiosk=1 turns on the app's kiosk-only settings,
# ?pi_ref=&pi_commit= name the release (or other ref) and commit this playbook ran from, which the app's settings show).
# Register the redirect URI of this address in the Spotify dashboard.
kiosk_app_origin: https://the-max-mix.countdown.build
kiosk_url: >-
  {{ kiosk_app_origin }}/?kiosk=1
  {{- ('&pi_ref=' ~ (kiosk_version | urlencode) ~ '&pi_commit=' ~ kiosk_commit) if kiosk_commit and kiosk_version else '' }}
# What a release's Pi bundle says about itself (release.json next to ansible/, written by the Release workflow): its tag,
# commit and the tree ids tasks/main.yml compares. Empty in a Git checkout (a branch pulled with ansible-pull, or a hand
# run), where git answers the same questions instead.
kiosk_release_info: >-
  {{ lookup('ansible.builtin.file', playbook_dir ~ '/../release.json', errors='ignore') | default('{}', true) | from_json }}
# The commit this playbook runs from: the bundle's, or the Git checkout's. Empty without either. Because the
# commit is in kiosk_url, every new release (or commit on a pinned branch) changes kiosk.service and so restarts the
# kiosk at kiosk_restart_time, after which the settings show the new version.
kiosk_commit: >-
  {{ (kiosk_release_info.commit | default('') | string)[:7]
    if kiosk_release_info.commit is defined else
    (lookup('ansible.builtin.pipe',
    'git -C ' ~ (playbook_dir | quote) ~ ' rev-parse --short=7 HEAD 2> /dev/null || true')
    | regex_search('^[0-9a-f]{7,40}$') | default('', true)) }}
# What the settings call the running version: the bundle's release tag; in a Git checkout following releases
# (kiosk_pull_ref latest), the newest release tag at the checkout (two tags can sit on one commit), otherwise
# kiosk_pull_ref itself. Empty when the checkout is not at a tag.
kiosk_version: >-
  {{ kiosk_release_info.tag
    if kiosk_release_info.tag is defined else
    (lookup('ansible.builtin.pipe',
    'git -C ' ~ (playbook_dir | quote) ~ ' tag --points-at HEAD --list "v*" --sort=-version:refname 2> /dev/null | head -n 1 || true')
    | regex_search('^v[0-9A-Za-z][0-9A-Za-z._-]*$') | default('', true))
    if kiosk_pull_ref == 'latest' else kiosk_pull_ref }}
# System settings.
# The name /etc/hosts gives 127.0.1.1: the Pi's own host name, which cloud-init set from pi/cloud-init/user-data, so a
# second kiosk renamed there (the-max-mix-2) resolves its own name. The playbook never changes the host name itself.
kiosk_hostname: "{{ lookup('ansible.builtin.file', '/proc/sys/kernel/hostname') | trim }}"
kiosk_locale: en_GB.UTF-8
kiosk_timezone: Europe/London
kiosk_wifi_country: GB
# The screen mode, forced on both HDMI ports (video= on the kernel command line) because the firmware sets none. Empty
# reads the screen's own mode from its EDID (pi/kiosk-audio/screen-mode.ts), such as 1280x800@60 for a 10.1 inch
# screen; when no screen sends one, the mode already set stays, or kiosk_video_mode_fallback on a first run. Set it
# (for example 1280x800@60 in /etc/the-max-mix/kiosk-vars.yml) only for a screen whose EDID is missing or wrong.
# Cage chooses the screen's preferred mode whatever this says, so it only sets the console's. A screen whose own mode
# the Pi 4 cannot send is corrected when the kiosk starts (screen-mode.ts --correct, in kiosk.service).
kiosk_video_mode: ''
# The 1024x600 HDMI screen (Waveshare 7 inch).
kiosk_video_mode_fallback: 1024x600@60
# Added to the kernel command line (/boot/firmware/cmdline.txt) if missing; console=tty1 becomes tty3. Quiet boot with
# the Plymouth splash, no logo or cursor, and the Wi-Fi regulatory domain. The screen mode is added separately.
kiosk_cmdline_params:
  - quiet
  - splash
  - plymouth.ignore-serial-consoles
  - logo.nologo
  - vt.global_cursor_default=0
  - loglevel=3
  - 'cfg80211.ieee80211_regdom={{ kiosk_wifi_country }}'
# SSH for maintenance, by key only and only for the admin account below. Set to false to turn SSH off.
kiosk_ssh_enabled: true
# The maintenance account. It has no password, so it can only log in over SSH with a key; it uses sudo without one.
kiosk_admin_user: admin
# The admin account's SSH keys are this GitHub account's public keys (https://github.com/<name>.keys). kiosk-ssh-keys.timer
# fetches them this long after boot and then this long after each fetch finished, whether or not a release came out, so a
# key added or removed on GitHub reaches the Pi within about the interval. Empty for no keys (and no timer).
kiosk_admin_github_user: nvorkinn
kiosk_admin_keys_boot_delay: 2min
kiosk_admin_keys_interval: 6h
# Tailscale, so the admin account can SSH in from anywhere once the Pi lives on someone else's network. The playbook only
# installs it; join your tailnet once by hand with `sudo tailscale up` (pi/cloud-init/README.md). Turning this off later
# leaves Tailscale installed: run `sudo tailscale logout` and `sudo apt purge tailscale` on the Pi.
kiosk_tailscale_enabled: true
# Where the playbook records which version of the files it installs (git's tree ids) it last applied completely; when they
# are unchanged the slow part is skipped (tasks/main.yml).
kiosk_applied_stamp: /var/lib/the-max-mix/applied.sha1
# Where the playbook records which packages and archives (kiosk_packages_id) it last installed, so that it skips that
# slow step when nothing changed.
kiosk_packages_stamp: /var/lib/the-max-mix/packages.sha1
kiosk_all_packages: '{{ (kiosk_ansible_packages + kiosk_packages + kiosk_rpi_packages) | unique }}'
kiosk_packages_id: "{{ [kiosk_all_packages, kiosk_apt_sources] | to_json | hash('sha1') }}"
# The journal is kept on disk (it is in memory by default, so a reboot loses it), up to this much of the SD card.
kiosk_journal_max_use: 64M
# Regenerate the initramfs when the Plymouth theme changes. Needs a kernel, so tests in a plain container turn it off.
kiosk_update_initramfs: true

# Screen sleep. The app decides when the screen may sleep (never while music plays, otherwise after the idle minutes chosen
# in its settings) and shows a black sleep screen. This many seconds later without a touch, swayidle turns the HDMI output
# off; the first touch turns it on again. 0 never turns it off.
kiosk_screen_off_after: 60

# Packages from the Raspberry Pi archive only (not in Debian). Tests in a plain Debian container set this to [].
kiosk_rpi_packages:
  - pi-bluetooth
  - rpi-chromium-mods
  - libwidevinecdm0
# Packages the playbook needs to run again with ansible-pull.
kiosk_ansible_packages:
  - ansible-core
  - ca-certificates
  - curl
  - git
  - python3-apt
kiosk_packages:
  # Display: Cage runs one app full screen on Wayland. kbd provides chvt, xkb-data the keyboard layouts.
  - cage
  - kbd
  # Screen sleep: swayidle notices when nobody touches the screen, wlr-randr turns the output off and on (kiosk-display).
  - swayidle
  - wlr-randr
  - xkb-data
  - fonts-dejavu-core
  - fonts-noto-color-emoji
  # Browser; libwidevinecdm0 (kiosk_rpi_packages) is the Widevine DRM module Spotify's player needs.
  - chromium
  # Maintenance over SSH (kiosk_ssh_enabled)
  - openssh-server
  - sudo
  # Boot splash
  - initramfs-tools
  - plymouth
  # Locale, time zone and NetworkManager (polkit lets the kiosk user manage connections)
  - locales
  - tzdata
  - network-manager
  # The DHCP and DNS NetworkManager runs for the setup hotspot (pi/kiosk-audio/hotspot.ts)
  - dnsmasq-base
  - polkitd
  # Bluetooth, for phones and speakers (libspa-0.2-bluetooth is PipeWire's A2DP support)
  - bluez
  - libspa-0.2-bluetooth
  - rfkill
  - pipewire
  - pipewire-pulse
  - wireplumber
  # AirPlay: PipeWire's RAOP modules find speakers over mDNS (Avahi); pw-dump and pw-link route the sound to them.
  - avahi-daemon
  - libpipewire-0.3-modules
  - pipewire-bin
  # Security updates
  - unattended-upgrades

# The on-screen keyboard for Spotify's sign-in pages and the button back to the app on every page outside it
# (pi/kiosk-keyboard): a Chromium extension in TypeScript. Its
# sources go to src/, and its build script (Node's own type stripper) writes the extension that kiosk-session loads
# into extension/.
kiosk_keyboard_src: '{{ playbook_dir }}/../pi/kiosk-keyboard'
kiosk_keyboard_dir: /opt/the-max-mix/kiosk-keyboard

# The kiosk-audio service (pi/kiosk-audio): a user unit that answers the app on 127.0.0.1 (speakers, routing, the update
# stream, restart, reboot, Wi-Fi, screen wake) and keeps the audio links in place. Its one npm package (ws, for the
# update stream) is installed from files/kiosk-audio/package-lock.json with npm ci; kiosk_audio_deps_stamp records which
# lockfile was installed.
kiosk_audio_src: '{{ playbook_dir }}/../pi/kiosk-audio'
# The source files of pi/kiosk-audio and pi/kiosk-keyboard that stay behind: the tests and what only they use.
kiosk_not_installed: '(\.test|/fixtures)\.ts$'
kiosk_audio_dir: /opt/the-max-mix/kiosk-audio
# The web app itself (Vite's build), which the kiosk-audio service serves on 127.0.0.1:7341 so it starts with no internet
# (pi/kiosk-audio/app-files.ts). A release's Pi bundle carries it in app/; a Pi following a branch has no build in its
# checkout, so kiosk-pull puts the latest release's app (with its release.json) in kiosk_branch_app_dir instead. Each
# release goes in releases/<commit>, `next` points at the one installed last, and kiosk-app-switch makes it `current`
# when the kiosk starts.
kiosk_app_dir: /opt/the-max-mix/app
kiosk_branch_app_dir: /var/lib/the-max-mix/branch-app
# The LAN port the Sonos speakers send their events to while the app follows them (pi/kiosk-audio/sonos-events.ts).
kiosk_sonos_events_port: 6329
kiosk_audio_deps_stamp: /var/lib/the-max-mix/kiosk-audio-deps.sha1
# PipeWire's AirPlay buffer. Shorter means play, pause and skip are heard sooner on the speakers; too short and a busy
# Wi-Fi network makes them drop out.
kiosk_raop_latency_ms: 500
# The audio routing is TypeScript that Node runs directly, which needs Node 22.18 or later; Debian trixie has 20, so
# Node comes from NodeSource's archive (the same major version as .nvmrc).
kiosk_nodejs_major: 24
# The archives besides Debian's and Raspberry Pi's, and the package each is there for. Every signing key is pinned by its
# checksum.
kiosk_apt_sources: >-
  {{ [kiosk_nodesource_source] + ([kiosk_tailscale_source] if kiosk_tailscale_enabled | bool else []) }}
kiosk_nodesource_source:
  name: nodesource
  package: nodejs
  uris: 'https://deb.nodesource.com/node_{{ kiosk_nodejs_major }}.x'
  suite: nodistro
  key: /etc/apt/keyrings/nodesource.asc
  key_url: https://deb.nodesource.com/gpgkey/nodesource-repo.gpg.key
  key_sha256: b42e0321dabdc24e892115da705cf061167eac12a317f23d329862d0aa0a271d
kiosk_tailscale_source:
  name: tailscale
  package: tailscale
  uris: https://pkgs.tailscale.com/stable/debian
  suite: trixie
  key: /usr/share/keyrings/tailscale-archive-keyring.gpg
  key_url: https://pkgs.tailscale.com/stable/debian/trixie.noarmor.gpg
  key_sha256: 3e03dacf222698c60b8e2f990b809ca1b3e104de127767864284e6c228f1fb39

# On-device updates: kiosk-pull.timer runs /usr/local/sbin/kiosk-pull against this repository and ref. "latest" follows
# the repository's latest GitHub release, installed from the Pi bundle the Release workflow uploads to it once the web
# app is deployed (a release without one is not ready yet); pi/cloud-init/user-data installs the same on the first boot.
# To roll every device back, mark an older release as Latest (run the Release workflow with its tag). A tag such as
# v1.12.0 pins a device to that release, and a branch (pulled with ansible-pull) is only for testing on your own Pi. The
# repository is public, so no credentials are needed.
kiosk_pull_repo: https://github.com/nvorkinn/the-max-mix.git
kiosk_pull_ref: latest
kiosk_pull_dir: /var/lib/the-max-mix/ansible-pull
# First run this long after boot, then again this long after each run finishes, plus up to the random delay. A run only
# downloads the release and applies the playbook when it is not the one already installed (--only-if-changed), and the playbook then applies
# its slow part only when the files it installs have changed (tasks/main.yml). The app's Update now
# button starts the same pull at once (through the kiosk-audio service), so the timer only catches what nobody asked for.
kiosk_pull_boot_delay: 3min
kiosk_pull_interval: 6h
kiosk_pull_random_delay: 10min
# A pull that changed kiosk files leaves this marker (in /run, so a reboot clears it); kiosk-restart.timer restarts the
# kiosk at this time of day if the marker is there.
kiosk_restart_time: '04:30'
kiosk_restart_marker: /run/kiosk/restart-needed
# Left once the kiosk restarted for its first Widevine download (kiosk-widevine.service); kiosk-handover removes it.
kiosk_widevine_marker: /var/lib/the-max-mix/widevine-loaded
