# Added by the THE MAX MIX image to the kiosk service that the Ansible playbook installs for the desktop user.
[Unit]
# The installed kiosk only starts after the first-boot setup has succeeded; until then the first-boot screen owns the display.
ConditionPathExists=/var/lib/the-max-mix/bootstrapped
Conflicts=the-max-mix-firstboot.service
After=the-max-mix-firstboot.service
