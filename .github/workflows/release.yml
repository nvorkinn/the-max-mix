name: Release

# Pushing a version tag (e.g. v1.2.3, or v1.2.3-rc.1 for a prerelease) builds the app and publishes the assembled
# tarball, its checksum and the standalone installer to a GitHub Release with generated notes. If the release already
# exists (creating one in the web UI also creates the tag, and a job can be re-run), the files are attached to it
# instead. Lint and tests are not repeated here: the Tests and Lint workflows already run them on pull requests and on main, so tag a commit on main.
# The tag is the only source of the version: package-release.sh stamps it into the packaged package.json files (the
# repository keeps a 0.0.0 placeholder). The tarball also gets a build provenance attestation: verify a download with
# `gh attestation verify <file> --repo nvorkinn/the-max-mix`.
on:
  push:
    tags: ['v[0-9]+.[0-9]+.[0-9]+*']

permissions:
  contents: read

jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      id-token: write
      attestations: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: |
            client/package-lock.json
            server/package-lock.json
      - run: npm --prefix client ci
      - run: npm --prefix server ci
      - run: npm run build
      - run: bash scripts/package-release.sh "$GITHUB_REF_NAME"
      - uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: release-out/*.tar.gz
      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: |
          files=(release-out/*.tar.gz release-out/*.sha256 scripts/install-kiosk.sh)
          if gh release view "$TAG" > /dev/null 2>&1; then
            # Creating a release in the web UI also creates the tag, so the release (with its notes) can exist before
            # this runs, and so can a re-run of this job. Attach the files to it instead of failing.
            gh release upload "$TAG" "${files[@]}" --clobber
          else
            flags=()
            if [[ $TAG == *-* ]]; then flags+=(--prerelease); fi
            gh release create "$TAG" "${files[@]}" --title "$TAG" --generate-notes --verify-tag "${flags[@]}"
          fi
