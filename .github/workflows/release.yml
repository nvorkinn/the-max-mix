name: Release

# Creating a release in the GitHub web UI also creates its version tag (e.g. v1.2.3, or v1.2.3-rc.1 for a prerelease);
# the tag push runs this, which builds the app and attaches the assembled tarball, its checksum and the standalone
# installer to that release. The release, its notes and its prerelease flag come from the web UI, so the job fails if
# there is no release for the tag; a failed job can be re-run. Lint and tests are not repeated here: the Tests and Lint
# workflows already run them on pull requests and on main, so release a commit on main. The tag is the only source of
# the version: package-release.sh stamps it into the packaged package.json files (the repository keeps a 0.0.0
# placeholder). The SPOTIFY_CLIENT_ID repository variable (not a secret) is baked into the packaged config template so
# the installer can set it on the Pi; the job fails early if the variable is missing. The tarball also gets a build provenance attestation: verify a download with
# `gh attestation verify <file> --repo nvorkinn/the-max-mix`. The container image (the Dockerfile) is built and pushed
# to ghcr.io/nvorkinn/the-max-mix once the tarball is attached, tagged with the version and, unless it is a prerelease,
# `latest`, which is what the dev/QA host pulls; it carries the same client ID and the same provenance attestation.
on:
  push:
    tags: ['v[0-9]+.[0-9]+.[0-9]+*']

permissions:
  contents: read

jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      id-token: write
      attestations: write
    steps:
      - name: Require the Spotify client ID
        env:
          SPOTIFY_CLIENT_ID: ${{ vars.SPOTIFY_CLIENT_ID }}
        run: |
          if [[ -z $SPOTIFY_CLIENT_ID ]]; then
            echo "::error::The SPOTIFY_CLIENT_ID repository variable is not set. Add it under Settings > Secrets and variables > Actions > Variables, then re-run this job."
            exit 1
          fi
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: |
            client/package-lock.json
            server/package-lock.json
      - run: npm --prefix client ci
      - run: npm --prefix server ci
      - run: npm run build
      - run: bash scripts/package-release.sh "$GITHUB_REF_NAME"
        env:
          # A repository variable (Settings > Secrets and variables > Actions > Variables), not a secret.
          SPOTIFY_CLIENT_ID: ${{ vars.SPOTIFY_CLIENT_ID }}
      - uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: release-out/*.tar.gz
      - name: Attach the files to the release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: |
          if ! gh release view "$TAG" > /dev/null 2>&1; then
            echo "::error::No release found for $TAG. Create the release in the GitHub web UI (it also creates the tag); this job attaches the files to it."
            exit 1
          fi
          gh release upload "$TAG" release-out/*.tar.gz release-out/*.sha256 scripts/install-kiosk.sh --clobber

  # The container image, for linux/arm64 (the dev/QA host is ARM) on an ARM runner, so nothing is emulated. It follows
  # the tarball: a release that failed to attach its files publishes no image either.
  image:
    needs: release
    runs-on: ubuntu-24.04-arm
    permissions:
      contents: read
      packages: write
      id-token: write
      attestations: write
    env:
      IMAGE: ghcr.io/${{ github.repository }}
      SPOTIFY_CLIENT_ID: ${{ vars.SPOTIFY_CLIENT_ID }}
    steps:
      - name: Work out the tags
        id: tags
        run: |
          [[ -n $SPOTIFY_CLIENT_ID ]] || { echo "::error::The SPOTIFY_CLIENT_ID repository variable is not set."; exit 1; }
          tags="$IMAGE:$GITHUB_REF_NAME"
          # A prerelease (v1.2.3-rc.1) is not what "latest" means.
          [[ $GITHUB_REF_NAME == *-* ]] || tags+=$'\n'"$IMAGE:latest"
          { echo 'value<<EOF'; echo "$tags"; echo EOF; } >> "$GITHUB_OUTPUT"
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Log in to GitHub Container Registry
        uses: docker/login-action@81c6f93d4bc991e510b342a00b419b3bb4efc5c6 # v4.7.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4
      - name: Build and push
        id: build
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7
        with:
          context: .
          push: true
          platforms: linux/arm64
          build-args: SPOTIFY_CLIENT_ID=${{ env.SPOTIFY_CLIENT_ID }}
          tags: ${{ steps.tags.outputs.value }}
          provenance: mode=max
          sbom: true
      # Verify with `gh attestation verify oci://ghcr.io/nvorkinn/the-max-mix:<tag> --repo nvorkinn/the-max-mix`.
      - uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-name: ${{ env.IMAGE }}
          subject-digest: ${{ steps.build.outputs.digest }}
          push-to-registry: true
