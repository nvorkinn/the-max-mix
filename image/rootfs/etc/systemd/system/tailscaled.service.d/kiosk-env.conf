# Tailscale runs unless /data/the-max-mix/kiosk.env says KIOSK_TAILSCALE=off. It joins the tailnet only after a one-time
# `sudo tailscale up` by hand, so no key is in the repository; the login lives on /data (image/persist.list).
[Service]
EnvironmentFile=-/data/the-max-mix/kiosk.env
ExecCondition=/bin/sh -c 'test "$${KIOSK_TAILSCALE:-on}" != off'
