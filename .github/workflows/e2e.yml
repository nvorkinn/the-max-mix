name: E2E

# Browser tests of the built app with Spotify faked, served by `vite preview`, using the Google Chrome that ships on
# ubuntu-latest, so no browser download is needed. tests.yml calls this on every pull request and push to main; it runs
# as part of that run, so all-checks.yml waits for it through Tests. Each test runs once and no test is traced, because
# tracing every test took a third or more of the run; dispatch this workflow on a branch (`gh workflow run e2e.yml --ref <branch>`)
# for a report with a trace of every test, in the run's playwright-report artifact.
on:
  workflow_call:
    inputs:
      trace:
        description: Record a trace of every test
        type: boolean
        default: false
  workflow_dispatch:
    inputs:
      trace:
        description: Record a trace of every test
        type: boolean
        default: true

permissions:
  contents: read

jobs:
  # The tests are split over three machines, a third each; the report job merges what they write.
  test:
    # Without a name of its own, the job would be listed with both matrix values, as "test (1, 3)".
    name: test (${{ matrix.shardIndex }})
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        # To change the number of shards, change both: the list of shards and their count.
        shardIndex: [1, 2, 3]
        shardTotal: [3]
    env:
      E2E_TRACE: ${{ inputs.trace && 'on' || '' }}
    steps:
      # The runner's disk is read in lazily, so Chrome's first start takes about ten seconds. Starting it once in the
      # background lets that happen while the dependencies install, instead of before the first test.
      - name: Warm up Chrome
        run: (google-chrome --headless --disable-gpu --dump-dom about:blank > /dev/null 2>&1 &)
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          # The countdown-api submodule: the browser tests answer the config route with its example configs.
          submodules: true
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
      # Only the packages that build and serve the app and run Playwright, a third of the full node_modules, in a
      # cache of their own. On a miss, scripts/e2e-package.ts trims package.json to those, and `npm install` (`npm ci`
      # refuses a package.json that differs from the lockfile) installs them at their locked versions.
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        id: modules
        with:
          path: node_modules
          key: node-modules-e2e-${{ runner.os }}-${{ hashFiles('.nvmrc', 'package-lock.json', 'scripts/e2e-package.ts') }}
      - if: steps.modules.outputs.cache-hit != 'true'
        run: |
          node scripts/e2e-package.ts
          npm install --ignore-scripts --no-audit --no-fund
      - run: npm run build
      - name: Run Playwright shard
        env:
          SHARD_INDEX: ${{ matrix.shardIndex }}
          SHARD_TOTAL: ${{ matrix.shardTotal }}
          PLAYWRIGHT_BLOB_OUTPUT_NAME: report-${{ matrix.shardIndex }}.zip
        run: |
          list="$RUNNER_TEMP/e2e-shard-$SHARD_INDEX.txt"
          node scripts/e2e-shard.ts select "$SHARD_INDEX" "$SHARD_TOTAL" "$list"
          npm run test:e2e -- --test-list="$list"
      # The blob report carries the results (and the traces, when asked for); the PNGs are the screenshots that differ from their
      # baselines, which the pull request comment shows. Playwright always writes .last-run.json, which keeps e2e/ the
      # artifact's root (the folder its files share) when there are no PNGs, so the report job finds blob-report/.
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: ${{ !cancelled() }}
        with:
          name: e2e-shard-${{ matrix.shardIndex }}
          path: |
            e2e/blob-report
            e2e/test-results/.last-run.json
            e2e/test-results/**/*.png
          include-hidden-files: true
          if-no-files-found: ignore
          retention-days: 1

  # These runs keep their reports on the originating run. Other reports are merged by e2e-publish.yml.
  report:
    needs: test
    if: >-
      ${{ !cancelled() && (github.event_name == 'workflow_dispatch' ||
      (github.event_name == 'pull_request' &&
      (github.event.pull_request.head.repo.full_name != github.repository || github.actor == 'dependabot[bot]'))) }}
    uses: ./.github/workflows/e2e-report.yml
    permissions:
      actions: read
      contents: read
